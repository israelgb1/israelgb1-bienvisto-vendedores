<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bien Visto · Vendedores</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 311 203' role='img' aria-labelledby='t'><g transform='translate(-10 -41)'><path fill='%230E6B5C' d='M62 163 L62 78 A16 16 0 0 0 30 78 L30 163 A16 16 0 0 0 62 163 Z'/><path fill='%230E6B5C' fill-rule='evenodd' d='M30 163 A59 59 0 1 1 148 163 A59 59 0 1 1 30 163 Z M62 163 A27 27 0 1 0 116 163 A27 27 0 1 0 62 163 Z'/><path fill='%23F2A71B' d='M159.53 150 L197.35 215.5 A15 15 0 0 0 223.33 215.5 L298.96 84.5 A15 15 0 0 0 272.98 69.5 L210.34 178 L185.51 135 A15 15 0 0 0 159.53 150 Z'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..600&family=Figtree:wght@400..600&display=swap" rel="stylesheet">
<style>
/* Tokens del brandbook v1.2 */
:root{
  --verde-visto:#0E6B5C;
  --ambar-resena:#F2A71B;
  --ambar-texto:#8A5A00;
  --tinta:#12302B;
  --tinta-suave:#4A5F59;
  --crema:#FBF6EC;
  --menta:#E7F0EC;
  --borde-fuerte:#6B897E;
  --borde:#CFDDD6;
  --error:#B3261E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--crema);color:var(--tinta);font-family:Figtree,system-ui,sans-serif;font-weight:400;font-size:17px;line-height:28px}
body{min-height:100vh;overflow-x:hidden}
main{max-width:420px;margin:0 auto;padding:32px 16px;text-align:left}
.cabecera{margin:0 0 4px}
.isologo{display:block;width:220px;max-width:100%;height:auto}
.etiqueta{font-family:Figtree,system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar-texto);margin:0 0 24px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:36px;line-height:42px;margin:0 0 16px;color:var(--tinta);font-style:normal;text-decoration:none}
h1 .segunda{color:var(--verde-visto)}
label{display:block;font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--tinta-suave);margin:0 0 6px;font-weight:600}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--borde-fuerte);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus{outline:3px solid var(--verde-visto);outline-offset:1px}
button{font-family:Figtree,system-ui,sans-serif;font-weight:600;font-size:16px;line-height:24px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--verde-visto);color:var(--crema);cursor:pointer;margin-top:12px}
button:focus-visible{outline:3px solid var(--ambar-resena);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.sec{background:transparent;color:var(--verde-visto);border:1px solid var(--borde-fuerte)}
.msg{min-height:24px;margin:16px 0 0;font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:24px;color:var(--tinta-suave)}
.msg.err{color:var(--error)}
.msg.ok{color:var(--tinta-suave)}
.guia{margin:0 0 24px;color:var(--tinta);font-size:17px;line-height:28px}
.guia ol{margin:8px 0 0;padding-left:20px}
.guia li{margin:4px 0}
.paso[hidden]{display:none}
.bloque{margin-top:8px}
.fila{display:flex;gap:8px;align-items:center;justify-content:space-between}
.enlace{background:none;border:0;color:var(--verde-visto);padding:0;width:auto;margin:0;font-size:14px;line-height:20px;font-weight:600;text-decoration:underline}
.pie{margin-top:40px;padding-top:20px;border-top:1px solid var(--borde);font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--tinta-suave);text-align:center}
.pie a{color:var(--verde-visto);font-weight:600}
.pie .boton-soporte{display:inline-block;text-align:center;text-decoration:none;width:auto;padding:10px 16px;margin-top:12px;background:transparent;color:var(--verde-visto);border:1px solid var(--borde-fuerte);border-radius:10px;font-size:15px}
.enlace:disabled{color:var(--tinta-suave);text-decoration:none}
[hidden]{display:none!important}
/* Panel de vendedor (fase 1: diseño del mockup, datos reales) */
:root{--verde:var(--verde-visto);--verde-h:#0A5246;--ambar:var(--ambar-resena);--muted:var(--tinta-suave);--borde-s:var(--borde-fuerte)}
body.con-tabs .etiqueta{display:none}
body.con-tabs{background:var(--menta)}
body.con-tabs #cabecera-login,body.con-tabs .pie{display:none}
body.con-tabs main{max-width:none;padding:0;margin:0}
#paso-sesion{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--crema);position:relative}
textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta);min-height:80px}
#paso-sesion .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;height:62px;background:var(--menta);border-bottom:1px solid var(--borde);flex:none}
.bar .iso{width:38px;height:auto;flex:none}
.bar .grow{flex:1}
.bk{width:auto;margin:0;padding:8px 12px;min-height:40px;border-radius:999px;background:transparent;color:var(--verde);border:2px solid var(--verde);font-size:14px}
.hmb{width:auto;margin:0;padding:0 14px;height:46px;border-radius:14px;background:var(--verde);color:var(--crema);font-size:16px;display:flex;align-items:center;gap:8px}
.hmb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
#app{flex:1;padding:14px 16px 110px;overflow-x:hidden}
#app h2{font-size:28px;line-height:34px;margin:6px 0 14px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:#fff;border-top:1px solid var(--borde);z-index:10}
.tabs button{flex:1;width:auto;margin:0;padding:8px 0 10px;border-radius:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;line-height:1.15}
.tabs button[aria-current="page"]{color:var(--verde);box-shadow:inset 0 3px 0 var(--verde)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{width:100%;min-height:52px;padding:14px 24px;margin:0 0 12px;border-radius:999px;border:2px solid transparent;font:600 17px/20px Figtree,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--verde);color:var(--crema)}
.btn.a{background:var(--ambar);color:var(--tinta)}
.btn.s{background:transparent;color:var(--tinta);border-color:var(--borde-s)}
.btn.sm{width:auto;min-height:44px;padding:10px 18px;font-size:15px}
.btn[disabled]{opacity:.45}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--verde);color:var(--crema);border-radius:20px;padding:18px;margin:0 0 12px;border:0;font-weight:400}
.hero b{display:block;font:600 22px/1.15 "Bricolage Grotesque",system-ui,sans-serif}
.hero small{display:block;font-size:14px;opacity:.92}
.hero-ico{width:52px;height:52px;border-radius:50%;background:var(--ambar);display:grid;place-items:center;flex:none}
.hero-ico svg{width:26px;height:26px}
.hero .grande{color:var(--crema);margin:4px 0}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px;margin:0 0 12px}
.tarjeta b{display:block;font-weight:600;font-size:17px}
.tarjeta span{display:block;font-size:15px;color:var(--muted)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .tarjeta{margin:0}
.lista{list-style:none;padding:0;margin:0}
.lista li{margin:0 0 8px}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:0;padding:14px;background:#fff;color:var(--tinta);border:1px solid var(--borde);border-radius:16px;font-weight:400;min-height:60px;text-decoration:none}
.item b{display:block;font-weight:600;font-size:17px}
.item span{font-size:15px;color:var(--muted)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.folio{font:600 34px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.08em;color:var(--verde)}
.folio.sm{font-size:20px}
.chip{display:inline-flex;align-items:center;font:600 13px/1 Figtree,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--ambar);color:var(--tinta);white-space:nowrap}
.chip.v{background:var(--menta);color:var(--verde)}
.chip.g{background:#eef0ef;color:var(--muted)}
.chip.r{background:#f7e3e1;color:var(--error)}
.lbl{font:600 14px/18px Figtree,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 6px}
.hint{font-size:15px;color:var(--muted);margin:4px 0 14px}
.campo{display:block;margin:0 0 14px}
.aviso{background:var(--menta);border-radius:12px;padding:12px 14px;margin:0 0 12px;color:var(--tinta)}
.aviso.alerta{background:#f7e3e1;color:var(--error)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0 0 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.grande{font:600 40px/1 "Bricolage Grotesque",system-ui,sans-serif;display:block;margin:6px 0}
.drawer{position:fixed;inset:0;background:rgba(18,48,43,.55);z-index:20;display:flex;justify-content:flex-end;max-width:440px;margin:0 auto}
.drawer-in{background:var(--crema);width:88%;max-width:330px;height:100%;padding:16px 12px 20px;overflow-y:auto}
.drawer .x{width:44px;height:44px;border-radius:50%;background:var(--menta);font-size:20px;margin:0 0 10px;padding:0}
.drawer nav a{display:flex;align-items:center;min-height:50px;padding:10px 8px;border-radius:12px;font-weight:600;color:var(--tinta);text-decoration:none;font-size:16px}
.drawer nav a:hover,.drawer nav a:focus-visible{background:var(--menta)}
.drawer .btn{margin-top:12px}
.opcion{display:flex;gap:10px;align-items:center;font-size:16px;margin:0 0 10px}
select{width:100%;min-height:48px;padding:10px 14px;font:400 17px/24px Figtree,system-ui,sans-serif;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta)}
.opcion input{width:auto;min-height:0;margin:0}
</style>
</head>
<body>
<main>
  <header class="cabecera" id="cabecera-login">

  </header>
  <p class="etiqueta">Acceso para vendedores</p>

  <section id="cargando" class="paso">
    <p class="msg ok">Cargando…</p>
  </section>

  <section id="paso-correo" class="paso" hidden>
    <h1>Entra a tu<br><span class="segunda">panel.</span></h1>
    <p class="guia">Tu panel de vendedor. Entra con el código que te enviamos por correo.</p>
    <form id="form-correo" novalidate>
      <label for="correo">Correo registrado</label>
      <input id="correo" name="correo" type="email" autocomplete="email" placeholder="Ej. nombre@correo.com" required>
      <button id="btn-enviar" type="submit">Enviar código</button>
    </form>
    <p id="msg-correo" class="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="paso-codigo" class="paso" hidden>
    <form id="form-codigo" novalidate>
      <label for="codigo">Código de 6 dígitos</label>
      <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button id="btn-entrar" type="submit">Entrar</button>
    </form>
    <div class="bloque fila">
      <button id="btn-reenviar" class="enlace" type="button" disabled>Reenviar código</button>
      <button id="btn-cambiar" class="enlace" type="button">Cambiar correo</button>
    </div>
    <p id="msg-codigo" class="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="paso-sesion" class="paso" hidden>
    <header class="bar">
      <button type="button" id="btn-atras" class="bk" hidden>&larr; Atrás</button>
      <a href="#/hoy" aria-label="Ir al inicio" style="display:inline-flex;line-height:0"><svg class="iso" viewBox="0 41 311 203" aria-hidden="true" focusable="false"><path fill="#0E6B5C" d="M62 163 L62 78 A16 16 0 0 0 30 78 L30 163 A16 16 0 0 0 62 163 Z"/><path fill="#0E6B5C" fill-rule="evenodd" d="M30 163 A59 59 0 1 1 148 163 A59 59 0 1 1 30 163 Z M62 163 A27 27 0 1 0 116 163 A27 27 0 1 0 62 163 Z"/><path fill="#F2A71B" d="M159.53 150 L197.35 215.5 A15 15 0 0 0 223.33 215.5 L298.96 84.5 A15 15 0 0 0 272.98 69.5 L210.34 178 L185.51 135 A15 15 0 0 0 159.53 150 Z"/></svg></a>
      <span class="grow"></span>
      <button type="button" id="btn-menu" class="hmb" aria-haspopup="dialog" aria-controls="cajon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menú</button>
    </header>

    <div id="app" tabindex="-1"></div>

    <nav class="tabs" aria-label="Secciones">
      <button type="button" data-tab="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>
      <button type="button" data-tab="varios"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7"/></svg>Varios</button>

    </nav>

    <div id="cajon" class="drawer" hidden>
      <div class="drawer-in">
        <button type="button" id="btn-cerrar-cajon" class="x" aria-label="Cerrar menú">&times;</button>
        <nav>
          <a href="#/hoy">Inicio</a>
          <a href="#/displays">Mis displays</a>
          <a href="#/saldo">Mi saldo</a>
          <a href="#/ventas">Mis ventas</a>
          <a href="#/varios">Varios</a>
          <a href="#/cuenta">Mi cuenta</a>
        </nav>
        <button type="button" id="btn-salir" class="btn s">Cerrar sesión</button>
      </div>
    </div>
  </section>
  <footer class="pie">
    <p>¿Quieres vender Bien Visto? <a href="https://bienvisto.com.mx/vendedores">Conoce el programa</a>.</p>
    <p>¿Necesitas ayuda para entrar?</p>
    <a class="boton-soporte" href="https://wa.me/522201435851?text=Hola%2C%20vengo%20de%20la%20p%C3%A1gina%20de%20acceso%20para%20vendedores%20de%20Bien%20Visto%20%28vendedores.bienvisto.com.mx%29%20y%20necesito%20ayuda%20para%20entrar." target="_blank" rel="noopener">Hablar con soporte</a>
  </footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COOLDOWN_SEG = 60;
  const MSG_CORREO_INVALIDO = "Escribe un correo válido.";
  const MSG_ENVIADO = "Si el correo está registrado, te enviamos un código.";
  const MSG_FALLO_CODIGO = "Código incorrecto o vencido.";
  const MSG_ERROR_RED = "No pudimos conectar. Intenta de nuevo.";
  const MSG_ERROR_GENERAL = "Algo salió mal. Intenta más tarde.";

  let correoActual = "";
  let timerReenvio = null;

  function mostrar(id) {
    for (const s of document.querySelectorAll(".paso")) s.hidden = s.id !== id;
    enPanel = id === "paso-sesion";
    document.body.classList.toggle("con-tabs", id === "paso-sesion");
    if (id === "paso-sesion") entrarPanel();
  }

  function texto(el, msg, tipo) {
    el.textContent = msg;
    el.className = "msg " + (tipo || "ok");
  }

  async function llamar(ruta, cuerpo) {
    const res = await fetch(ruta, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo || {}),
    });
    let datos = null;
    try { datos = await res.json(); } catch (_) { datos = null; }
    return { status: res.status, datos };
  }

  function iniciarEsperaReenvio() {
    const btn = $("btn-reenviar");
    let restante = COOLDOWN_SEG;
    btn.disabled = true;
    btn.textContent = `Reenviar en ${restante} s`;
    clearInterval(timerReenvio);
    timerReenvio = setInterval(() => {
      restante -= 1;
      if (restante <= 0) {
        clearInterval(timerReenvio);
        btn.disabled = false;
        btn.textContent = "Reenviar código";
      } else {
        btn.textContent = `Reenviar en ${restante} s`;
      }
    }, 1000);
  }

  async function pedirCodigo(e, desdeCodigo) {
    if (e) e.preventDefault();
    const correo = $("correo").value.trim();
    const msg = desdeCodigo ? $("msg-codigo") : $("msg-correo");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return texto(msg, MSG_CORREO_INVALIDO, "err");
    $("btn-enviar").disabled = true;
    try {
      const { status, datos } = await llamar("/api/vendedor/codigo", { correo });
      if (status === 400) return texto(msg, MSG_CORREO_INVALIDO, "err");
      if (status !== 200 || !datos || datos.success !== true) return texto(msg, MSG_ERROR_GENERAL, "err");
      correoActual = correo;
      $("codigo").value = "";
      texto($("msg-codigo"), MSG_ENVIADO, "ok");
      mostrar("paso-codigo");
      iniciarEsperaReenvio();
      $("codigo").focus();
    } catch (_) {
      texto(msg, MSG_ERROR_RED, "err");
    } finally {
      $("btn-enviar").disabled = false;
    }
  }

  async function verificarCodigo(e) {
    if (e) e.preventDefault();
    const codigo = $("codigo").value.trim();
    const msg = $("msg-codigo");
    if (!/^\d{6}$/.test(codigo)) return texto(msg, "Escribe los 6 dígitos del código.", "err");
    $("btn-entrar").disabled = true;
    try {
      const { status, datos } = await llamar("/api/vendedor/verificar", { correo: correoActual, codigo });
      if (status === 200 && datos && datos.success === true) {
        clearInterval(timerReenvio);
        return mostrar("paso-sesion");
      }
      if (status === 401) return texto(msg, MSG_FALLO_CODIGO, "err");
      if (status === 400) return texto(msg, "Revisa el código e intenta de nuevo.", "err");
      texto(msg, MSG_ERROR_GENERAL, "err");
    } catch (_) {
      texto(msg, MSG_ERROR_RED, "err");
    } finally {
      $("btn-entrar").disabled = false;
    }
  }

  function volverACorreo() {
    clearInterval(timerReenvio);
    correoActual = "";
    texto($("msg-correo"), "", "ok");
    mostrar("paso-correo");
    $("correo").focus();
  }

  async function cerrarSesion() {
    try { await llamar("/api/vendedor/salir"); } catch (_) { /* se limpia igual en pantalla */ }
    volverACorreo();
  }

  async function iniciar() {
    try {
      const res = await fetch("/api/vendedor/yo");
      if (res.ok) return mostrar("paso-sesion");
    } catch (_) { /* sin conexión: mostramos la entrada */ }
    mostrar("paso-correo");
    $("correo").focus();
  }

  $("form-correo").addEventListener("submit", pedirCodigo);
  $("form-codigo").addEventListener("submit", verificarCodigo);
  $("btn-reenviar").addEventListener("click", (e) => pedirCodigo(e, true));
  $("btn-cambiar").addEventListener("click", volverACorreo);
  // ===== Panel del vendedor =====
  const $$ = (sel) => document.querySelectorAll(sel);
  const app = $("app");
  const dinero = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(Number(n) || 0);
  const enc = (s) => encodeURIComponent(s);
  const WA_AYUDA = "https://wa.me/522201435851?text=" + encodeURIComponent("Hola, soy vendedor de Bien Visto y necesito ayuda con mi panel.");
  const ESTADOS = {
    libre: ["Libre", "g"], activo: ["Activo", "v"], retirado: ["Retirado", "r"],
    pendiente: ["Pendiente", ""], rev: ["En revisión", ""], cobrada: ["Cobrada", "v"],
    entregada: ["Entregada", "v"], anulada: ["Anulada", "r"],
  };
  const ICONO_NFC = '<svg viewBox="0 0 24 24" fill="none" stroke="#12302B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="#12302B"/><path d="M10 8.5a5 5 0 0 1 0 7M13.5 5.8a9 9 0 0 1 0 12.4M17 3.2a13 13 0 0 1 0 17.6"/></svg>';

  let nombreVend = "";
  let enPanel = false;
  let ventasCache = [];
  let aviso = null;
  let turno = 0;

  function el(tag, props, hijos) {
    const n = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (k === "texto") n.textContent = v;
      else if (k === "clase") n.className = v;
      else if (k === "on") { for (const ev in v) n.addEventListener(ev, v[ev]); }
      else if (k === "checked") n.checked = !!v;
      else n.setAttribute(k, v);
    }
    for (const h of hijos || []) n.append(h);
    return n;
  }

  // Solo recibe SVG fijos del código, nunca datos del servidor.
  function icono(svgFijo) {
    const t = document.createElement("template");
    t.innerHTML = svgFijo.trim();
    return t.content.firstChild;
  }

  function chip(estado) {
    const [txt, cls] = ESTADOS[estado] || [estado, "g"];
    return el("span", { clase: ("chip " + cls).trim(), texto: txt });
  }

  function campo(etiqueta, control) {
    return el("label", { clase: "campo" }, [el("span", { clase: "lbl", texto: etiqueta }), control]);
  }

  function menuItem(txt, href) {
    return el("button", { type: "button", clase: "item", on: { click: () => ir(href) } }, [el("b", { texto: txt })]);
  }

  function conAviso(nodos) {
    if (aviso) { nodos.unshift(el("div", { clase: "aviso", texto: aviso })); aviso = null; }
    return nodos;
  }

  const ir = (ruta) => { location.hash = ruta; };
  const ruta = () => location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map((p) => decodeURIComponent(p));

  function sesionCaducada() {
    enPanel = false;
    volverACorreo();
    texto($("msg-correo"), "Tu sesión venció. Entra de nuevo con tu correo.", "err");
  }

  async function getJSON(rutaApi) {
    const res = await fetch(rutaApi);
    if (res.status === 401) { sesionCaducada(); return null; }
    if (!res.ok) throw new Error("http " + res.status);
    return res.json();
  }

  async function postJSON(rutaApi, cuerpo) {
    const res = await fetch(rutaApi, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo || {}),
    });
    if (res.status === 401) { sesionCaducada(); return { status: 401, datos: null }; }
    let datos = null;
    try { datos = await res.json(); } catch (_) { datos = null; }
    return { status: res.status, datos };
  }

  function errorDe(datos) {
    return (datos && datos.error) || MSG_ERROR_GENERAL;
  }

  const PANTALLAS = {
    hoy: pHoy, vender: pVender, displays: pDisplays, d: pDetalle, solicitar: pSolicitar, saldo: pSaldo,
    ventas: pVentas, v: pVenta, varios: pVarios, cuenta: pCuenta, p: pProximamente,
  };
  const PESTANA = { hoy: "hoy", vender: "hoy", displays: "displays", d: "displays", saldo: "saldo" };

  async function render() {
    if (!enPanel) return;
    const r = ruta();
    const pantalla = r.length ? r[0] : "hoy";
    const fn = PANTALLAS[pantalla] || pHoy;
    const mi = ++turno;
    const pestana = PESTANA[pantalla] || "varios";
    for (const b of $$(".tabs button")) {
      if (b.dataset.tab === pestana) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    }
    $("btn-atras").hidden = pantalla === "hoy";
    app.replaceChildren(el("p", { clase: "hint", texto: "Cargando…" }));
    window.scrollTo(0, 0);
    try {
      const nodos = await fn(r.slice(1));
      if (mi === turno && nodos) app.replaceChildren(...nodos);
    } catch (_) {
      if (mi === turno) app.replaceChildren(el("p", { clase: "msg err", texto: MSG_ERROR_RED }));
    }
  }

  async function entrarPanel() {
    enPanel = true;
    try {
      const d = await getJSON("/api/vendedor/yo");
      if (d) nombreVend = d.nombre || "";
    } catch (_) { /* la pantalla muestra su propio error */ }
    if (!location.hash || location.hash === "#") ir("#/hoy");
    render();
  }

  async function pHoy() {
    const [s, d] = await Promise.all([getJSON("/api/vendedor/saldo"), getJSON("/api/vendedor/displays")]);
    if (!s || !d) return null;
    const libres = (d.displays || []).filter((x) => x.estado === "libre").length;
    const primer = nombreVend.split(" ")[0] || "";
    const plazo = s.horas_restantes === null ? "Sin plazo corriendo"
      : s.plazo_vencido ? "Plazo vencido"
      : s.horas_restantes + " h para entregar";
    const folioInput = el("input", { placeholder: "Ej. M3K7", maxlength: "4", autocomplete: "off", "aria-label": "Folio del display" });
    const nodos = [el("h2", { texto: "Hola, " + primer })];
    if (s.impago) nodos.push(el("div", { clase: "aviso alerta", texto: "Tienes un adeudo por impago. No puedes activar displays nuevos." }));
    nodos.push(
      el("button", { type: "button", clase: "hero", on: { click: () => ir("#/vender") } }, [
        el("span", { clase: "hero-ico" }, [icono(ICONO_NFC)]),
        el("span", {}, [el("b", { texto: "Vender un display" }), el("small", { texto: "Acerca tu celular al display para empezar." })]),
      ]),
      el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/p/" + enc("Escanear el QR del display")) } }, ["Escanear el QR del display"]),
      el("span", { clase: "lbl", texto: "¿Prefieres escribir el folio?" }),
      el("form", { novalidate: "", on: { submit: (e) => {
        e.preventDefault();
        const folio = folioInput.value.trim().toUpperCase();
        if (folio.length === 4) ir("#/vender/" + enc(folio));
      } } }, [folioInput]),
      el("p", { clase: "hint", texto: "Son 4 caracteres y abre solo." }),
      el("div", { clase: "dos" }, [
        el("div", { clase: "tarjeta" }, [el("b", { texto: "Debes entregar " + dinero(s.custodia) }), el("span", { texto: plazo })]),
        el("div", { clase: "tarjeta" }, [el("b", { texto: libres + (libres === 1 ? " libre" : " libres") }), el("span", { texto: "en tu inventario" })]),
      ]),
    );
    return conAviso(nodos);
  }

  async function pDisplays() {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const lista = d.displays || [];
    const ul = el("ul", { clase: "lista" });
    const pintar = (filtro) => {
      const f = (filtro || "").toUpperCase();
      ul.replaceChildren(...lista.filter((x) => !f || x.folio.includes(f)).map((x) =>
        el("li", {}, [
          el("button", { type: "button", clase: "item", on: { click: () => ir("#/d/" + enc(x.folio)) } }, [
            el("div", { clase: "fila" }, [el("span", { clase: "folio sm", texto: x.folio }), chip(x.estado)]),
            el("span", { texto: x.negocio_asignado || "Sin negocio asignado" }),
          ]),
        ])
      ));
    };
    pintar("");
    const buscar = el("input", { placeholder: "Buscar por folio", "aria-label": "Buscar por folio", on: { input: () => pintar(buscar.value.trim()) } });
    if (!lista.length) return conAviso([el("h2", { texto: "Mis displays" }), el("p", { clase: "hint", texto: "Aún no tienes displays asignados." })]);
    return conAviso([el("h2", { texto: "Mis displays" }), buscar, ul]);
  }

  async function pDetalle([folio]) {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const f = (d.displays || []).find((x) => x.folio === folio);
    if (!f) return [el("p", { clase: "msg err", texto: "No encontramos ese display." })];
    const botones = [];
    if (f.estado === "activo") {
      botones.push(el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/solicitar/" + enc(f.folio) + "/reponer") } }, ["Pedir reposición"]));
      botones.push(el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/solicitar/" + enc(f.folio) + "/cambiar") } }, ["Cambiar de negocio"]));
    }
    if (f.estado === "libre") {
      botones.push(el("button", { type: "button", clase: "btn p", on: { click: () => ir("#/vender/" + enc(f.folio)) } }, ["Activar display"]));
    }
    return [
      el("div", { clase: "tarjeta centro" }, [
        el("span", { clase: "lbl", texto: "Display" }),
        el("div", { clase: "folio", texto: f.folio }),
        el("div", { clase: "fila" }, [chip(f.estado)]),
      ]),
      el("dl", { clase: "kv" }, [el("dt", { texto: "Negocio" }), el("dd", { texto: f.negocio_asignado || "—" })]),
      ...botones,
    ];
  }

  async function pSolicitar([folio, tipo]) {
    const cambiar = tipo === "cambiar";
    const msg = el("p", { clase: "msg", role: "status" });
    const nuevo = el("input", { maxlength: "200" });
    const url = el("input", { type: "url", placeholder: "https://..." });
    const motivo = el("input", { maxlength: "200" });
    const nota = el("textarea", { maxlength: "500" });
    const boton = el("button", { type: "submit", clase: "btn p" }, [cambiar ? "Enviar solicitud de cambio" : "Enviar solicitud de reposición"]);
    const form = el("form", { novalidate: "" }, [
      el("span", { clase: "lbl", texto: "Display" }),
      el("div", { clase: "folio sm", texto: folio }),
      ...(cambiar ? [campo("Nombre del nuevo negocio", nuevo), campo("Enlace de reseña de Google del nuevo negocio", url)] : []),
      campo("Motivo (opcional)", motivo),
      campo("Nota (opcional)", nota),
      boton,
      msg,
    ]);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      texto(msg, "", "ok");
      const cuerpo = { tipo: cambiar ? "cambiar" : "reponer", folio, motivo: motivo.value.trim(), nota: nota.value.trim() };
      if (cambiar) {
        cuerpo.nuevo_negocio = nuevo.value.trim();
        cuerpo.url_resena = url.value.trim();
        if (!cuerpo.nuevo_negocio) return texto(msg, "Escribe el nombre del nuevo negocio.", "err");
        if (!/^https:\/\//.test(cuerpo.url_resena)) return texto(msg, "El enlace debe empezar con https://", "err");
      }
      boton.disabled = true;
      try {
        const { status, datos } = await postJSON("/api/vendedor/solicitudes", cuerpo);
        if (status === 201 && datos && datos.success) {
          form.reset();
          texto(msg, "Solicitud enviada.", "ok");
        } else if (status !== 401) {
          texto(msg, errorDe(datos), "err");
        }
      } catch (_) {
        texto(msg, MSG_ERROR_RED, "err");
      } finally {
        boton.disabled = false;
      }
    });
    return [el("h2", { texto: cambiar ? "Cambiar de negocio" : "Pedir reposición" }), form];
  }

  async function pSaldo() {
    const s = await getJSON("/api/vendedor/saldo");
    if (!s) return null;
    const plazo = s.horas_restantes === null ? "No tienes ventas cobradas pendientes de entregar."
      : s.plazo_vencido ? "Tu plazo de entrega venció. Entrega lo cobrado para activar displays nuevos."
      : "Te quedan " + s.horas_restantes + " horas para entregar lo cobrado.";
    const nodos = [
      el("h2", { texto: "Mi saldo" }),
      el("div", { clase: "hero" }, [
        el("span", {}, [
          el("span", { clase: "lbl", texto: "Debes entregar" }),
          el("span", { clase: "grande", texto: dinero(s.custodia) }),
          el("small", { texto: "Tu tope es " + dinero(s.tope) }),
        ]),
      ]),
      el("div", { clase: "tarjeta" }, [el("b", { texto: "Plazo de entrega" }), el("span", { texto: plazo })]),
    ];
    if (s.impago) nodos.push(el("div", { clase: "aviso alerta", texto: "Tienes un adeudo por impago. No puedes activar displays nuevos hasta resolverlo." }));
    nodos.push(el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/p/" + enc("Avisar entrega")) } }, ["Avisar entrega"]));
    return nodos;
  }

  async function pVentas() {
    const d = await getJSON("/api/vendedor/ventas");
    if (!d) return null;
    ventasCache = d.ventas || [];
    const nodos = [el("h2", { texto: "Mis ventas" })];
    if (!ventasCache.length) {
      nodos.push(el("p", { clase: "hint", texto: "Aún no tienes ventas registradas." }));
    } else {
      nodos.push(el("ul", { clase: "lista" }, ventasCache.map((v) =>
        el("li", {}, [
          el("button", { type: "button", clase: "item", on: { click: () => ir("#/v/" + enc(v.id)) } }, [
            el("div", { clase: "fila" }, [el("b", { texto: v.negocio }), chip(v.estado)]),
            el("span", { texto: dinero(v.total) + " · " + (v.displays || 0) + " display(s) · " + String(v.created_at || "").slice(0, 10) }),
          ]),
        ])
      )));
    }
    return conAviso(nodos);
  }

  async function pVenta([id]) {
    if (!ventasCache.length) {
      const d = await getJSON("/api/vendedor/ventas");
      if (!d) return null;
      ventasCache = d.ventas || [];
    }
    const v = ventasCache.find((x) => x.id === id);
    if (!v) return [el("p", { clase: "msg err", texto: "No encontramos esa venta." })];
    const msg = el("p", { clase: "msg", role: "status" });
    const nodos = [
      el("h2", { texto: v.negocio }),
      el("div", { clase: "fila" }, [chip(v.estado)]),
      el("dl", { clase: "kv" }, [
        el("dt", { texto: "Total" }), el("dd", { texto: dinero(v.total) }),
        el("dt", { texto: "Por entregar" }), el("dd", { texto: dinero(v.a_entregar) }),
        el("dt", { texto: "Ya entregado" }), el("dd", { texto: dinero(v.entregado) }),
        el("dt", { texto: "Displays" }), el("dd", { texto: String(v.displays || 0) }),
      ]),
    ];
    if (v.estado === "pendiente") {
      const ref = el("input", { maxlength: "100" });
      const boton = el("button", { type: "button", clase: "btn p" }, ["Enviar a revisión"]);
      boton.addEventListener("click", async () => {
        boton.disabled = true;
        try {
          const { status, datos } = await postJSON("/api/vendedor/ventas/" + enc(v.id) + "/revision", { referencia: ref.value.trim() });
          if (status === 200 && datos && datos.success) {
            aviso = "Venta enviada a revisión.";
            ventasCache = [];
            render();
          } else if (status !== 401) {
            texto(msg, errorDe(datos), "err");
          }
        } catch (_) {
          texto(msg, MSG_ERROR_RED, "err");
        } finally {
          boton.disabled = false;
        }
      });
      nodos.push(campo("Referencia de transferencia (solo si te pagaron por transferencia)", ref), boton, msg);
    }
    if (["pendiente", "rev", "cobrada"].includes(v.estado) && Number(v.entregado || 0) === 0) {
      const anular = el("button", { type: "button", clase: "btn s" }, ["Pedir anulación"]);
      anular.addEventListener("click", async () => {
        anular.disabled = true;
        try {
          const { status, datos } = await postJSON("/api/vendedor/solicitudes", { tipo: "anular", venta_id: v.id });
          if (status === 201 && datos && datos.success) {
            aviso = "Solicitud de anulación enviada.";
            render();
          } else if (status !== 401) {
            texto(msg, errorDe(datos), "err");
          }
        } catch (_) {
          texto(msg, MSG_ERROR_RED, "err");
        } finally {
          anular.disabled = false;
        }
      });
      nodos.push(anular, msg);
    }
    return conAviso(nodos);
  }

  async function pVender([folioPre]) {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const libres = (d.displays || []).filter((x) => x.estado === "libre");
    const nodos = [el("h2", { texto: "Vender un display" })];
    if (!libres.length) {
      nodos.push(el("p", { clase: "hint", texto: "No tienes displays libres para vender." }));
      return conAviso(nodos);
    }
    const msg = el("p", { clase: "msg", role: "status" });
    let negocioElegido = null;
    let ventaPendiente = null;
    let turnoBusqueda = 0;
    let temporizador = null;
    const resultados = el("ul", { clase: "lista" });
    const elegido = el("div", { clase: "tarjeta", hidden: "" });
    const buscar = el("input", { placeholder: "Ej. Taquería Lupita Zapopan", maxlength: "100", autocomplete: "off", "aria-label": "Buscar negocio" });

    const pintarElegido = () => {
      elegido.replaceChildren(
        el("b", { texto: negocioElegido.nombre }),
        el("span", { texto: negocioElegido.direccion }),
        el("button", { type: "button", clase: "btn s sm", on: { click: () => { negocioElegido = null; elegido.hidden = true; } } }, ["Cambiar"])
      );
      elegido.hidden = false;
    };

    const buscarNegocio = async (q) => {
      const mi = ++turnoBusqueda;
      resultados.replaceChildren(el("li", {}, [el("span", { clase: "hint", texto: "Buscando…" })]));
      try {
        const res = await fetch("/api/vendedor/buscar-negocio?q=" + enc(q));
        if (res.status === 401) { sesionCaducada(); return; }
        const datos = await res.json().catch(() => null);
        if (mi !== turnoBusqueda) return;
        resultados.replaceChildren();
        if (!res.ok) { texto(msg, errorDe(datos), "err"); return; }
        const lista = (datos && datos.resultados) || [];
        if (!lista.length) {
          resultados.append(el("li", {}, [el("span", { clase: "hint", texto: "No encontramos ese negocio. Prueba con otro nombre." })]));
          return;
        }
        for (const r of lista) {
          resultados.append(el("li", {}, [
            el("button", { type: "button", clase: "item", on: { click: () => {
              negocioElegido = r;
              resultados.replaceChildren();
              buscar.value = r.nombre;
              pintarElegido();
            } } }, [el("b", { texto: r.nombre }), el("span", { texto: r.direccion })]),
          ]));
        }
      } catch (_) {
        if (mi === turnoBusqueda) texto(msg, MSG_ERROR_RED, "err");
      }
    };

    buscar.addEventListener("input", () => {
      clearTimeout(temporizador);
      const q = buscar.value.trim();
      if (negocioElegido && q !== negocioElegido.nombre) { negocioElegido = null; elegido.hidden = true; }
      if (q.length < 3) { turnoBusqueda++; resultados.replaceChildren(); return; }
      temporizador = setTimeout(() => buscarNegocio(q), 450);
    });

    const contacto = el("input", { maxlength: "120" });
    const whatsapp = el("input", { inputmode: "tel", placeholder: "Ej. 33 1234 5678" });
    const referencia = el("input", { maxlength: "100" });
    const campoRef = campo("Referencia de la transferencia", referencia);
    campoRef.hidden = true;
    const metodo = el("select", { on: { change: () => { campoRef.hidden = metodo.value !== "transferencia"; } } }, [
      el("option", { value: "efectivo", texto: "Efectivo" }),
      el("option", { value: "transferencia", texto: "Transferencia" }),
    ]);
    const lista = el("div", { clase: "campo" }, libres.map((f) =>
      el("label", { clase: "opcion" }, [el("input", { type: "checkbox", value: f.folio, name: "folio", checked: folioPre === f.folio }), f.folio])
    ));
    const enviar = el("button", { type: "button", clase: "btn p" }, ["Vender y activar"]);
    enviar.addEventListener("click", async () => {
      texto(msg, "", "ok");
      const seleccion = [...lista.querySelectorAll("input:checked")].map((i) => i.value);
      if (!negocioElegido) return texto(msg, "Elige el negocio de la lista.", "err");
      if (!seleccion.length) return texto(msg, "Elige al menos un display.", "err");
      if (metodo.value === "transferencia" && !referencia.value.trim()) return texto(msg, "La transferencia requiere referencia.", "err");
      enviar.disabled = true;
      try {
        if (!ventaPendiente) {
          const crear = await postJSON("/api/vendedor/ventas", {
            negocio: negocioElegido.nombre,
            contacto: contacto.value.trim(),
            whatsapp: whatsapp.value.trim(),
            metodo: metodo.value,
            folios: seleccion,
          });
          if (crear.status === 401) return;
          if (!(crear.status === 201 && crear.datos && crear.datos.success)) return texto(msg, errorDe(crear.datos), "err");
          ventaPendiente = crear.datos.id;
        }
        const cobro = await postJSON("/api/vendedor/ventas/" + enc(ventaPendiente) + "/cobro", {
          referencia: referencia.value.trim(),
          url_resena: negocioElegido.enlace_resena,
        });
        if (cobro.status === 401) return;
        if (cobro.status === 200 && cobro.datos && cobro.datos.success) {
          ventasCache = [];
          aviso = "Listo: " + cobro.datos.displays_activos + " display(s) activos para " + negocioElegido.nombre + ".";
          ir("#/displays");
        } else {
          texto(msg, errorDe(cobro.datos) + " La venta quedó pendiente: intenta de nuevo o envíala a revisión desde Ventas.", "err");
          enviar.textContent = "Reintentar activación";
        }
      } catch (_) {
        texto(msg, MSG_ERROR_RED + " La venta quedó pendiente: intenta de nuevo.", "err");
        enviar.textContent = "Reintentar activación";
      } finally {
        enviar.disabled = false;
      }
    });

    nodos.push(
      el("span", { clase: "lbl", texto: "1 · Negocio" }),
      buscar,
      el("p", { clase: "hint", texto: "Escribe el nombre y elige de la lista." }),
      resultados,
      elegido,
      el("span", { clase: "lbl", texto: "2 · Datos de la venta" }),
      campo("Persona de contacto (opcional)", contacto),
      campo("WhatsApp del negocio (opcional)", whatsapp),
      campo("Forma de pago", metodo),
      campoRef,
      el("span", { clase: "lbl", texto: "3 · Displays que activas" }),
      lista,
      enviar,
      msg,
    );
    return nodos;
  }

  async function pVarios() {
    return [
      el("h2", { texto: "Varios" }),
      el("div", { clase: "lista" }, [
        el("div", { clase: "campo" }, [menuItem("Mis ventas", "#/ventas")]),
        el("div", { clase: "campo" }, [menuItem("Mi cuenta", "#/cuenta")]),
        el("div", { clase: "campo" }, [menuItem("Mi desempeño y bono", "#/p/" + enc("Mi desempeño y bono"))]),
        el("div", { clase: "campo" }, [menuItem("Mis datos de cobro", "#/p/" + enc("Mis datos de cobro"))]),
        el("div", { clase: "campo" }, [menuItem("Activación en lote", "#/p/" + enc("Activación en lote"))]),
        el("a", { clase: "item", href: WA_AYUDA, target: "_blank", rel: "noopener" }, [el("b", { texto: "Hablar con soporte" }), el("span", { texto: "WhatsApp de Bien Visto" })]),
      ]),
    ];
  }

  async function pCuenta() {
    return [
      el("h2", { texto: "Mi cuenta" }),
      el("div", { clase: "tarjeta" }, [el("b", { texto: nombreVend || "Vendedor" }), el("span", { texto: "Vendedor activo" })]),
      el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/p/" + enc("Datos de cobro")) } }, ["Mis datos de cobro"]),
      el("a", { clase: "btn s", href: WA_AYUDA, target: "_blank", rel: "noopener" }, ["Hablar con soporte"]),
    ];
  }

  async function pProximamente([nombre]) {
    return [
      el("h2", { texto: nombre || "Próximamente" }),
      el("div", { clase: "tarjeta" }, [el("b", { texto: "Esta función llega pronto." }), el("span", { texto: "Por ahora puedes ver tus displays, tu saldo y tus ventas." })]),
    ];
  }

  function abrirCajon(abrir) { $("cajon").hidden = !abrir; }

  window.addEventListener("hashchange", () => { abrirCajon(false); render(); });
  $("btn-menu").addEventListener("click", () => abrirCajon(true));
  $("btn-cerrar-cajon").addEventListener("click", () => abrirCajon(false));
  $("cajon").addEventListener("click", (e) => { if (e.target.id === "cajon") abrirCajon(false); });
  $("btn-atras").addEventListener("click", () => { if (history.length > 1) history.back(); else ir("#/hoy"); });
  for (const b of $$(".tabs button")) b.addEventListener("click", () => ir("#/" + b.dataset.tab));
  $("btn-salir").addEventListener("click", cerrarSesion);
  iniciar();
})();
</script>
</body>
</html>
