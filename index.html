<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bien Visto · Vendedores</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 311 203' role='img' aria-labelledby='t'><g transform='translate(-10 -41)'><path fill='%230E6B5C' d='M62 163 L62 78 A16 16 0 0 0 30 78 L30 163 A16 16 0 0 0 62 163 Z'/><path fill='%230E6B5C' fill-rule='evenodd' d='M30 163 A59 59 0 1 1 148 163 A59 59 0 1 1 30 163 Z M62 163 A27 27 0 1 0 116 163 A27 27 0 1 0 62 163 Z'/><path fill='%23F2A71B' d='M159.53 150 L197.35 215.5 A15 15 0 0 0 223.33 215.5 L298.96 84.5 A15 15 0 0 0 272.98 69.5 L210.34 178 L185.51 135 A15 15 0 0 0 159.53 150 Z'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..600&family=Figtree:wght@400..600&display=swap" rel="stylesheet">
<style>
/* Tokens del brandbook v1.2 */
:root{
  --verde-visto:#0E6B5C;
  --ambar-resena:#F2A71B;
  --ambar-texto:#8A5A00;
  --tinta:#12302B;
  --tinta-suave:#4A5F59;
  --crema:#FBF6EC;
  --menta:#E7F0EC;
  --borde-fuerte:#6B897E;
  --borde:#CFDDD6;
  --error:#B3261E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--crema);color:var(--tinta);font-family:Figtree,system-ui,sans-serif;font-weight:400;font-size:17px;line-height:28px}
body{min-height:100vh;overflow-x:hidden}
main{max-width:420px;margin:0 auto;padding:32px 16px;text-align:left}
.cabecera{margin:0 0 4px}
.isologo{display:block;width:220px;max-width:100%;height:auto}
.etiqueta{font-family:Figtree,system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar-texto);margin:0 0 24px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:36px;line-height:42px;margin:0 0 16px;color:var(--tinta);font-style:normal;text-decoration:none}
h1 .segunda{color:var(--verde-visto)}
label{display:block;font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--tinta-suave);margin:0 0 6px;font-weight:600}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--borde-fuerte);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus{outline:3px solid var(--verde-visto);outline-offset:1px}
button{font-family:Figtree,system-ui,sans-serif;font-weight:600;font-size:16px;line-height:24px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--verde-visto);color:var(--crema);cursor:pointer;margin-top:12px}
button:focus-visible{outline:3px solid var(--ambar-resena);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.sec{background:transparent;color:var(--verde-visto);border:1px solid var(--borde-fuerte)}
.msg{min-height:24px;margin:16px 0 0;font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:24px;color:var(--tinta-suave)}
.msg.err{color:var(--error)}
.msg.ok{color:var(--tinta-suave)}
.guia{margin:0 0 24px;color:var(--tinta);font-size:17px;line-height:28px}
.guia ol{margin:8px 0 0;padding-left:20px}
.guia li{margin:4px 0}
.paso[hidden]{display:none}
.bloque{margin-top:8px}
.fila{display:flex;gap:8px;align-items:center;justify-content:space-between}
.enlace{background:none;border:0;color:var(--verde-visto);padding:0;width:auto;margin:0;font-size:14px;line-height:20px;font-weight:600;text-decoration:underline}
.pie{margin-top:40px;padding-top:20px;border-top:1px solid var(--borde);font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--tinta-suave);text-align:center}
.pie a{color:var(--verde-visto);font-weight:600}
.pie .boton-soporte{display:inline-block;text-align:center;text-decoration:none;width:auto;padding:10px 16px;margin-top:12px;background:transparent;color:var(--verde-visto);border:1px solid var(--borde-fuerte);border-radius:10px;font-size:15px}
.enlace:disabled{color:var(--tinta-suave);text-decoration:none}
[hidden]{display:none!important}
/* Panel de vendedor · diseño del prototipo, con datos reales */
:root{--verde:var(--verde-visto);--verde-h:#0A5246;--ambar:var(--ambar-resena);--muted:var(--tinta-suave);--borde-s:var(--borde-fuerte);--danger:var(--error);--fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:Figtree,system-ui,sans-serif}
body.con-tabs{background:var(--menta)}
body.con-tabs #cabecera-login,body.con-tabs .pie,body.con-tabs .etiqueta{display:none}
body.con-tabs main{max-width:none;padding:0;margin:0}
#paso-sesion{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--crema);position:relative}
#paso-sesion input{min-height:48px;border:2px solid var(--borde-s);border-radius:8px;padding:10px 14px;font-size:17px}
#paso-sesion input:focus{outline:3px solid var(--ambar);outline-offset:0;border-color:var(--tinta)}
#paso-sesion input[aria-invalid=true]{border-color:var(--danger)}
#paso-sesion select{width:100%;min-height:48px;padding:10px 14px;font:400 17px/24px var(--fb);border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta)}
#paso-sesion textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta);min-height:80px}
#paso-sesion .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;height:62px;background:var(--menta);border-bottom:1px solid var(--borde);flex:none}
.bar .iso{width:38px;height:auto;flex:none}
.bar .grow{flex:1}
.bk{width:auto;margin:0;padding:8px 12px;min-height:40px;border-radius:999px;background:transparent;color:var(--verde);border:2px solid var(--verde);font-size:14px}
.hmb{width:auto;margin:0;padding:0 14px;height:46px;border-radius:14px;background:var(--verde);color:var(--crema);font-size:16px;display:flex;align-items:center;gap:8px}
.hmb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
#app{flex:1;padding:14px 16px 110px;overflow-x:hidden}
#app h2{font:600 28px/34px var(--fd);margin:6px 0 14px;color:var(--tinta);letter-spacing:-.015em}
.sub{font-size:16px;color:var(--muted);margin:0 0 14px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:#fff;border-top:1px solid var(--borde);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;width:auto;margin:0;padding:8px 0 10px;border-radius:0;background:transparent;color:var(--muted);font:600 14px/1.15 var(--fb);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px}
.tabs button[aria-current="page"]{color:var(--verde);box-shadow:inset 0 3px 0 var(--verde)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{width:100%;min-height:52px;padding:14px 24px;margin:0 0 12px;border-radius:999px;border:2px solid transparent;font:600 17px/20px var(--fb);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--verde);color:var(--crema)}
.btn.a{background:var(--ambar);color:var(--tinta)}
.btn.s{background:transparent;color:var(--tinta);border-color:var(--borde-s)}
.btn.sm{width:auto;min-height:44px;padding:10px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.venta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--verde);color:var(--crema);border-radius:20px;padding:18px;margin:0 0 12px;border:0;min-height:88px;font-weight:400}
.venta .vi{width:56px;height:56px;border-radius:50%;background:var(--ambar);display:grid;place-items:center;flex:none}
.venta .vi svg{width:28px;height:28px}
.venta .vt b{display:block;font:600 22px/1.15 var(--fd)}
.venta .vt span{display:block;font-size:14px;opacity:.92;margin-top:2px}
.hero{background:var(--verde);color:var(--crema);border-radius:20px;padding:18px;margin:0 0 12px}
.hero .lbl{color:var(--crema);opacity:.9}
.hero small{display:block;font-size:14px;opacity:.92}
.hero .grande{color:var(--crema);margin:4px 0}
.card,.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px;margin:0 0 12px}
.card b,.tarjeta b{display:block;font-weight:600;font-size:17px}
.card span,.tarjeta span{display:block;font-size:15px;color:var(--muted)}
.centro{text-align:center}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .card,.dos .tarjeta{margin:0}
.lista{list-style:none;padding:0;margin:0}
.lista li{margin:0 0 8px}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:0;padding:14px;background:#fff;color:var(--tinta);border:1px solid var(--borde);border-radius:16px;font-weight:400;min-height:60px;text-decoration:none}
.item b{display:block;font-weight:600;font-size:17px}
.item span{font-size:15px;color:var(--muted)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.folio{font:600 34px/1 var(--fd);letter-spacing:.08em;color:var(--verde)}
.folio.sm{font-size:20px}
.chip{display:inline-flex;align-items:center;font:600 13px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--ambar);color:var(--tinta);white-space:nowrap}
.chip.v{background:var(--menta);color:var(--verde)}
.chip.g{background:#eef0ef;color:var(--muted)}
.chip.r{background:#f7e3e1;color:var(--danger)}
.lbl{font:600 14px/18px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 6px}
.hint{font-size:15px;color:var(--muted);margin:4px 0 14px}
.campo{display:block;margin:0 0 14px}
.aviso{background:var(--menta);border-radius:12px;padding:12px 14px;margin:0 0 12px;color:var(--tinta)}
.aviso.alerta{background:#f7e3e1;color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0 0 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.grande{font:600 40px/1 var(--fd);display:block;margin:6px 0}
.opcion{display:flex;gap:10px;align-items:center;font-size:16px;margin:0 0 10px}
.opcion input{width:auto;min-height:0;margin:0}
.res{border:1px solid var(--borde);border-radius:12px;overflow:hidden;background:#fff;margin-top:8px}
.drawer{position:fixed;inset:0;background:rgba(18,48,43,.55);z-index:20;display:flex;justify-content:flex-end;max-width:440px;margin:0 auto}
.drawer-in{background:var(--crema);width:88%;max-width:330px;height:100%;padding:16px 12px 20px;overflow-y:auto}
.drawer .x{width:44px;height:44px;border-radius:50%;background:var(--menta);font-size:20px;margin:0 0 10px;padding:0}
.drawer nav a{display:flex;align-items:center;min-height:50px;padding:10px 8px;border-radius:12px;font-weight:600;color:var(--tinta);text-decoration:none;font-size:16px}
.drawer nav a:hover,.drawer nav a:focus-visible{background:var(--menta)}
.drawer .btn{margin-top:12px}
.msg{margin:6px 0 0}
.barra{height:10px;border-radius:999px;background:var(--menta);overflow:hidden;margin:6px 0 10px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:999px}
a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 0 4px}
.seg button{width:auto;min-height:40px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--borde);font:600 14px/1 var(--fb);color:var(--tinta);white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--verde);color:var(--crema);border-color:var(--verde)}
.resultados{max-height:260px;overflow-y:auto;margin:4px 0 12px;padding:2px 2px 0 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.drawer-in{background:var(--crema);width:88%;max-width:340px;height:100%;padding:16px 14px 20px;overflow-y:auto}
.mn-top{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.mn-av{width:46px;height:46px;border-radius:50%;background:var(--verde);color:var(--crema);display:grid;place-items:center;font:600 17px/1 var(--fd);flex:none}
.mn-top .grow{flex:1;min-width:0}
.mn-top b{display:block;font:600 17px/1.2 var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-x{width:auto;margin:0 0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;background:var(--menta);font:600 15px/1 var(--fb);color:var(--tinta);display:inline-flex;align-items:center;gap:6px;flex:none}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 8px;border-radius:12px;min-height:54px;font-weight:600;color:var(--tinta);text-decoration:none;font-size:16px;background:transparent;border:0}
.mi:hover,.mi:focus-visible{background:var(--menta)}
.mi svg{width:22px;height:22px;fill:none;stroke:var(--verde);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mi small{display:block;font-weight:400;font-size:14px;color:var(--muted);line-height:1.25}
.mi .ch{margin-left:auto;font-size:12px;font-weight:600;background:var(--menta);border-radius:999px;padding:3px 9px;color:var(--verde);white-space:nowrap}
.msep{border-top:1px solid var(--borde);margin:8px 2px}
.mi-cuerpo{flex:1;min-width:0}
.mi-cuerpo span{display:block}
</style>
</head>
<body>
<main>
  <header class="cabecera" id="cabecera-login">

  </header>
  <p class="etiqueta">Acceso para vendedores</p>

  <section id="cargando" class="paso">
    <p class="msg ok">Cargando…</p>
  </section>

  <section id="paso-correo" class="paso" hidden>
    <h1>Entra a tu<br><span class="segunda">panel.</span></h1>
    <p class="guia">Tu panel de vendedor. Entra con el código que te enviamos por correo.</p>
    <form id="form-correo" novalidate>
      <label for="correo">Correo registrado</label>
      <input id="correo" name="correo" type="email" autocomplete="email" placeholder="Ej. nombre@correo.com" required>
      <button id="btn-enviar" type="submit">Enviar código</button>
    </form>
    <p id="msg-correo" class="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="paso-codigo" class="paso" hidden>
    <form id="form-codigo" novalidate>
      <label for="codigo">Código de 6 dígitos</label>
      <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button id="btn-entrar" type="submit">Entrar</button>
    </form>
    <div class="bloque fila">
      <button id="btn-reenviar" class="enlace" type="button" disabled>Reenviar código</button>
      <button id="btn-cambiar" class="enlace" type="button">Cambiar correo</button>
    </div>
    <p id="msg-codigo" class="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="paso-sesion" class="paso" hidden>
    <header class="bar">
      <button type="button" id="btn-atras" class="bk" hidden>&larr; Atrás</button>
      <a href="#/hoy" aria-label="Ir al inicio" style="display:inline-flex;line-height:0"><svg class="iso" viewBox="0 41 311 203" aria-hidden="true" focusable="false"><path fill="#0E6B5C" d="M62 163 L62 78 A16 16 0 0 0 30 78 L30 163 A16 16 0 0 0 62 163 Z"/><path fill="#0E6B5C" fill-rule="evenodd" d="M30 163 A59 59 0 1 1 148 163 A59 59 0 1 1 30 163 Z M62 163 A27 27 0 1 0 116 163 A27 27 0 1 0 62 163 Z"/><path fill="#F2A71B" d="M159.53 150 L197.35 215.5 A15 15 0 0 0 223.33 215.5 L298.96 84.5 A15 15 0 0 0 272.98 69.5 L210.34 178 L185.51 135 A15 15 0 0 0 159.53 150 Z"/></svg></a>
      <span class="grow"></span>
      <button type="button" id="btn-menu" class="hmb" aria-haspopup="dialog" aria-controls="cajon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menú</button>
    </header>

    <div id="app" tabindex="-1"></div>

    <nav class="tabs" aria-label="Secciones">
      <button type="button" data-tab="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>
      <button type="button" data-tab="varios"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7"/></svg>Varios</button>
      <button type="button" data-tab="displays"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>Mis displays</button>
      <button type="button" data-tab="saldo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Mi saldo</button>
    </nav>

    <div id="cajon" class="drawer" hidden>
      <div class="drawer-in" id="cajon-in"></div>
    </div>
  </section>
  <footer class="pie">
    <p>¿Quieres vender Bien Visto? <a href="https://bienvisto.com.mx/vendedores">Conoce el programa</a>.</p>
    <p>¿Necesitas ayuda para entrar?</p>
    <a class="boton-soporte" href="https://wa.me/522201435851?text=Hola%2C%20vengo%20de%20la%20p%C3%A1gina%20de%20acceso%20para%20vendedores%20de%20Bien%20Visto%20%28vendedores.bienvisto.com.mx%29%20y%20necesito%20ayuda%20para%20entrar." target="_blank" rel="noopener">Hablar con soporte</a>
  </footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COOLDOWN_SEG = 60;
  const MSG_CORREO_INVALIDO = "Escribe un correo válido.";
  const MSG_ENVIADO = "Si el correo está registrado, te enviamos un código.";
  const MSG_FALLO_CODIGO = "Código incorrecto o vencido.";
  const MSG_ERROR_RED = "No pudimos conectar. Intenta de nuevo.";
  const MSG_ERROR_GENERAL = "Algo salió mal. Intenta más tarde.";

  let correoActual = "";
  let timerReenvio = null;

  function mostrar(id) {
    for (const s of document.querySelectorAll(".paso")) s.hidden = s.id !== id;
    enPanel = id === "paso-sesion";
    document.body.classList.toggle("con-tabs", id === "paso-sesion");
    if (id === "paso-sesion") entrarPanel();
  }

  function texto(el, msg, tipo) {
    el.textContent = msg;
    el.className = "msg " + (tipo || "ok");
  }

  async function llamar(ruta, cuerpo) {
    const res = await fetch(ruta, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo || {}),
    });
    let datos = null;
    try { datos = await res.json(); } catch (_) { datos = null; }
    return { status: res.status, datos };
  }

  function iniciarEsperaReenvio() {
    const btn = $("btn-reenviar");
    let restante = COOLDOWN_SEG;
    btn.disabled = true;
    btn.textContent = `Reenviar en ${restante} s`;
    clearInterval(timerReenvio);
    timerReenvio = setInterval(() => {
      restante -= 1;
      if (restante <= 0) {
        clearInterval(timerReenvio);
        btn.disabled = false;
        btn.textContent = "Reenviar código";
      } else {
        btn.textContent = `Reenviar en ${restante} s`;
      }
    }, 1000);
  }

  async function pedirCodigo(e, desdeCodigo) {
    if (e) e.preventDefault();
    const correo = $("correo").value.trim();
    const msg = desdeCodigo ? $("msg-codigo") : $("msg-correo");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return texto(msg, MSG_CORREO_INVALIDO, "err");
    $("btn-enviar").disabled = true;
    try {
      const { status, datos } = await llamar("/api/vendedor/codigo", { correo });
      if (status === 400) return texto(msg, MSG_CORREO_INVALIDO, "err");
      if (status !== 200 || !datos || datos.success !== true) return texto(msg, MSG_ERROR_GENERAL, "err");
      correoActual = correo;
      $("codigo").value = "";
      texto($("msg-codigo"), MSG_ENVIADO, "ok");
      mostrar("paso-codigo");
      iniciarEsperaReenvio();
      $("codigo").focus();
    } catch (_) {
      texto(msg, MSG_ERROR_RED, "err");
    } finally {
      $("btn-enviar").disabled = false;
    }
  }

  async function verificarCodigo(e) {
    if (e) e.preventDefault();
    const codigo = $("codigo").value.trim();
    const msg = $("msg-codigo");
    if (!/^\d{6}$/.test(codigo)) return texto(msg, "Escribe los 6 dígitos del código.", "err");
    $("btn-entrar").disabled = true;
    try {
      const { status, datos } = await llamar("/api/vendedor/verificar", { correo: correoActual, codigo });
      if (status === 200 && datos && datos.success === true) {
        clearInterval(timerReenvio);
        return mostrar("paso-sesion");
      }
      if (status === 401) return texto(msg, MSG_FALLO_CODIGO, "err");
      if (status === 400) return texto(msg, "Revisa el código e intenta de nuevo.", "err");
      texto(msg, MSG_ERROR_GENERAL, "err");
    } catch (_) {
      texto(msg, MSG_ERROR_RED, "err");
    } finally {
      $("btn-entrar").disabled = false;
    }
  }

  function volverACorreo() {
    clearInterval(timerReenvio);
    correoActual = "";
    texto($("msg-correo"), "", "ok");
    mostrar("paso-correo");
    $("correo").focus();
  }

  async function cerrarSesion() {
    try { await llamar("/api/vendedor/salir"); } catch (_) { /* se limpia igual en pantalla */ }
    volverACorreo();
  }

  async function iniciar() {
    try {
      const res = await fetch("/api/vendedor/yo");
      if (res.ok) return mostrar("paso-sesion");
    } catch (_) { /* sin conexión: mostramos la entrada */ }
    mostrar("paso-correo");
    $("correo").focus();
  }

  $("form-correo").addEventListener("submit", pedirCodigo);
  $("form-codigo").addEventListener("submit", verificarCodigo);
  $("btn-reenviar").addEventListener("click", (e) => pedirCodigo(e, true));
  $("btn-cambiar").addEventListener("click", volverACorreo);
  // ===== Panel del vendedor =====
  const $$ = (sel) => document.querySelectorAll(sel);
  const app = $("app");
  const dinero = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(Number(n) || 0);
  const enc = (s) => encodeURIComponent(s);
  const WA_AYUDA = "https://wa.me/522201435851?text=" + encodeURIComponent("Hola, soy vendedor de Bien Visto y necesito ayuda con mi panel.");
  const ESTADOS = {
    libre: ["Libre", "g"], activo: ["Activo", "v"], retirado: ["Retirado", "r"], prueba: ["En prueba", ""],
    pendiente: ["Pendiente", ""], rev: ["En revisión", ""], cobrada: ["Cobrada", "v"],
    entregada: ["Entregada", "v"], anulada: ["Anulada", "r"],
  };
  const ICONO_NFC = '<svg viewBox="0 0 24 24" fill="none" stroke="#12302B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="#12302B"/><path d="M10 8.5a5 5 0 0 1 0 7M13.5 5.8a9 9 0 0 1 0 12.4M17 3.2a13 13 0 0 1 0 17.6"/></svg>';

  let nombreVend = "";
  let enPanel = false;
  let ventasCache = [];
  let aviso = null;
  let turno = 0;

  function el(tag, props, hijos) {
    const n = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (k === "texto") n.textContent = v;
      else if (k === "clase") n.className = v;
      else if (k === "on") { for (const ev in v) n.addEventListener(ev, v[ev]); }
      else if (k === "checked") n.checked = !!v;
      else n.setAttribute(k, v);
    }
    for (const h of hijos || []) n.append(h);
    return n;
  }

  // Solo recibe SVG fijos del código, nunca datos del servidor.
  function icono(svgFijo) {
    const t = document.createElement("template");
    t.innerHTML = svgFijo.trim();
    return t.content.firstChild;
  }

  function chip(estado) {
    const [txt, cls] = ESTADOS[estado] || [estado, "g"];
    return el("span", { clase: ("chip " + cls).trim(), texto: txt });
  }

  function campo(etiqueta, control) {
    return el("label", { clase: "campo" }, [el("span", { clase: "lbl", texto: etiqueta }), control]);
  }

  function menuItem(txt, href) {
    return el("button", { type: "button", clase: "item", on: { click: () => ir(href) } }, [el("b", { texto: txt })]);
  }

  function conAviso(nodos) {
    if (aviso) { nodos.unshift(el("div", { clase: "aviso", texto: aviso })); aviso = null; }
    return nodos;
  }

  const ir = (ruta) => { location.hash = ruta; };
  const ruta = () => location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map((p) => decodeURIComponent(p));

  function sesionCaducada() {
    enPanel = false;
    volverACorreo();
    texto($("msg-correo"), "Tu sesión venció. Entra de nuevo con tu correo.", "err");
  }

  async function getJSON(rutaApi) {
    const res = await fetch(rutaApi);
    if (res.status === 401) { sesionCaducada(); return null; }
    if (!res.ok) throw new Error("http " + res.status);
    return res.json();
  }

  async function postJSON(rutaApi, cuerpo) {
    const res = await fetch(rutaApi, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo || {}),
    });
    if (res.status === 401) { sesionCaducada(); return { status: 401, datos: null }; }
    let datos = null;
    try { datos = await res.json(); } catch (_) { datos = null; }
    return { status: res.status, datos };
  }

  function errorDe(datos) {
    return (datos && datos.error) || MSG_ERROR_GENERAL;
  }

  const PANTALLAS = {
    hoy: pHoy, vender: pVender, prueba: pPrueba, escanear: pEscanear, displays: pDisplays, d: pDetalle, solicitar: pSolicitar, saldo: pSaldo,
    ventas: pVentas, v: pVenta, varios: pVarios, cuenta: pCuenta, p: pProximamente,
  };
  const PESTANA = { hoy: "hoy", vender: "hoy", prueba: "hoy", escanear: "hoy", displays: "displays", d: "displays", saldo: "saldo" };

  async function render() {
    if (!enPanel) return;
    const r = ruta();
    const pantalla = r.length ? r[0] : "hoy";
    const fn = PANTALLAS[pantalla] || pHoy;
    const mi = ++turno;
    const pestana = PESTANA[pantalla] || "varios";
    for (const b of $$(".tabs button")) {
      if (b.dataset.tab === pestana) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    }
    $("btn-atras").hidden = pantalla === "hoy";
    app.replaceChildren(el("p", { clase: "hint", texto: "Cargando…" }));
    window.scrollTo(0, 0);
    try {
      const nodos = await fn(r.slice(1));
      if (mi === turno && nodos) app.replaceChildren(...nodos);
    } catch (_) {
      if (mi === turno) app.replaceChildren(el("p", { clase: "msg err", texto: MSG_ERROR_RED }));
    }
  }

  async function entrarPanel() {
    enPanel = true;
    try {
      const d = await getJSON("/api/vendedor/yo");
      if (d) nombreVend = d.nombre || "";
    } catch (_) { /* la pantalla muestra su propio error */ }
    if (!location.hash || location.hash === "#") ir("#/hoy");
    render();
  }

  // Ruta según el estado del display: libre → vender; en prueba → pantalla de prueba; si no → detalle.
  const rutaParaDisplay = (x) => {
    if (x.estado === "libre") return "#/vender/" + enc(x.folio);
    if (x.estado === "prueba") return "#/prueba/" + enc(x.folio);
    return "#/d/" + enc(x.folio);
  };

  // Escaneo desde Inicio: la cámara solo se abre al tocar el botón.
  async function pEscanear() {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const displays = d.displays || [];
    const msg = el("p", { clase: "msg", role: "status" });
    const visor = el("div", {});
    let parar = () => {};
    const resolver = (folio) => {
      parar();
      visor.replaceChildren();
      const x = displays.find((y) => y.folio === folio);
      if (!x) return texto(msg, "Ese QR no es de un display de tu inventario.", "err");
      ir(rutaParaDisplay(x));
    };
    const abrirCamara = () => {
      visor.replaceChildren();
      leerQr(resolver, (cancelar) => {
        parar = cancelar;
        visor.append(el("button", { type: "button", clase: "btn s sm", on: { click: () => { cancelar(); visor.replaceChildren(); } } }, ["Cerrar cámara"]));
      }, (m, video) => {
        if (video) { visor.prepend(video); return; }
        texto(msg, m, "err");
      });
    };
    return [
      el("h2", { texto: "Escanear el QR" }),
      el("p", { clase: "sub", texto: "Apunta la cámara al QR impreso en el display. La cámara solo se abre cuando tocas el botón." }),
      el("button", { type: "button", clase: "btn p", on: { click: abrirCamara } }, ["Abrir cámara"]),
      visor,
      msg,
      el("p", { clase: "hint", texto: "Si la cámara no funciona, escribe el folio de cuatro caracteres desde Inicio." }),
    ];
  }

  async function pHoy() {
    const [s, d] = await Promise.all([getJSON("/api/vendedor/saldo"), getJSON("/api/vendedor/displays")]);
    if (!s || !d) return null;
    const libres = (d.displays || []).filter((x) => x.estado === "libre").length;
    const primer = nombreVend.split(" ")[0] || "";
    const plazo = s.horas_restantes === null ? "Sin plazo corriendo"
      : s.plazo_vencido ? "Plazo vencido"
      : s.horas_restantes + " h para entregar";
    const folioInput = el("input", { placeholder: "Ej. M3K7", maxlength: "4", autocomplete: "off", autocapitalize: "characters", "aria-label": "Folio del display" });
    const folioMsg = el("p", { clase: "msg", role: "status" });
    const abrirFolio = () => {
      const folio = folioInput.value.trim().toUpperCase();
      if (folio.length !== 4) return;
      const existe = (d.displays || []).find((x) => x.folio === folio);
      if (!existe) return texto(folioMsg, "No encontramos ese folio en tu inventario.", "err");
      ir(rutaParaDisplay(existe));
    };
    folioInput.addEventListener("input", () => { if (folioInput.value.trim().length === 4) abrirFolio(); });
    const nodos = [el("h2", { texto: "Hola, " + primer })];
    if (s.impago) nodos.push(el("div", { clase: "aviso alerta", texto: "Tienes un adeudo por impago. No puedes activar displays nuevos." }));
    nodos.push(
      el("button", { type: "button", clase: "venta", on: { click: () => ir("#/vender") } }, [
        el("span", { clase: "vi" }, [icono(ICONO_NFC)]),
        el("span", { clase: "vt" }, [el("b", { texto: "Vender un display" }), el("span", { texto: "Acerca tu celular al display para empezar." })]),
      ]),
      el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/escanear") } }, ["Escanear el QR del display"]),
      el("span", { clase: "lbl", texto: "¿Prefieres escribir el folio?" }),
      el("form", { novalidate: "", on: { submit: (e) => { e.preventDefault(); abrirFolio(); } } }, [folioInput]),
      el("p", { clase: "hint", texto: "Son 4 caracteres y abre solo." }),
      folioMsg,
      el("div", { clase: "dos" }, [
        el("div", { clase: "card" }, [el("span", { clase: "lbl", texto: "Debes entregar" }), el("b", { texto: dinero(s.custodia) }), el("span", { texto: plazo })]),
        el("div", { clase: "card" }, [el("span", { clase: "lbl", texto: "En inventario" }), el("b", { texto: libres + (libres === 1 ? " libre" : " libres") })]),
      ]),
    );
    return conAviso(nodos);
  }

  // Filtro y búsqueda de Mis displays: se recuerdan mientras la app está abierta.
  let filtroDisplays = "todos";
  let busquedaDisplays = "";

  async function pDisplays() {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const lista = d.displays || [];
    if (!lista.length) return conAviso([el("h2", { texto: "Mis displays" }), el("p", { clase: "hint", texto: "Aún no tienes displays asignados." })]);

    const ESTADOS_FILTRO = [["todos", "Todos"], ["activo", "Activos"], ["prueba", "En prueba"], ["libre", "Libres"], ["retirado", "Retirados"]];
    const cuenta = (e) => (e === "todos" ? lista.length : lista.filter((x) => x.estado === e).length);
    const ul = el("ul", { clase: "lista" });
    const botones = new Map();
    const resumen = el("p", { clase: "sub" });
    const buscar = el("input", { type: "search", placeholder: "Buscar por folio o negocio", "aria-label": "Buscar displays", value: busquedaDisplays });

    const pintar = () => {
      const q = busquedaDisplays.trim().toLowerCase();
      const visibles = lista.filter((x) =>
        (filtroDisplays === "todos" || x.estado === filtroDisplays) &&
        (!q || x.folio.toLowerCase().includes(q) || (x.negocio_asignado || "").toLowerCase().includes(q) || (x.direccion || "").toLowerCase().includes(q))
      );
      for (const [e, b] of botones) b.setAttribute("aria-pressed", String(e === filtroDisplays));
      resumen.textContent = lista.length + (lista.length === 1 ? " display" : " displays") + " en total · busca por folio o negocio.";
      ul.replaceChildren(...visibles.map((x) =>
        el("li", {}, [
          el("button", { type: "button", clase: "item", on: { click: () => ir("#/d/" + enc(x.folio)) } }, [
            el("div", { clase: "fila" }, [el("span", { clase: "folio sm", texto: x.folio }), chip(x.estado)]),
            el("span", { texto: (x.negocio_asignado || "Sin negocio asignado") + (x.prueba_min_restantes != null ? " · quedan " + x.prueba_min_restantes + " min" : "") }),
          ]),
        ])
      ));
      if (!visibles.length) ul.replaceChildren(el("li", { clase: "hint", texto: "Ningún display coincide con la búsqueda o el filtro." }));
    };

    buscar.addEventListener("input", () => { busquedaDisplays = buscar.value; pintar(); });
    const seg = el("div", { clase: "seg", role: "group", "aria-label": "Filtrar por estado" }, ESTADOS_FILTRO.map(([e, txt]) => {
      const b = el("button", { type: "button", on: { click: () => { filtroDisplays = e; pintar(); } } }, [txt + " " + cuenta(e)]);
      botones.set(e, b);
      return b;
    }));
    pintar();
    return conAviso([el("h2", { texto: "Displays" }), resumen, el("div", { clase: "campo" }, [buscar]), seg, ul]);
  }

  const ETIQUETA_TRANSICION = {
    "libre>activo": "Activado con un negocio",
    "activo>libre": "Liberado para otro negocio",
    "libre>prueba": "Prueba iniciada",
    "prueba>activo": "Cobrado y activado",
    "prueba>libre": "Prueba terminada",
    "activo>retirado": "Retirado de servicio",
  };

  // Datos secundarios del detalle: si fallan, la pantalla sigue con lo principal.
  async function datosDetalle(folio) {
    const [sols, hist] = await Promise.all([
      getJSON("/api/vendedor/solicitudes").catch(() => null),
      getJSON("/api/vendedor/displays/" + enc(folio) + "/historial").catch(() => null),
    ]);
    const solicitud = sols && (sols.solicitudes || []).find((x) => x.folio === folio && x.estado === "pendiente")
      || sols && (sols.solicitudes || []).find((x) => x.folio === folio && x.estado === "rechazada")
      || null;
    return { solicitud, historial: hist ? hist.estados || [] : [] };
  }

  async function pDetalle([folio]) {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const f = (d.displays || []).find((x) => x.folio === folio);
    if (!f) return [el("p", { clase: "msg err", texto: "No encontramos ese display." })];

  async function pSolicitar([folio, tipo]) {
    const cambiar = tipo === "cambiar";

      campo("Motivo (opcional)", motivo),
      campo("Nota (opcional)", nota),
      boton,
      msg,

  // ===== Pantalla de prueba (según el mockup) =====
  // El negocio y el enlace de la prueba se guardan en este dispositivo. Si se cambia de teléfono, se busca el negocio otra vez.
  function guardarPrueba(folio, datos) {
    try { sessionStorage.setItem("bv_prueba_" + folio, JSON.stringify(datos)); } catch (_) { /* sin almacenamiento: se busca otra vez */ }
  }
  function leerPrueba(folio) {
    try { return JSON.parse(sessionStorage.getItem("bv_prueba_" + folio) || "null"); } catch (_) { return null; }
  }
  function borrarPrueba(folio) {
    try { sessionStorage.removeItem("bv_prueba_" + folio); } catch (_) { /* nada que borrar */ }
  }

  async function pPrueba([folio]) {
    const f = String(folio || "").toUpperCase();
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const x = (d.displays || []).find((y) => y.folio === f);
    if (!x || x.estado !== "prueba") {
      aviso = "Ese display ya no está en prueba.";
      ir("#/hoy");
      return null;
    }
    const minutos = x.prueba_min_restantes == null ? 0 : x.prueba_min_restantes;
    const total = 30;
    const dp = leerPrueba(f);
    const negocio = (dp && dp.negocio) || x.negocio_asignado || "Negocio";
    const msg = el("p", { clase: "msg", role: "status" });
    const confirmar = (titulo, texto2, label, accion) => {
      const hoja = el("div", { clase: "tarjeta" }, [
        el("b", { texto: titulo }),
        el("p", { clase: "hint", texto: texto2 }),
        el("button", { type: "button", clase: "btn p sm", style: "width:100%", on: { click: accion } }, [label]),
        el("button", { type: "button", clase: "btn s sm", style: "width:100%;margin-top:8px", on: { click: () => render() } }, ["Cancelar"]),
      ]);
      app.replaceChildren(hoja);
    };
    const terminar = async (siguiente) => {
      const { status, datos } = await postJSON("/api/vendedor/pruebas/" + enc(f) + "/terminar", {});
      if (status === 401) return;
      if (status === 200 && datos && datos.success) {
        borrarPrueba(f);
        ventasCache = [];
        siguiente();
      } else {
        texto(msg, errorDe(datos), "err");
      }
    };
    return [
      el("div", { clase: "fila" }, [el("span", { clase: "folio", texto: f }), chip("prueba")]),
      el("h2", { texto: negocio }),
      el("p", { clase: "sub", texto: "El cliente ya puede acercar su celular: verá su reseña funcionando, con un aviso de demostración. Todavía no pagó y el display no es suyo. Cuando se convenza, sigue con la venta." }),
      el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Tiempo de prueba" }),
        el("b", { texto: "Quedan " + minutos + " min" }),
        el("div", { clase: "barra", role: "img", "aria-label": minutos + " de " + total + " minutos" }, [el("i", { style: "width:" + Math.round(minutos / total * 100) + "%" })]),
        el("p", { clase: "hint", texto: "Si el cliente no compra, el display queda libre y no se guarda ningún dato suyo." }),
      ]),
      el("button", { type: "button", clase: "btn a", on: { click: () => {
        sessionStorage.setItem("bv_seguir_" + f, "1");
        ir("#/vender/" + enc(f));
      } } }, ["Seguir con la venta"]),
      el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => {
        if (dp && dp.enlace) window.open(dp.enlace, "_blank", "noopener");
        else texto(msg, "Para ver la reseña, busca el negocio otra vez desde «Seguir con la venta».", "err");
      } } }, ["Ver lo que ve el cliente"]),
      el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => confirmar(
        "¿Terminar la prueba de " + f + "?",
        "El display queda libre y no se guarda ningún dato del cliente. No cuenta como venta.",
        "Terminar prueba",
        () => terminar(() => { aviso = "Prueba terminada. " + f + " quedó libre."; ir("#/hoy"); }),
      ) } }, ["Terminar la prueba"]),
      el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => confirmar(
        "¿Ya no lo está probando " + negocio + "?",
        f + " sigue en modo prueba (quedan " + minutos + " min). Si el cliente ya no lo está probando, el display se libera y puedes usarlo con otro negocio. No se guarda ningún dato del cliente anterior.",
        "Sí, ya no lo prueba",
        () => terminar(() => { aviso = f + " quedó libre."; ir("#/vender/" + enc(f)); }),
      ) } }, ["Usar este display con otro cliente"]),
      msg,
    ];
  }

  // ===== Venta por pasos (según el mockup): folio → negocio → confirmar → datos → cobro → listo =====
  const FOLIO_APP = /^[ABCDEFGHJKLMNPQRSTUVWXYZ][2-9][ABCDEFGHJKLMNPQRSTUVWXYZ][2-9]$/;
  const PRECIO_DISPLAY = 350;
  const COMISION_DISPLAY = 150;
  const ENTREGA_DISPLAY = PRECIO_DISPLAY - COMISION_DISPLAY;
  const DOMINIOS_TYPO = { "gmial.com": "gmail.com", "gmai.com": "gmail.com", "gamil.com": "gmail.com", "gmail.co": "gmail.com", "gmail.con": "gmail.com", "hotmial.com": "hotmail.com", "hotmail.con": "hotmail.com", "outlok.com": "outlook.com", "outlook.con": "outlook.com", "yaho.com": "yahoo.com", "yahoo.con": "yahoo.com" };
  const sinAcentos = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  function errNombreCliente(v) {
    v = String(v || "").trim().replace(/\s+/g, " ");
    if (!v) return "Escribe el nombre de quien recibe el display.";
    if (/\d/.test(v)) return "El nombre no lleva números. Bórralos.";
    if (/@/.test(v)) return "Parece que escribiste un correo. Aquí va el nombre de la persona.";
    if (!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]+$/.test(v)) return "El nombre solo lleva letras y espacios. Quita los símbolos.";
    if (v.length > 60) return "El nombre es demasiado largo. Escribe solo nombre y apellido.";
    const palabras = v.split(" ").filter((x) => x.replace(/[.'-]/g, "").length);
    if (palabras.length < 2) return "Escribe nombre y apellido. Ejemplo: Rosa Ruiz.";
    return "";
  }
  function errWhatsappCliente(v) {
    if (!String(v || "").trim()) return "Escribe el WhatsApp del cliente.";
    if (/[a-z]/i.test(v)) return "El WhatsApp solo lleva números. Quita las letras.";
    let d = String(v).replace(/\D/g, "");
    if (d.length === 12 && d.startsWith("52")) d = d.slice(2);
    if (d.length === 13 && d.startsWith("521")) d = d.slice(3);
    if (d.length < 10) return "Le falta" + (10 - d.length === 1 ? "" : "n") + " " + (10 - d.length) + " dígito" + (10 - d.length === 1 ? "" : "s") + ": lleva " + d.length + " de 10. Revisa que incluya la lada (33, 55…).";
    if (d.length > 10) return "Le sobra" + (d.length - 10 === 1 ? "" : "n") + " " + (d.length - 10) + " dígito" + (d.length - 10 === 1 ? "" : "s") + ": lleva " + d.length + " y deben ser 10. No hace falta el +52 ni el 1.";
    return "";
  }
  function errCorreoCliente(v) {
    v = String(v || "").trim().toLowerCase();
    if (!v) return "";
    const arrobas = (v.match(/@/g) || []).length;
    if (arrobas === 0) return "Falta la @. Ejemplo: nombre@gmail.com";
    if (/\s/.test(v)) return "El correo no lleva espacios. Bórralos.";
    if (arrobas > 1) return "El correo tiene más de una @. Solo debe llevar una.";
    const [usuario, dominio] = v.split("@");
    if (!usuario) return "Falta lo que va antes de la @.";
    if (!dominio) return "Falta lo que va después de la @, por ejemplo gmail.com.";
    if (DOMINIOS_TYPO[dominio]) return "Parece que hay un error de dedo: ¿quisiste decir " + DOMINIOS_TYPO[dominio] + "?";
    if (!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(dominio)) return "La parte después de la @ no se ve bien. Ejemplo: gmail.com u hotmail.com";
    if (!/^[a-z0-9._%+-]+$/.test(usuario)) return "Antes de la @ solo van letras, números, puntos o guiones. Sin acentos ni ñ.";
    return "";
  }

  // Lectura del QR con la cámara: solo cuando el vendedor toca el botón. Si el navegador no puede leer QR, se teclea el folio.
  async function leerQr(onFolio, onCancelar, aviso) {
    if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      aviso("Tu navegador no puede leer el QR. Escribe el folio que está impreso al pie del display.");
      return;
    }
    let flujo = null;
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    const video = el("video", { playsinline: "", muted: "", autoplay: "", "aria-label": "Vista de la cámara" });
    const parar = () => { if (flujo) flujo.getTracks().forEach((t) => t.stop()); flujo = null; };
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch (_) {
      aviso("No pudimos abrir la cámara. Revisa el permiso del navegador o escribe el folio.");
      return;
    }
    video.srcObject = flujo;
    onCancelar(() => { parar(); });
    const tick = async () => {
      if (!flujo) return;
      try {
        const codigos = await detector.detect(video);
        for (const c of codigos) {
          const ruta = String(c.rawValue || "").split("?")[0].split("/").filter(Boolean).pop() || "";
          const folio = ruta.toUpperCase();
          if (FOLIO_APP.test(folio)) { parar(); return onFolio(folio); }
        }
      } catch (_) { /* cuadro sin QR: seguimos leyendo */ }
      setTimeout(tick, 300);
    };
    onFolio.video = video;
    aviso(null, video);
    video.play().catch(() => {});
    tick();
  }

  async function pVender([folioPre]) {
    const d = await getJSON("/api/vendedor/displays");

    let parar = () => {};
    let turnoBusqueda = 0;
    let temporizador = null;

    const cargarClientes = async () => {
      if (st.clientes !== null) return;

    // 1 · Entrada: folio, QR o folio tecleado

          visor.replaceChildren();
          leerQr(continuar, (cancelar) => { parar = cancelar; visor.append(el("button", { type: "button", clase: "btn s sm", on: { click: () => { cancelar(); visor.replaceChildren(); } } }, ["Cerrar cámara"])); }, (m, video) => {

        el("form", { novalidate: "", on: { submit: (e) => { e.preventDefault(); const f = entrada.value.trim().toUpperCase(); if (f.length !== 4) return texto(msg, "El folio tiene 4 caracteres.", "err"); continuar(f); } } }, [

      const ubicar = async () => {
        if (!navigator.geolocation) return avisoLista("Tu navegador no permite usar la ubicación. Escribe el nombre del negocio.");
        avisoLista("Buscando negocios cerca de ti…");
        try {

          const res = await fetch("/api/vendedor/buscar-cercanos?lat=" + enc(String(pos.coords.latitude)) + "&lng=" + enc(String(pos.coords.longitude)));
          if (res.status === 401) return sesionCaducada();
          const datos = await res.json().catch(() => null);
          if (!res.ok) return avisoLista(res.status === 404 ? "La búsqueda por ubicación todavía no está disponible. Escribe el nombre del negocio." : errorDe(datos));
          const lista = (datos && datos.resultados) || [];

      const nodos = [

      svgDe(nombreIc),
      el("span", { clase: "mi-cuerpo" }, [el("span", { texto: titulo }), sub ? el("small", { texto: sub }) : null].filter(Boolean)),
      chip ? el("span", { clase: "ch", texto: chip }) : null,
    ].filter(Boolean));
    cuerpo.replaceChildren(
      el("div", { clase: "mn-top" }, [
        el("span", { clase: "mn-av", texto: iniciales(nombreVend), "aria-hidden": "true" }),
        el("div", { clase: "grow" }, [el("b", { texto: nombreVend || "Vendedor" })]),
        el("button", { type: "button", clase: "mn-x", id: "btn-cerrar-cajon", "aria-label": "Cerrar menú", on: { click: cerrar } }, ["✕ Cerrar"]),
      ]),
      item("user", "Mi cuenta", "Tus datos y tu cuenta de cobro", "", "#/cuenta"),
      item("coin", "Mi saldo y entregas", "", enMano > 0 ? dinero(enMano) : "Al corriente", "#/saldo"),
      item("mes", "Mi desempeño", "Tus entregas del mes", "", "#/p/" + enc("Mi desempeño")),
      item("list", "Mis ventas y comisión", ok.length + (ok.length === 1 ? " venta" : " ventas"), "", "#/ventas"),
      el("div", { clase: "msep" }),
      item("book", "Manual de uso", "bienvisto.com.mx/ayuda/manual", "", "https://bienvisto.com.mx/ayuda/manual"),
      item("chat", "Escribir a soporte", "Por WhatsApp", "", WA_AYUDA),
      el("div", { clase: "msep" }),
      el("button", { type: "button", clase: "mi", id: "btn-salir", on: { click: confirmarSalida } }, [svgDe("out"), el("span", { clase: "mi-cuerpo" }, [el("span", { texto: "Cerrar sesión" })])]),
    );
  }

  function confirmarSalida() {
    $("cajon-in").replaceChildren(
      el("h2", { texto: "¿Cerrar sesión?" }),
      el("p", { clase: "sub", texto: "Para volver a activar displays tendrás que entrar de nuevo con tu correo." }),
      el("button", { type: "button", clase: "btn p", on: { click: () => { abrirCajon(false); cerrarSesion(); } } }, ["Cerrar sesión"]),
      el("button", { type: "button", clase: "btn s", on: { click: () => pintarCajon() } }, ["Cancelar"]),
    );
  }

  function abrirCajon(abrir) {
    $("cajon").hidden = !abrir;
    if (abrir) pintarCajon();
  }

  window.addEventListener("hashchange", () => { abrirCajon(false); render(); });
  $("btn-menu").addEventListener("click", () => abrirCajon(true));
  $("cajon").addEventListener("click", (e) => { if (e.target.id === "cajon") abrirCajon(false); });
  $("btn-atras").addEventListener("click", () => { if (history.length > 1) history.back(); else ir("#/hoy"); });
  for (const b of $$(".tabs button")) b.addEventListener("click", () => ir("#/" + b.dataset.tab));
  iniciar();
})();
</script>
</body>
</html>
