        zona.replaceChildren(el("p", { clase: "hint", texto: "Cargando tus datos…" }));
        if (cuentaVigente === undefined) {
          const d = await getJSON("/api/vendedor/cuenta-cobro").catch(() => null);
          if (metodo !== "transferencia") return;
          if (!d) return zona.replaceChildren(el("p", { clase: "msg err", role: "status", texto: MSG_ERROR_RED }));
          cuentaVigente = d.vigente || null;
        }
        if (!cuentaVigente) {
          return zona.replaceChildren(el("div", { clase: "tarjeta", role: "alert", style: "border-color:var(--danger)" }, [
            el("b", { texto: "Aún no cargas tu cuenta" }),
            el("span", { texto: "Sin ella no puedes cobrar por transferencia." }),
            el("button", { type: "button", clase: "btn p sm", style: "margin-top:8px", on: { click: () => ir("#/datos-cobro") } }, ["Cargar mi cuenta"]),
          ]));
        }
        zona.replaceChildren(
          el("div", { clase: "tarjeta" }, [
            el("span", { clase: "lbl", texto: "Tus datos de cobro" }),
            el("dl", { clase: "kv", style: "margin:0" }, [
              el("dt", { texto: "Titular" }), el("dd", { texto: cuentaVigente.titular }),
              el("dt", { texto: "Banco" }), el("dd", { texto: cuentaVigente.banco }),
              el("dt", { texto: "CLABE" }), el("dd", { texto: formatoClabe(cuentaVigente.clabe) }),
              el("dt", { texto: "Cuenta" }), el("dd", { texto: cuentaVigente.cuenta }),
              el("dt", { texto: "Tipo" }), el("dd", { texto: cuentaVigente.tipo }),
            ]),
          ]),
          el("div", { clase: "dos" }, [compartir, copiarEnlace]),
          el("p", { clase: "hint", texto: "Tu cliente abre el enlace y ve estos datos para pagar el monto exacto." }),
          el("label", { clase: "lbl", for: "rastreo-cobro", texto: "Clave de rastreo (opcional)" }),
          rastreo,
          el("p", { clase: "hint", texto: "La encuentras en el comprobante del cliente. Puedes activar sin ella, pero antes revisa en tu banco que el dinero ya cayó." }),
        );
      };

      const seg = el("div", { clase: "seg", role: "group", "aria-label": "Cómo paga el cliente" }, [["efectivo", "Efectivo"], ["transferencia", "Transferencia"]].map(([k, t]) => {
        const b = el("button", { type: "button", on: { click: () => { if (st.ventaId || metodo === k) return; metodo = k; sincronizar(); } } }, [t]);
        botonesMetodo[k] = b;
        return b;
      }));
      const sincronizar = () => {
        for (const [k, b] of Object.entries(botonesMetodo)) b.setAttribute("aria-pressed", String(k === metodo));
        pintarMarca();
        pintarZona();
      };

      const activar = el("button", { type: "button", clase: "btn a", style: "margin-top:12px", on: { click: async () => {
        if (!marca.checked) { aviso5.hidden = false; aviso5.textContent = "Marca la casilla para activar. Es tu compromiso de entregar " + dinero(ENTREGA_DISPLAY) + "."; return; }
        aviso5.hidden = true;
        activar.disabled = true;
        try {
          if (!(await asegurarVenta())) return;
          const referencia = metodo === "transferencia" ? rastreo.value.trim().toUpperCase().replace(/\s/g, "") : "";
          const cobro = await postJSON("/api/vendedor/ventas/" + enc(st.ventaId) + "/cobro", { referencia, url_resena: st.negocio.enlace_resena });
          if (cobro.status === 401) return;
          if (cobro.status === 200 && cobro.datos && cobro.datos.success) {
            ventasCache = [];
            return pantallaListo();
          }
          texto(avisoGlobal, errorDe(cobro.datos) + " La venta quedó pendiente: intenta de nuevo o envíala a revisión desde Ventas.", "err");
          activar.textContent = "Reintentar activación";
        } catch (_) {
          texto(avisoGlobal, MSG_ERROR_RED + " La venta quedó pendiente: intenta de nuevo.", "err");
          activar.textContent = "Reintentar activación";
        } finally {
          activar.disabled = false;
        }
      } } }, ["Activar display " + st.folio]);

      pintar(
        encabezadoPaso(3),
        el("h2", { texto: "Cobra antes de activar" }),
        el("p", { clase: "sub", texto: "El precio es fijo y no se puede cambiar." }),
        el("div", { clase: "tarjeta" }, [el("b", { texto: dinero(PRECIO_DISPLAY) }), el("span", { texto: "IVA incluido · 1 display" })]),
        el("div", { clase: "dos" }, [
          el("div", { clase: "card" }, [el("b", { texto: dinero(COMISION_DISPLAY) }), el("span", { texto: "Tu comisión" })]),
          el("div", { clase: "card" }, [el("b", { texto: dinero(ENTREGA_DISPLAY) }), el("span", { texto: "Entregas a Bien Visto" })]),
        ]),
        el("span", { clase: "lbl", texto: "¿Cómo paga el cliente?" }),
        seg,
        zona,
        el("label", { clase: "opcion", for: "marca-cobro" }, [marca, etiquetaMarca]),
        aviso5,
        msgCobro,
        activar,
      );
      sincronizar();
    };

    // 6 · Listo
    const pantallaListo = () => {
      const factura = el("div", {});
      const pregunta = el("div", {});

      const mostrarFactura = () => {
        const msgFac = el("p", { clase: "msg", role: "status" });
        const copiar = el("button", { type: "button", clase: "btn s", on: { click: async () => {
          try {
            await navigator.clipboard.writeText(ENLACE_FACTURA);
            texto(msgFac, "Enlace copiado.", "ok");
          } catch (_) {
            texto(msgFac, "No pudimos copiarlo. Selecciónalo y cópialo a mano.", "err");
          }
        } } }, ["Copiar enlace"]);
        pregunta.replaceChildren();
        factura.replaceChildren(
          el("div", { clase: "card" }, [
            el("span", { clase: "lbl", texto: "Factura" }),
            el("p", { clase: "hint", texto: "Compártele este enlace. En el formulario debe escribir la referencia de abajo." }),
            el("b", { texto: ENLACE_FACTURA }),
            el("b", { texto: "Referencia: " + st.ventaId }),
            copiar,
            msgFac,
          ]),
        );
      };

      const sinFactura = (mensaje) => {
        pregunta.replaceChildren(el("p", { clase: "hint", texto: mensaje }));
      };

      pregunta.replaceChildren(
        el("span", { clase: "lbl", texto: "¿Tu cliente necesita factura?" }),
        el("p", { clase: "hint", texto: "Pregúntaselo ahora, antes de irte. Después es mucho más difícil localizarlo." }),
        el("button", { type: "button", clase: "btn p", on: { click: mostrarFactura } }, ["Sí, necesita factura"]),
        el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => sinFactura("Anotado: sin factura por ahora.") } }, ["No necesita factura"]),
        el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => sinFactura("Podrás pedir la factura después desde Ventas.") } }, ["Preguntar después"]),
      );

      pintar(
        el("h2", { texto: st.folio + " ya está activo" }),
        el("p", { clase: "sub", texto: "Desde ahora, cada escaneo lleva a dejar una reseña de " + st.negocio.nombre + "." }),
        el("div", { clase: "tarjeta" }, [el("b", { texto: "Debes entregar " + dinero(ENTREGA_DISPLAY) }), el("span", { texto: "Entrégalo a Bien Visto desde Mi saldo." })]),
        el("div", { clase: "tarjeta" }, [el("b", { texto: "Pruébalo tú mismo" }), el("span", { texto: "Abre el enlace de reseña para ver lo que verá tu cliente." }), el("button", { type: "button", clase: "btn s sm", style: "margin-top:10px", on: { click: () => window.open(st.negocio.enlace_resena, "_blank", "noopener") } }, ["Abrir enlace de reseña"])]),
        el("div", { clase: "tarjeta" }, [pregunta, factura]),
        el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => { st.folio = null; st.ventaId = null; st.form = { nombre: "", wa: "", mail: "" }; pantallaFolio(); } } }, ["Activar otro display de este cliente"]),
        el("button", { type: "button", clase: "btn p", style: "margin-top:8px", on: { click: () => ir("#/hoy") } }, ["Terminar"]),
      );
    };

    // Arranque: folio desde la landing o pantalla de entrada
    if (folioPre) {
      const e = folioValido(folioPre);
      const dp = leerPrueba(folioPre);
      const x = displays.find((y) => y.folio === folioPre);
      if (e) { pantallaFolio(); texto(avisoGlobal, e, "err"); }
      else if (dp && x && x.estado === "prueba" && sessionStorage.getItem("bv_seguir_" + folioPre)) {
        sessionStorage.removeItem("bv_seguir_" + folioPre);
        st.folio = folioPre; st.negocio = { nombre: dp.negocio, direccion: dp.direccion || "", enlace_resena: dp.enlace };
        pantallaDatos();
      }
      else { st.folio = folioPre; pantallaNegocio(); }
    } else {
      pantallaFolio();
    }
    return [contenedor];
  }

  // Activar varios: un negocio, un cliente y varios displays en una sola venta (promoción 3 por $900).
  function totalLote(n) {
    const pares = Math.floor(n / PROMO_N);
    const total = pares * PROMO_PRECIO + (n % PROMO_N) * PRECIO_DISPLAY;
    return { total, aEntregar: total - n * COMISION_DISPLAY, enPromo: pares * PROMO_N };
  }

  async function pLote() {
    if (await bloqueadoParaActivar("")) return null;
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const libres = new Set((d.displays || []).filter((x) => x.estado === "libre").map((x) => x.folio));
    const L = { negocio: null, nombre: "", wa: "", mail: "", folios: [], ventaId: null, hecho: null };
    const msg = el("p", { clase: "msg", role: "status" });
    const raiz = el("div", {});
    const cajaNegocio = el("div", {});
    const cajaCliente = el("div", {});
    const cajaDisplays = el("div", {});
    const visor = el("div", {});
    const cajaResumen = el("div", {});
    const cajaCobro = el("div", {});
    let pararCamara = () => {};

    const renderResumen = () => {
      const n = L.folios.length;
      if (!n) return cajaResumen.replaceChildren();
      const t = totalLote(n);
      cajaResumen.replaceChildren(el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Total a cobrar" }),
        el("b", { texto: dinero(t.total) }),
        el("p", { clase: "hint", texto: n + (n === 1 ? " display" : " displays") + (t.enPromo ? " · " + t.enPromo + " en promoción" : "") + " · a entregar " + dinero(t.aEntregar) }),
      ]));
    };

    const renderCobro = () => {
      const n = L.folios.length;
      if (!n) return cajaCobro.replaceChildren();
      const t = totalLote(n);
      const marca = el("input", { type: "checkbox", id: "marca-lote" });
      const boton = el("button", { type: "button", clase: "btn a", style: "margin-top:12px" }, [L.ventaId ? "Reintentar activación" : "Cobrar y activar " + n + (n === 1 ? " display" : " displays")]);
      const activar = async () => {
        texto(msg, "", "ok");
        if (!L.negocio) return texto(msg, "Elige el negocio.", "err");
        const eNombre = errNombreCliente(L.nombre);
        if (eNombre) return texto(msg, eNombre, "err");
        const eWa = errWhatsappCliente(L.wa);
        if (eWa) return texto(msg, eWa, "err");
        if (!marca.checked) return texto(msg, "Marca la casilla para activar. Es tu compromiso de entregar " + dinero(t.aEntregar) + ".", "err");
        boton.disabled = true;
        try {
          if (!L.ventaId) {
            const eMail = errCorreoCliente(L.mail);
        if (eMail) return texto(msg, eMail, "err");
        const crear = await postJSON("/api/vendedor/ventas", { negocio: L.negocio.nombre, contacto: L.nombre.trim(), whatsapp: L.wa.trim(), correo: L.mail.trim().toLowerCase() || null, metodo: "efectivo", direccion: L.negocio.direccion, folios: L.folios });
            if (crear.status === 401) return;
            if (!(crear.status === 201 && crear.datos && crear.datos.success)) return texto(msg, errorDe(crear.datos), "err");
            L.ventaId = crear.datos.id;
            renderDisplays();
          }
          const cobro = await postJSON("/api/vendedor/ventas/" + enc(L.ventaId) + "/cobro", { referencia: "", url_resena: L.negocio.enlace_resena });
          if (cobro.status === 401) return;
          if (cobro.status === 200 && cobro.datos && cobro.datos.success) {
            ventasCache = [];
            L.hecho = L.folios.slice();
            L.hecho.forEach((f) => libres.delete(f));
            return pantallaLoteListo();
          }
          texto(msg, errorDe(cobro.datos) + " La venta quedó pendiente: intenta de nuevo o envíala a revisión desde Ventas.", "err");
          renderCobro();
        } catch (_) {
          texto(msg, MSG_ERROR_RED + " La venta quedó pendiente: intenta de nuevo.", "err");
          renderCobro();
        } finally {
          boton.disabled = false;
        }
      };
      boton.addEventListener("click", activar);
      cajaCobro.replaceChildren(
        el("label", { clase: "opcion", for: "marca-lote" }, [marca, el("span", { texto: "Confirmo que cobré " + dinero(t.total) + " en efectivo y me comprometo a entregar " + dinero(t.aEntregar) + "." })]),
        boton,
      );
    };

    const agregar = (f) => {
      f = String(f || "").toUpperCase();
      if (!FOLIO_APP.test(f)) return texto(msg, "Ese folio no es válido.", "err");
      if (!libres.has(f)) return texto(msg, "El display " + f + " no está libre en tu inventario.", "err");
      if (L.folios.includes(f)) return texto(msg, f + " ya está en la lista.", "err");
      if (L.folios.length >= MAX_LOTE) return texto(msg, "Una venta admite hasta " + MAX_LOTE + " displays.", "err");
      L.folios.push(f);
      texto(msg, "", "ok");
      renderDisplays();
      renderResumen();
      renderCobro();
    };

    const renderNegocio = () => {
      if (L.negocio) {
        cajaNegocio.replaceChildren(el("div", { clase: "tarjeta" }, [
          el("span", { clase: "lbl", texto: "Negocio" }),
          el("b", { texto: L.negocio.nombre }),
          el("p", { clase: "hint", texto: L.negocio.direccion || "" }),
          el("button", { type: "button", clase: "btn s sm", on: { click: () => { L.negocio = null; renderNegocio(); renderCobro(); } } }, ["Cambiar negocio"]),
        ]));
        return;
      }
      const q = el("input", { type: "search", placeholder: "Nombre del negocio", "aria-label": "Buscar negocio", maxlength: "100" });
      const res = el("div", { clase: "resultados" });
      let temporizador = null;
      const buscarAhora = async () => {
        const t = q.value.trim();
        if (t.length < 3) return res.replaceChildren();
        const r = await getJSON("/api/vendedor/buscar-negocio?q=" + enc(t)).catch(() => null);
        if (!r) return res.replaceChildren(el("p", { clase: "hint", texto: MSG_ERROR_RED }));
        const items = r.resultados || [];
        res.replaceChildren(...(items.length
          ? items.map((x) => el("button", { type: "button", clase: "item", on: { click: () => { L.negocio = x; renderNegocio(); renderCobro(); } } }, [el("b", { texto: x.nombre }), el("span", { texto: x.direccion || "" })]))
          : [el("p", { clase: "hint", texto: "No encontramos ese negocio. Prueba con otro nombre." })]));
      };
      q.addEventListener("input", () => { clearTimeout(temporizador); temporizador = setTimeout(buscarAhora, 350); });
      cajaNegocio.replaceChildren(el("span", { clase: "lbl", texto: "Negocio" }), q, res);
    };

    const renderCliente = () => {
      const nombre = el("input", { value: L.nombre, maxlength: "60", autocomplete: "name", "aria-label": "Nombre de quien recibe" });
      const wa = el("input", { value: L.wa, inputmode: "tel", maxlength: "20", "aria-label": "WhatsApp del cliente" });
      const mail = el("input", { value: L.mail, inputmode: "email", autocapitalize: "off", maxlength: "120", "aria-label": "Correo del cliente (opcional)" });
      nombre.addEventListener("input", () => { L.nombre = nombre.value; });
      wa.addEventListener("input", () => { L.wa = wa.value; });
      mail.addEventListener("input", () => { L.mail = mail.value; });
      cajaCliente.replaceChildren(el("span", { clase: "lbl", texto: "Cliente" }), campo("Nombre de quien recibe", nombre), campo("WhatsApp", wa), campo("Correo (opcional)", mail));
    };

    const renderDisplays = () => {
      const bloqueado = Boolean(L.ventaId);
      const quitar = (f) => el("button", { type: "button", clase: "chip r", "aria-label": "Quitar " + f, on: { click: () => { L.folios = L.folios.filter((x) => x !== f); renderDisplays(); renderResumen(); renderCobro(); } } }, ["Quitar"]);
      const filas = L.folios.map((f) => el("li", { clase: "li" }, [
        el("span", { clase: "folio sm", texto: f }),
        el("span", { clase: "grow" }, [el("span", { clase: "m", texto: "ir.bienvisto.com.mx/" + f.toLowerCase() })]),
        bloqueado ? el("span") : quitar(f),
      ]));
      const folioIn = el("input", { placeholder: "Ej. M3K7", maxlength: "4", autocomplete: "off", autocapitalize: "characters", "aria-label": "Folio del display" });
      const sugeridos = [...libres].filter((f) => !L.folios.includes(f)).slice(0, 6);
      const pararLector = () => pararCamara();
      const escanear = el("button", { type: "button", clase: "btn s", on: { click: () => {
        visor.replaceChildren();
        leerQr((f) => { visor.replaceChildren(); agregar(f); }, (cancelar) => {
          pararCamara = cancelar;
          visor.append(el("button", { type: "button", clase: "btn s sm", on: { click: () => { pararLector(); visor.replaceChildren(); } } }, ["Cerrar cámara"]));
        }, (m, video) => {
          if (video) return visor.prepend(video);
          texto(msg, m, "err");
        });
      } } }, ["Escanear QR"]);
      cajaDisplays.replaceChildren(
        el("span", { clase: "lbl", texto: "Se activarán " + L.folios.length + " de " + MAX_LOTE }),
        filas.length ? el("ul", { clase: "lista-filas" }, filas) : el("p", { clase: "hint", texto: "Aún no agregas displays. Toca el primero." }),
        bloqueado
          ? el("p", { clase: "hint", texto: "La venta ya se creó. Reintenta el cobro para activarla." })
          : el("div", {}, [
            el("div", { clase: "fila", style: "margin-top:8px" }, [folioIn, el("button", { type: "button", clase: "btn s sm", on: { click: () => { agregar(folioIn.value.trim()); folioIn.value = ""; } } }, ["Agregar"])]),
            el("div", { clase: "fila", style: "margin-top:8px;flex-wrap:wrap" }, [escanear]),
            sugeridos.length ? el("span", { clase: "lbl", style: "margin-top:12px", texto: "Libres a la mano" }) : el("span"),
            sugeridos.length ? el("div", { clase: "seg" }, sugeridos.map((f) => el("button", { type: "button", on: { click: () => agregar(f) } }, [f]))) : el("span"),
          ]),
        visor,
      );
    };

    const montar = () => {
      raiz.replaceChildren(
        el("div", { clase: "fila", style: "justify-content:flex-start;margin:0 0 6px" }, [el("span", { clase: "chip v", texto: "Lote · negocio nuevo" })]),
        el("h2", { texto: "Activar varios" }),
        el("p", { clase: "sub", texto: "Primero el cliente y su negocio; después agregas los displays. Promoción: " + PROMO_N + " por " + dinero(PROMO_PRECIO) + " en la misma venta." }),
        cajaNegocio,
        cajaCliente,
        cajaDisplays,
        cajaResumen,
        cajaCobro,
        msg,
      );
      renderNegocio();
      renderCliente();
      renderDisplays();
      renderResumen();
      renderCobro();
    };

    const pantallaLoteListo = () => {
      const n = L.hecho.length;
      raiz.replaceChildren(
        el("h2", { texto: n + (n === 1 ? " display activo" : " displays activos") }),
        el("p", { clase: "sub", texto: "Desde ahora, cada escaneo lleva a dejar una reseña de " + L.negocio.nombre + "." }),
        el("div", { clase: "tarjeta" }, [el("dl", { clase: "kv" }, [
          el("dt", { texto: "Negocio" }), el("dd", { texto: L.negocio.nombre }),
          el("dt", { texto: "Dirección" }), el("dd", { texto: L.negocio.direccion || "—" }),
          el("dt", { texto: "Cliente" }), el("dd", { texto: L.nombre.trim() }),
        ])]),
        el("span", { clase: "lbl", texto: "Displays activados" }),
        el("ul", { clase: "lista" }, L.hecho.map((f) => el("li", {}, [el("span", { clase: "folio sm", texto: f })]))),
        el("button", { type: "button", clase: "btn s", on: { click: () => { L.folios = []; L.ventaId = null; L.hecho = null; montar(); } } }, ["Agregar más a este negocio"]),
        el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => { aviso = n + (n === 1 ? " display activado." : " displays activados."); ir("#/hoy"); } } }, ["Terminar"]),
      );
    };

    montar();
    return [raiz];
  }

  // Mi desempeño ("Tu mes"): displays que Bien Visto confirmó como entregados este mes.
  async function pDesempeno() {
    const d = await getJSON("/api/vendedor/desempeno");
    if (!d) return null;
    const hoy = new Date();
    const mes = hoy.toLocaleDateString("es-MX", { month: "long" });
    const quedan = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate() - hoy.getDate();
    const n = Number(d.entregados_mes) || 0;
    const com = Number(d.comision_display) || COMISION_DISPLAY;
    const nodos = [
      el("div", { clase: "fila", style: "justify-content:space-between;align-items:flex-end" }, [
        el("h2", { texto: "Tu mes", style: "margin:0" }),
        el("span", { clase: "chip", texto: "Quedan " + quedan + (quedan === 1 ? " día" : " días") }),
      ]),
      el("div", { clase: "tarjeta", style: "margin-top:10px" }, [
        el("span", { clase: "lbl", texto: "Displays entregados en " + mes }),
        el("b", { texto: String(n), style: "font:600 40px/1 var(--fd)" }),
        el("p", { clase: "hint", texto: n === 0 ? "Cuando entregues tu primer display y Bien Visto lo confirme, aparecerá aquí." : "Cada display que entregas y Bien Visto confirma suma a tu mes." }),
      ]),
      el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Tu comisión de " + mes }),
        el("b", { texto: dinero(n * com) }),
        el("p", { clase: "hint", texto: n + " × " + dinero(com) + ". La retienes al cobrar: del dinero del cliente te quedas " + dinero(com) + " y entregas " + dinero(PRECIO_DISPLAY - com) + " a Bien Visto." }),
      ]),
    ];
    if (d.sin_entregar > 0) {
      nodos.push(el("div", { clase: "tarjeta", style: "border-color:var(--ambar)" }, [
        el("span", { clase: "lbl", texto: "Te están esperando" }),
        el("p", { clase: "hint", texto: "Tienes " + d.sin_entregar + (d.sin_entregar === 1 ? " display vendido" : " displays vendidos") + " sin entregar. Cuando entregues el dinero, cuenta" + (d.sin_entregar === 1 ? "" : "n") + " en tu mes." }),
        el("button", { type: "button", clase: "btn p sm", on: { click: () => ir("#/saldo") } }, ["Entregar ahora"]),
      ]));
    }
    nodos.push(
      el("details", { clase: "tarjeta" }, [
        el("summary", { style: "font-weight:600;padding:10px 0;min-height:44px;cursor:pointer", texto: "Las reglas, en corto" }),
        el("ul", { clase: "lista", style: "padding-left:18px" }, [
          el("li", {}, ["Un display ", el("b", { texto: "cuenta cuando Bien Visto confirma tu entrega" }), ", no cuando lo vendes."]),
          el("li", {}, ["El mes va del ", el("b", { texto: "1 al último día" }), ". El día 1 empiezas de cero."]),
          el("li", {}, ["Una venta anulada no cuenta."]),
        ]),
      ]),
      el("p", { clase: "hint", style: "text-align:center", texto: "Hoy tienes " + d.activos + " displays activos y " + d.escaneos_7d + " escaneos en 7 días." }),
    );
    return nodos;
  }

  // Varios = "Activar varios" del mockup: promoción, negocio nuevo y negocios con displays activos.
  async function pVarios() {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const grupos = new Map();
    for (const x of (d.displays || []).filter((y) => y.estado === "activo" && y.negocio_asignado)) {
      const g = grupos.get(x.negocio_asignado) || { nombre: x.negocio_asignado, direccion: x.direccion || "", n: 0 };
      g.n += 1;
      grupos.set(x.negocio_asignado, g);
    }
    const filas = [...grupos.values()].map((g) => el("button", { type: "button", clase: "li", on: { click: () => ir("#/lote") } }, [
      el("span", { clase: "grow" }, [
        el("span", { clase: "t", texto: g.nombre }),
        el("span", { clase: "m", texto: (g.direccion || "Sin dirección") + " · " + g.n + (g.n === 1 ? " display" : " displays") }),
      ]),
      icono('<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'),
    ]));
    return conAviso([
      el("h2", { texto: "Activar varios" }),
      el("p", { clase: "sub", texto: "Elige el negocio una vez y toca cada display. Ideal cuando entregas 2 o 3 en el mismo local." }),
      el("div", { clase: "promo" }, [
        el("span", { clase: "pb" }, [el("b", { texto: String(PROMO_N) }), "por " + dinero(PROMO_PRECIO)]),
        el("p", {}, [
          el("b", { texto: "Promoción: " + PROMO_N + " displays por " + dinero(PROMO_PRECIO) }),
          " en la misma venta, en lugar de " + dinero(PROMO_N * PRECIO_DISPLAY) + ". Tu comisión sigue siendo " + dinero(COMISION_DISPLAY) + " por display.",
        ]),
      ]),
      el("button", { type: "button", clase: "btn p", on: { click: () => ir("#/lote") } }, ["Negocio nuevo"]),
      ...(filas.length ? [el("span", { clase: "lbl", texto: "Negocios con displays activos" }), el("div", { clase: "lista-filas" }, filas)] : []),
    ]);
  }

  // Mi cuenta: datos del vendedor, actividad del mes y cierre de sesión (mockup "Mi cuenta").
  async function pCuenta() {
    const [yo, d, s, cobro] = await Promise.all([
      getJSON("/api/vendedor/yo"), getJSON("/api/vendedor/displays"), getJSON("/api/vendedor/saldo"),
      getJSON("/api/vendedor/cuenta-cobro").catch(() => null),
    ]);
    if (!yo || !d || !s) return null;
    const msgCobro = el("p", { clase: "msg", role: "status" });
    const avisoArriba = avisoCuenta ? [el("div", { clase: "aviso", role: "status", texto: avisoCuenta })] : [];
    avisoCuenta = "";
    const lista = d.displays || [];
    const activos = lista.filter((x) => x.estado === "activo").length;
    const libres = lista.filter((x) => x.estado === "libre").length;
    const datos = [];
    if (yo.correo) datos.push(el("dt", { texto: "Correo" }), el("dd", { texto: yo.correo }));
    if (yo.whatsapp) datos.push(el("dt", { texto: "WhatsApp" }), el("dd", { texto: yo.whatsapp }));
    datos.push(el("dt", { texto: "Acceso" }), el("dd", { texto: "Con código a tu correo" }));
    const alta = yo.fecha_registro ? new Date(String(yo.fecha_registro).replace(" ", "T") + "Z") : null;
    const altaTxt = alta && !isNaN(alta) ? alta.toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" }) : "";
    const vigenteCobro = cobro && cobro.vigente;
    const pendienteCobro = cobro && cobro.pendiente;
    const tarjetaCobro = el("div", { clase: "tarjeta" }, [
      el("span", { clase: "lbl", texto: "Mis datos de cobro" }),
      ...(cobro && cobro.rechazada
        ? [el("div", { clase: "aviso alerta", role: "status", texto: "Bien Visto no aprobó tu último cambio a la cuenta terminada en " + String(cobro.rechazada.cuenta).slice(-4) + ". Sigue vigente tu cuenta anterior. Puedes pedir otro cambio." })]
        : []),
      ...(cobro === null
        ? [el("p", { clase: "hint", texto: "No pudimos cargar tus datos de cobro. Intenta de nuevo más tarde." })]
        : !vigenteCobro
          ? [el("p", { clase: "hint", texto: "Aún no cargas tu cuenta. Sin ella no puedes cobrar por transferencia." })]
          : [el("dl", { clase: "kv", style: "margin:0 0 12px" }, [
              el("dt", { texto: "Titular" }), el("dd", { texto: vigenteCobro.titular }),
              el("dt", { texto: "Banco" }), el("dd", { texto: vigenteCobro.banco }),
              el("dt", { texto: "CLABE" }), el("dd", { texto: formatoClabe(vigenteCobro.clabe) }),
              el("dt", { texto: "Cuenta" }), el("dd", { texto: vigenteCobro.cuenta }),
              el("dt", { texto: "Tipo" }), el("dd", { texto: vigenteCobro.tipo }),
            ])]),
      ...(pendienteCobro
        ? [
            el("div", { clase: "aviso", texto: "Tu cambio está en revisión. Mientras, se usa tu cuenta anterior." }),
            el("button", { type: "button", clase: "btn s sm", on: { click: async (e) => {
              e.currentTarget.disabled = true;
              const { status, datos } = await postJSON("/api/vendedor/cuenta-cobro/cancelar", {});
              if (status === 200 || (datos && datos.success)) return render();
              texto(msgCobro, errorDe(datos), "err");
              e.currentTarget.disabled = false;
            } } }, ["Cancelar cambio"]),
            msgCobro,
          ]
        : []),
      el("button", { type: "button", clase: vigenteCobro ? "btn s sm" : "btn p sm", style: "margin-top:10px", on: { click: () => ir("#/datos-cobro") } },
        [vigenteCobro ? "Cambiar mi cuenta" : "Cargar mi cuenta"]),
    ]);

    return [
      el("h2", { texto: "Mi cuenta" }),
      el("p", { clase: "sub", texto: "Tus datos como vendedor de Bien Visto." }),
      ...avisoArriba,
      el("div", { clase: "tarjeta" }, [
        el("div", { clase: "fila", style: "justify-content:flex-start;gap:14px" }, [
          el("div", { clase: "av", "aria-hidden": "true", texto: iniciales(yo.nombre || nombreVend) }),
          el("div", {}, [el("b", { texto: yo.nombre || nombreVend || "Vendedor", style: "display:block;font:600 19px/1.2 var(--fd)" }), el("span", { clase: "hint", style: "margin:2px 0 0", texto: "Vendedor" + (altaTxt ? " · alta " + altaTxt : "") })]),
        ]),
        ...(datos.length ? [el("dl", { clase: "kv", style: "margin:14px 0 8px" }, datos)] : []),
        el("p", { clase: "hint", texto: "Para cambiar tu correo o WhatsApp, pídelo a Bien Visto." }),
      ]),
      tarjetaCobro,
      el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Mi actividad" }),
        el("dl", { clase: "kv" }, [
          el("dt", { texto: "Displays activos" }), el("dd", { texto: String(activos) }),
          el("dt", { texto: "Libres en tu inventario" }), el("dd", { texto: String(libres) }),
          el("dt", { texto: "Por entregar" }), el("dd", { texto: dinero(s.custodia) }),
        ]),
        el("button", { type: "button", clase: "btn s sm", style: "margin-top:10px", on: { click: () => ir("#/saldo") } }, ["Ver mi saldo"]),
      ]),
      el("button", { type: "button", clase: "btn s", on: { click: async () => { $("cajon").hidden = false; await pintarCajon(); confirmarSalida(); } } }, ["Cerrar sesión"]),
      el("a", { clase: "btn s", style: "margin-top:8px", href: WA_AYUDA, target: "_blank", rel: "noopener" }, ["Hablar con soporte"]),
    ];
  }

  // Alta y cambio de la cuenta donde el cliente paga por transferencia. El Worker decide si queda vigente o pendiente.
  let avisoCuenta = "";
  async function pDatosCobro() {
    const d = await getJSON("/api/vendedor/cuenta-cobro");
    if (!d) return null;
    const vig = d.vigente;
    const idTitular = "cb-titular", idClabe = "cb-clabe", idCuenta = "cb-cuenta", idTipo = "cb-tipo";
    const titular = el("input", { id: idTitular, name: "titular", autocomplete: "name", placeholder: "Como aparece en tu banco", value: vig ? vig.titular : nombreVend, required: "" });
    const clabe = el("input", { id: idClabe, name: "clabe", inputmode: "numeric", autocomplete: "off", placeholder: "18 dígitos", maxlength: "22", value: vig ? formatoClabe(vig.clabe) : "", required: "" });
    const cuenta = el("input", { id: idCuenta, name: "cuenta", inputmode: "numeric", autocomplete: "off", placeholder: "8 a 11 dígitos", maxlength: "16", value: vig ? vig.cuenta : "", required: "" });
    const tipo = el("select", { id: idTipo, name: "tipo", required: "" }, [
      el("option", { value: "", texto: "Elige una opción" }),
      ...["Débito", "Nómina", "Ahorro", "Cheques"].map((t) => el("option", { value: t, texto: t })),
    ]);
    if (vig) tipo.value = vig.tipo;
    const msg = el("p", { clase: "msg", role: "status", "aria-live": "polite" });
    const boton = el("button", { type: "submit", clase: "btn p" }, [vig ? "Enviar cambio" : "Guardar mi cuenta"]);
    const form = el("form", { novalidate: "", on: { submit: async (e) => {
      e.preventDefault();
      boton.disabled = true;
      texto(msg, "Guardando…", "ok");
      try {
        const { status, datos } = await postJSON("/api/vendedor/cuenta-cobro", {
          titular: titular.value.trim(), clabe: clabe.value.replace(/\D/g, ""), cuenta: cuenta.value.replace(/\s/g, ""), tipo: tipo.value,
        });
        if (status === 201) {
          avisoCuenta = datos && datos.estado === "pendiente"
            ? "Recibimos tu cambio. Bien Visto lo revisará; mientras, sigue vigente tu cuenta anterior."
            : "Listo, guardamos tu cuenta de cobro.";
          return ir("#/cuenta");
        }
        if (status === 409) texto(msg, "No cambiaste nada. Modifica algún dato para enviar el cambio.", "err");
        else if (status === 401) return;
        else texto(msg, errorDe(datos), "err");
      } catch (_) {
        texto(msg, MSG_ERROR_RED, "err");
      } finally {
        boton.disabled = false;
      }
    } } }, [
      el("label", { clase: "lbl", for: idTitular, texto: "Titular" }), titular,
      el("p", { clase: "hint", texto: "Debe ser tu nombre, tal como aparece en tu cuenta." }),
      el("label", { clase: "lbl", for: idClabe, texto: "CLABE" }), clabe,
      el("p", { clase: "hint", texto: "18 dígitos. Compárala con tu app del banco." }),
      el("label", { clase: "lbl", for: idCuenta, texto: "Número de cuenta" }), cuenta,
      el("label", { clase: "lbl", for: idTipo, texto: "Tipo de cuenta" }), tipo,
      boton,
    ]);
    return [
      el("h2", { texto: vig ? "Cambiar mi cuenta" : "Mi cuenta de cobro" }),
      el("p", { clase: "sub", texto: "Aquí recibe tu cliente el pago cuando cobras por transferencia." }),
      ...(d.pendiente ? [el("div", { clase: "aviso", texto: "Ya tienes un cambio en revisión. Si envías otro, reemplaza al anterior." })] : []),
      form,
      msg,
      el("p", { clase: "hint", texto: vig ? "Si cambias tu cuenta, Bien Visto la revisa antes de usarla." : "Se guarda al instante: es tu primera cuenta." }),
      el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/cuenta") } }, ["Volver a Mi cuenta"]),
    ];
  }

  async function pProximamente([nombre]) {
    return [
      el("h2", { texto: nombre || "Próximamente" }),
      el("div", { clase: "tarjeta" }, [el("b", { texto: "Esta función llega pronto." }), el("span", { texto: "Por ahora puedes ver tus displays, tu saldo y tus ventas." })]),
    ];
  }

  const IC_MENU = {
    user: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5"/></svg>',
    coin: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.2 1.1-2 2.5-2s2.5.8 2.5 2-1 1.7-2.5 2-2.5.8-2.5 2 1.1 2 2.5 2 2.5-.8 2.5-2"/></svg>',
    mes: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9.5 15.2l1.9 1.9 3.6-3.8"/></svg>',
    list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    book: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v17H6a2 2 0 0 0-2 2zM4 19V5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    help: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
    out: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg>'
  };
  const iniciales = (n) => (n || "V").split(" ").filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");

  function svgDe(nombre) { const t = document.createElement("span"); t.innerHTML = IC_MENU[nombre]; return t.firstChild; }

  async function pintarCajon() {
    const cuerpo = $("cajon-in");
    const [saldo, ventas] = await Promise.all([
      getJSON("/api/vendedor/saldo").catch(() => null),
      getJSON("/api/vendedor/ventas").catch(() => null),
    ]);
    const lista = (ventas && ventas.ventas) || [];
    const ok = lista.filter((v) => v.estado !== "anulada" && v.estado !== "rechazada");
    const enMano = saldo && saldo.custodia ? Number(saldo.custodia) : 0;
    const cerrar = () => abrirCajon(false);
    const item = (nombreIc, titulo, sub, chip, destino) => el("button", { type: "button", clase: "mi", on: { click: () => { cerrar(); if (destino.startsWith("#")) ir(destino); else window.open(destino, "_blank", "noopener"); } } }, [
      svgDe(nombreIc),
      el("span", { clase: "mi-cuerpo" }, [el("span", { texto: titulo }), sub ? el("small", { texto: sub }) : null].filter(Boolean)),
      chip ? el("span", { clase: "ch", texto: chip }) : null,
    ].filter(Boolean));
    cuerpo.replaceChildren(
      el("div", { clase: "mn-top" }, [
        el("span", { clase: "mn-av", texto: iniciales(nombreVend), "aria-hidden": "true" }),
        el("div", { clase: "grow" }, [el("b", { texto: nombreVend || "Vendedor" }), correoVend ? el("small", { texto: correoVend }) : null].filter(Boolean)),
        el("button", { type: "button", clase: "mn-x", id: "btn-cerrar-cajon", "aria-label": "Cerrar menú", on: { click: cerrar } }, ["✕ Cerrar"]),
      ]),
      item("user", "Mi cuenta", "Tus datos y tu cuenta de cobro", "", "#/cuenta"),
      item("coin", "Mi saldo y entregas", "", enMano > 0 ? dinero(enMano) : "Al corriente", "#/saldo"),
      item("mes", "Mi desempeño", "Tus entregas del mes", "", "#/desempeno"),
      item("list", "Mis ventas y comisión", ok.length + (ok.length === 1 ? " venta" : " ventas"), "", "#/ventas"),
      el("div", { clase: "msep" }),
      item("book", "Manual de uso", "bienvisto.com.mx/ayuda/manual", "", "https://bienvisto.com.mx/ayuda/manual"),
      el("button", { type: "button", clase: "mi", on: { click: () => { verAyuda = true; abrirCajon(false); render(); } } }, [svgDe("help"), el("span", { texto: "Ayuda de esta pantalla" })]),
      item("chat", "Escribir a soporte", "Por WhatsApp", "", WA_AYUDA),
      el("div", { clase: "msep" }),
      el("button", { type: "button", clase: "mi", id: "btn-salir", on: { click: confirmarSalida } }, [svgDe("out"), el("span", { clase: "mi-cuerpo" }, [el("span", { texto: "Cerrar sesión" })])]),
    );
  }

  function confirmarSalida() {
    $("cajon-in").replaceChildren(
      el("h2", { texto: "¿Cerrar sesión?" }),
      el("p", { clase: "sub", texto: "Para volver a activar displays tendrás que entrar de nuevo con tu correo." }),
      el("button", { type: "button", clase: "btn p", on: { click: () => { abrirCajon(false); cerrarSesion(); } } }, ["Cerrar sesión"]),
      el("button", { type: "button", clase: "btn s", on: { click: () => pintarCajon() } }, ["Cancelar"]),
    );
  }

  function abrirCajon(abrir) {
    $("cajon").hidden = !abrir;
    if (abrir) pintarCajon();
  }

  window.addEventListener("hashchange", () => { verAyuda = false; abrirCajon(false); render(); });
  $("btn-menu").addEventListener("click", () => abrirCajon(true));
  $("cajon").addEventListener("click", (e) => { if (e.target.id === "cajon") abrirCajon(false); });
  $("btn-atras").addEventListener("click", () => { if (history.length > 1) history.back(); else ir("#/hoy"); });
  for (const b of $$(".tabs button")) b.addEventListener("click", () => ir("#/" + b.dataset.tab));
  iniciar();
})();
</script>
</body>
</html>
