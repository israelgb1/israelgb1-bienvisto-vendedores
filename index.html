<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bien Visto · Vendedores</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Tokens del brandbook v1.2 */
:root{
  --verde-visto:#0E6B5C;
  --ambar-resena:#F2A71B;
  --ambar-texto:#8A5A00;
  --tinta:#12302B;
  --tinta-suave:#4A5F59;
  --crema:#FBF6EC;
  --menta:#E7F0EC;
  --borde-fuerte:#6B897E;
  --borde:#CFDDD6;
  --error:#B3261E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--crema);color:var(--tinta);font-family:Figtree,system-ui,sans-serif;font-weight:400;font-size:17px;line-height:28px}
body{min-height:100vh;overflow-x:hidden}
main{max-width:420px;margin:0 auto;padding:32px 16px;text-align:left}
.cabecera{margin:0 0 4px}
.isologo{display:block;width:220px;max-width:100%;height:auto}
.etiqueta{font-family:Figtree,system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar-texto);margin:0 0 24px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:36px;line-height:42px;margin:0 0 16px;color:var(--tinta);font-style:normal;text-decoration:none}
h1 .segunda{color:var(--verde-visto)}
label{display:block;font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--tinta-suave);margin:0 0 6px;font-weight:600}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--borde-fuerte);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus{outline:3px solid var(--verde-visto);outline-offset:1px}
button{font-family:Figtree,system-ui,sans-serif;font-weight:600;font-size:16px;line-height:24px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--verde-visto);color:var(--crema);cursor:pointer;margin-top:12px}
button:focus-visible{outline:3px solid var(--ambar-resena);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.sec{background:transparent;color:var(--verde-visto);border:1px solid var(--borde-fuerte)}
.msg{min-height:24px;margin:16px 0 0;font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:24px;color:var(--tinta-suave)}
.msg.err{color:var(--error)}
.msg.ok{color:var(--tinta-suave)}
.guia{margin:0 0 24px;color:var(--tinta);font-size:17px;line-height:28px}
.guia ol{margin:8px 0 0;padding-left:20px}
.guia li{margin:4px 0}
.paso[hidden]{display:none}
.bloque{margin-top:8px}
.fila{display:flex;gap:8px;align-items:center;justify-content:space-between}
.enlace{background:none;border:0;color:var(--verde-visto);padding:0;width:auto;margin:0;font-size:14px;line-height:20px;font-weight:600;text-decoration:underline}
.pie{margin-top:40px;padding-top:20px;border-top:1px solid var(--borde);font-family:Figtree,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--tinta-suave);text-align:center}
.pie a{color:var(--verde-visto);font-weight:600}
.pie .boton-soporte{display:inline-block;text-align:center;text-decoration:none;width:auto;padding:10px 16px;margin-top:12px;background:transparent;color:var(--verde-visto);border:1px solid var(--borde-fuerte);border-radius:10px;font-size:15px}
.enlace:disabled{color:var(--tinta-suave);text-decoration:none}
[hidden]{display:none!important}
/* Panel de vendedor · diseño del prototipo, con datos reales */
:root{--verde:var(--verde-visto);--verde-h:#0A5246;--ambar:var(--ambar-resena);--muted:var(--tinta-suave);--borde-s:var(--borde-fuerte);--danger:var(--error);--fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:Figtree,system-ui,sans-serif}
body.con-tabs{background:var(--menta)}
body.con-tabs #cabecera-login,body.con-tabs .pie,body.con-tabs .etiqueta{display:none}
body.con-tabs main{max-width:none;padding:0;margin:0}
#paso-sesion{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--crema);position:relative}
#paso-sesion input{min-height:48px;border:2px solid var(--borde-s);border-radius:8px;padding:10px 14px;font-size:17px}
#paso-sesion input:focus{outline:3px solid var(--ambar);outline-offset:0;border-color:var(--tinta)}
#paso-sesion input[aria-invalid=true]{border-color:var(--danger)}
#paso-sesion select{width:100%;min-height:48px;padding:10px 14px;font:400 17px/24px var(--fb);border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta)}
#paso-sesion textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--borde-s);border-radius:8px;background:#fff;color:var(--tinta);min-height:80px}
#paso-sesion .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;height:62px;background:var(--menta);border-bottom:1px solid var(--borde);flex:none}
.bar .iso{width:38px;height:auto;flex:none}
.bar .grow{flex:1}
.bk{width:auto;margin:0;padding:8px 12px;min-height:40px;border-radius:999px;background:transparent;color:var(--verde);border:2px solid var(--verde);font-size:14px}
.hmb{width:auto;margin:0;padding:0 14px;height:46px;border-radius:14px;background:var(--verde);color:var(--crema);font-size:16px;display:flex;align-items:center;gap:8px}
.hmb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
#app{flex:1;padding:14px 16px 110px;overflow-x:hidden}
#app h2{font:700 26px/1.1 var(--fd);margin:6px 0 4px;color:var(--tinta);letter-spacing:-.015em}
.sub{font-size:16px;color:var(--muted);margin:0 0 14px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:#fff;border-top:1px solid var(--borde);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;width:auto;margin:0;padding:8px 0 10px;border-radius:0;background:transparent;color:var(--muted);font:600 14px/1.15 var(--fb);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px}
.tabs button[aria-current="page"]{color:var(--verde);box-shadow:inset 0 3px 0 var(--verde);background:#F1F7F4}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{width:100%;min-height:52px;padding:14px 24px;margin:0 0 12px;border-radius:999px;border:2px solid transparent;font:600 17px/20px var(--fb);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--verde);color:var(--crema)}
.btn.a{background:var(--ambar);color:var(--tinta)}
.btn.s{background:transparent;color:var(--tinta);border-color:var(--borde-s)}
.btn.sm{width:auto;min-height:44px;padding:10px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.venta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--verde);color:var(--crema);border-radius:20px;padding:14px 16px;margin:8px 0 8px;border:0;min-height:84px;font-weight:400;box-shadow:0 4px 0 var(--tinta)}
.venta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--tinta)}
.venta .vi{width:50px;height:50px;border-radius:50%;background:var(--ambar);display:grid;place-items:center;flex:none}
.venta .vi svg{width:30px;height:30px;stroke:var(--tinta)}
.venta .vt b{display:block;font:600 22px/1.2 var(--fd)}
.venta .vt span{display:block;font-size:14px;opacity:.92;margin-top:2px}
.hero{background:var(--verde);color:var(--crema);border-radius:20px;padding:18px;margin:0 0 12px}
.hero .lbl{color:var(--crema);opacity:.9}
.hero small{display:block;font-size:14px;opacity:.92}
.hero .grande{color:var(--crema);margin:4px 0}
.card,.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:16px;margin:0 0 12px}
.card b,.tarjeta b{display:block;font-weight:600;font-size:17px}
.card span,.tarjeta span{display:block;font-size:15px;color:var(--muted)}
.centro{text-align:center}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .card,.dos .tarjeta{margin:0}
.lista{list-style:none;padding:0;margin:0}
.lista li{margin:0 0 8px}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:0;padding:14px;background:#fff;color:var(--tinta);border:1px solid var(--borde);border-radius:16px;font-weight:400;min-height:60px;text-decoration:none}
.item b{display:block;font-weight:600;font-size:17px}
.item span{font-size:15px;color:var(--muted)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.folio{font:600 34px/1 var(--fd);letter-spacing:.08em;color:var(--verde)}
.folio.sm{font-size:20px}
.chip{display:inline-flex;align-items:center;font:600 13px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--ambar);color:var(--tinta);white-space:nowrap}
.chip.v{background:var(--menta);color:var(--verde)}
.chip.g{background:#eef0ef;color:var(--muted)}
.chip.r{background:#f7e3e1;color:var(--danger)}
.lbl{font:600 14px/18px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 6px}
.hint{font-size:15px;color:var(--muted);margin:4px 0 14px}
.campo{display:block;margin:0 0 14px}
.aviso{background:var(--menta);border-radius:12px;padding:12px 14px;margin:0 0 12px;color:var(--tinta)}
.aviso.alerta{background:#f7e3e1;color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0 0 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.grande{font:600 40px/1 var(--fd);display:block;margin:6px 0;color:var(--tinta)}
.escaneos-dia{display:flex;align-items:flex-end;gap:8px;height:96px;margin:12px 0 8px}
.escaneos-dia > div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;min-width:0}
.escaneos-dia .b{background:var(--verde);border-radius:6px 6px 2px 2px}
.escaneos-dia .b.vacio{background:var(--borde)}
.escaneos-dia .d{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;line-height:1}
.opcion{display:flex;gap:10px;align-items:center;font-size:16px;margin:0 0 10px}
.opcion input{width:auto;min-height:0;margin:0}
.res{border:1px solid var(--borde);border-radius:12px;overflow:hidden;background:#fff;margin-top:8px}
.drawer{position:fixed;inset:0;background:rgba(18,48,43,.55);z-index:20;display:flex;justify-content:flex-end;max-width:440px;margin:0 auto}
.drawer-in{background:var(--crema);width:88%;max-width:330px;height:100%;padding:16px 12px 20px;overflow-y:auto}
.drawer .x{width:44px;height:44px;border-radius:50%;background:var(--menta);font-size:20px;margin:0 0 10px;padding:0}
.drawer nav a{display:flex;align-items:center;min-height:50px;padding:10px 8px;border-radius:12px;font-weight:600;color:var(--tinta);text-decoration:none;font-size:16px}
.drawer nav a:hover,.drawer nav a:focus-visible{background:var(--menta)}
.drawer .btn{margin-top:12px}
.msg{margin:6px 0 0}
.msg:empty{display:none}
.barra{height:10px;border-radius:999px;background:var(--menta);overflow:hidden;margin:6px 0 10px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:999px}
a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{width:auto;min-height:40px;padding:8px 14px;border-radius:999px;background:transparent;border:2px solid var(--borde-s);font:600 14px/1 var(--fb);color:var(--tinta);white-space:nowrap;flex:none;margin:0}
.seg button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--crema)}
/* Mockup: listas de filas, tarjetas de acceso rápido, campos */
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--borde);width:100%;text-align:left;min-height:60px;background:transparent;color:var(--tinta);font-weight:400;margin:0;border-top:0;border-left:0;border-right:0;border-radius:0}
.lista-filas{list-style:none;padding:4px 14px;margin:0 0 12px;background:#fff;border:1px solid var(--borde);border-radius:16px}
.lista-plana{list-style:none;padding:0;margin:0 0 12px}
.hoja-fondo{position:fixed;inset:0;background:rgba(17,35,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.hoja{background:var(--crema,#FBF8F1);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;box-sizing:border-box}
.hoja-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hoja-top h2{margin:0}
.hoja-cuerpo{margin-top:12px}
.dato-pago{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--borde)}
.dato-pago:last-child{border-bottom:0}
.dato-pago .lbl{margin:0}
.lista-plana > li > .li{border-bottom:1px solid var(--borde)}
.lista-plana > li:last-child > .li{border-bottom:0}
.li:last-child{border-bottom:0}
.li .folio{flex:none}
.li .grow{flex:1;min-width:0}
.li .t{display:block;font-weight:600;line-height:1.25;font-size:16px}
.li .m{display:block;font-size:14.5px;color:var(--muted);line-height:1.3}
.li .chip{flex:none}
.li .chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--verde);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.promo{display:flex;gap:12px;align-items:center;background:#FFF3D6;border:2px solid var(--ambar);border-radius:18px;padding:12px 14px;margin:0 0 12px;color:var(--tinta)}
.promo .pb{flex:none;background:var(--ambar);border-radius:14px;padding:6px 10px;text-align:center;font:700 13px/1.1 var(--fb)}
.promo .pb b{display:block;font:700 26px/1 var(--fd)}
.promo p{margin:0;font-size:15px;line-height:1.3}
.promo p b{font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split div{background:var(--menta);border-radius:12px;padding:10px 12px}
.split b{display:block;font:600 22px/1.1 var(--fd)}
.split span{font-size:12.5px;color:var(--muted);line-height:1.25;display:block}
.split .me{background:var(--ambar)}
.split .me span{color:var(--tinta)}
.mini{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin:6px 0 14px}
.mini button{background:#fff;border:2px solid var(--borde);border-radius:18px;padding:12px 14px;text-align:left;min-height:72px;color:var(--tinta);margin:0;width:100%}
.mini button b{display:block;font-size:16px;line-height:1.2;margin-bottom:2px;font-weight:600}
.mini button span{display:block;font-size:14px;color:var(--muted);line-height:1.3}
.mini button.alerta{border-color:var(--ambar);background:#FFF3D6}
.btn.s.qr{margin:18px 0 14px}
.btn.s.qr svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--verde);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#app input{min-height:48px;border:2px solid var(--borde-s);border-radius:8px;padding:10px 14px;font-size:17px}
#app input:focus{outline:3px solid var(--ambar);outline-offset:0;border-color:var(--tinta)}
.helpl{display:block;width:auto;margin:14px auto 0;padding:10px 0;min-height:44px;background:none;color:var(--verde);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;border:0;text-align:center}
.bk{width:auto;height:46px;margin:0;padding:0 16px 0 10px;border-radius:14px;background:#fff;color:var(--verde);border:2px solid var(--verde);font:600 17px/1 var(--fb);display:flex;align-items:center;gap:4px;flex:none}
.bk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bk:hover{background:var(--verde);color:#fff}
h3.sec-t{font:500 19px/1.2 var(--fd);margin:16px 0 6px;color:var(--tinta)}
.steps{display:flex;gap:6px;margin:2px 0 14px}.steps i{height:6px;flex:1;border-radius:3px;background:var(--borde)}.steps i.on{background:var(--verde)}
.clb{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;margin:0 0 14px;border:2px solid var(--verde);border-radius:16px;background:#fff;color:var(--tinta);text-align:left}
.clb:hover{background:var(--menta)}
.clb .ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--menta);display:grid;place-items:center}
.clb .ic svg{width:24px;height:24px;fill:none;stroke:var(--verde);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.clb b{display:block;font:600 17px/1.2 var(--fd);color:var(--tinta)}
.clb .s{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.clb .ch{flex:none;margin-left:auto;width:20px;height:20px;fill:none;stroke:var(--verde);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.resultados{max-height:260px;overflow-y:auto;margin:4px 0 12px;padding:2px 2px 0 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.drawer-in{background:var(--crema);width:85%;max-width:330px;height:100%;padding:16px 14px 20px;overflow-y:auto}
.av{width:64px;height:64px;border-radius:50%;background:var(--verde);color:var(--crema);display:grid;place-items:center;font:600 23px/1 var(--fd);flex:none}
.mn-top small{display:block;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.mn-top{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.mn-av{width:46px;height:46px;border-radius:50%;background:var(--verde);color:var(--crema);display:grid;place-items:center;font:600 17px/1 var(--fd);flex:none}
.mn-top .grow{flex:1;min-width:0}
.mn-top b{display:block;font:600 17px/1.2 var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-x{width:auto;margin:0 0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;background:var(--menta);font:600 15px/1 var(--fb);color:var(--tinta);display:inline-flex;align-items:center;gap:6px;flex:none}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 8px;border-radius:12px;min-height:54px;font-weight:600;color:var(--tinta);text-decoration:none;font-size:16px;background:transparent;border:0}
.mi:hover,.mi:focus-visible{background:var(--menta)}
.mi svg{width:22px;height:22px;fill:none;stroke:var(--verde);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mi small{display:block;font-weight:400;font-size:14px;color:var(--muted);line-height:1.25}
.mi .ch{margin-left:auto;font-size:12px;font-weight:600;background:var(--menta);border-radius:999px;padding:3px 9px;color:var(--verde);white-space:nowrap}
.msep{border-top:1px solid var(--borde);margin:8px 2px}
.mi-cuerpo{flex:1;min-width:0}
.mi-cuerpo span{display:block}
/* Igualar al mockup: ritmo tipográfico del panel (sin el interlineado de 28px del sitio) */
#paso-sesion{font-size:16px;line-height:1.5}
#app h2{line-height:1.15}
.sub{font-size:16px;line-height:1.5;margin:0 0 14px}
.hint{line-height:1.4}

-125.23 22.64 -129.8 29 -129.8C35.36 -129.8 40.65 -125.23 41.78 -119.2H63C69.61 -119.2 74.96 -113.85 74.96 -107.24C74.96 -100.63 69.61 -95.28 63 -95.28H42V-43.8C42 -33.31 50.51 -24.8 61 -24.8C68.18 -24.8 74 -18.98 74 -11.8C74 -4.62 68.18 1.2 61 1.2C36.15 1.2 16 -18.95 16 -43.8V-95.28Z"/><path fill="#12302B" transform="translate(793.55 0)" d="M0 -59C0 -92.69 27.31 -120 61 -120C94.69 -120 122 -92.69 122 -59C122 -25.31 94.69 2 61 2C27.31 2 0 -25.31 0 -59ZM26.78 -59C26.78 -40.1 42.1 -24.78 61 -24.78C79.9 -24.78 95.22 -40.1 95.22 -59C95.22 -77.9 79.9 -93.22 61 -93.22C42.1 -93.22 26.78 -77.9 26.78 -59Z"/></g></svg>
  </header>
  <p class="etiqueta">Acceso para vendedores</p>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COOLDOWN_SEG = 60;
  const MSG_CORREO_INVALIDO = "Escribe un correo válido.";
  const MSG_ENVIADO = "Si el correo está registrado, te enviamos un código.";
  const MSG_FALLO_CODIGO = "Código incorrecto o vencido.";
  const MSG_ERROR_RED = "No pudimos conectar. Intenta de nuevo.";
  const MSG_ERROR_GENERAL = "Algo salió mal. Intenta más tarde.";

  let correoActual = "";
  let timerReenvio = null;

  function mostrar(id) {
    for (const s of document.querySelectorAll(".paso")) s.hidden = s.id !== id;
    enPanel = id === "paso-sesion";
    document.body.classList.toggle("con-tabs", id === "paso-sesion");
    if (id === "paso-sesion") entrarPanel();
  }

  function texto(el, msg, tipo) {
    el.textContent = msg;
    el.className = "msg " + (tipo || "ok");
  }

  async function llamar(ruta, cuerpo) {
    const res = await fetch(ruta, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo || {}),
    });
    let datos = null;
    try { datos = await res.json(); } catch (_) { datos = null; }
    return { status: res.status, datos };
  }

  function iniciarEsperaReenvio() {
    const btn = $("btn-reenviar");
    let restante = COOLDOWN_SEG;
    btn.disabled = true;
    btn.textContent = `Reenviar en ${restante} s`;
    clearInterval(timerReenvio);
    timerReenvio = setInterval(() => {
      restante -= 1;
      if (restante <= 0) {
        clearInterval(timerReenvio);
        btn.disabled = false;
        btn.textContent = "Reenviar código";
      } else {
        btn.textContent = `Reenviar en ${restante} s`;
      }
    }, 1000);
  }

  async function pedirCodigo(e, desdeCodigo) {
    if (e) e.preventDefault();
    const correo = $("correo").value.trim();
    const msg = desdeCodigo ? $("msg-codigo") : $("msg-correo");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return texto(msg, MSG_CORREO_INVALIDO, "err");
    $("btn-enviar").disabled = true;
    try {
      const { status, datos } = await llamar("/api/vendedor/codigo", { correo });
      if (status === 400) return texto(msg, MSG_CORREO_INVALIDO, "err");
      if (status !== 200 || !datos || datos.success !== true) return texto(msg, MSG_ERROR_GENERAL, "err");
      correoActual = correo;
      $("codigo").value = "";
      texto($("msg-codigo"), MSG_ENVIADO, "ok");
      mostrar("paso-codigo");
      iniciarEsperaReenvio();
      $("codigo").focus();
    } catch (_) {
      texto(msg, MSG_ERROR_RED, "err");
    } finally {
      $("btn-enviar").disabled = false;
    }
  }

  async function verificarCodigo(e) {
    if (e) e.preventDefault();
    const codigo = $("codigo").value.trim();
    const msg = $("msg-codigo");
    if (!/^\d{6}$/.test(codigo)) return texto(msg, "Escribe los 6 dígitos del código.", "err");
    $("btn-entrar").disabled = true;
    try {
      const { status, datos } = await llamar("/api/vendedor/verificar", { correo: correoActual, codigo });
      if (status === 200 && datos && datos.success === true) {
        clearInterval(timerReenvio);
        return mostrar("paso-sesion");
      }
      if (status === 401) return texto(msg, MSG_FALLO_CODIGO, "err");
      if (status === 400) return texto(msg, "Revisa el código e intenta de nuevo.", "err");
      texto(msg, MSG_ERROR_GENERAL, "err");
    } catch (_) {
      texto(msg, MSG_ERROR_RED, "err");
    } finally {
      $("btn-entrar").disabled = false;
    }
  }

  function volverACorreo() {
    clearInterval(timerReenvio);
    correoActual = "";
    texto($("msg-correo"), "", "ok");
    mostrar("paso-correo");
    $("correo").focus();
  }

  async function cerrarSesion() {
    try { await llamar("/api/vendedor/salir"); } catch (_) { /* se limpia igual en pantalla */ }
    volverACorreo();
  }

  async function iniciar() {
    try {
      const res = await fetch("/api/vendedor/yo");
      if (res.ok) return mostrar("paso-sesion");
    } catch (_) { /* sin conexión: mostramos la entrada */ }
    mostrar("paso-correo");
    $("correo").focus();
  }

  $("form-correo").addEventListener("submit", pedirCodigo);
  $("form-codigo").addEventListener("submit", verificarCodigo);
  $("btn-reenviar").addEventListener("click", (e) => pedirCodigo(e, true));
  $("btn-cambiar").addEventListener("click", volverACorreo);
  // ===== Panel del vendedor =====
  const $$ = (sel) => document.querySelectorAll(sel);
  const app = $("app");
  // Pesos enteros sin centavos, como en el mockup ($350, $2,000). Con centavos, dos decimales.
  const dinero = (n) => {
    const v = Number(n) || 0;
    const enteros = Number.isInteger(v);
    return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: enteros ? 0 : 2, maximumFractionDigits: enteros ? 0 : 2 }).format(v);
  };
  const enc = (s) => encodeURIComponent(s);
  const WA_AYUDA = "https://wa.me/522201435851?text=" + encodeURIComponent("Hola, soy vendedor de Bien Visto y necesito ayuda con mi panel.");
  const ESTADOS = {
    libre: ["Libre", ""], activo: ["Activo", "v"], retirado: ["Retirado", "g"], prueba: ["En prueba", ""],
    pendiente: ["Pendiente", ""], rev: ["En revisión", ""], cobrada: ["Cobrada", "v"],
    entregada: ["Entregada", "v"], anulada: ["Anulada", "r"],
  };
  const ICONO_QR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M8 12h8"/></svg>';
  const ICONO_NFC = '<svg viewBox="0 0 24 24" fill="none" stroke="#12302B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="#12302B"/><path d="M10 8.5a5 5 0 0 1 0 7M13.5 5.8a9 9 0 0 1 0 12.4M17 3.2a13 13 0 0 1 0 17.6"/></svg>';

  let nombreVend = "";
  let correoVend = "";
  let enPanel = false;
  let ventasCache = [];
  let aviso = null;
  let turno = 0;

  function el(tag, props, hijos) {
    const n = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (k === "texto") n.textContent = v;
      else if (k === "clase") n.className = v;
      else if (k === "on") { for (const ev in v) n.addEventListener(ev, v[ev]); }
      else if (k === "checked") n.checked = !!v;
      else n.setAttribute(k, v);
    }
    for (const h of hijos || []) n.append(h);
    return n;
  }

  // Solo recibe SVG fijos del código, nunca datos del servidor.
  function icono(svgFijo) {
    const t = document.createElement("template");
    t.innerHTML = svgFijo.trim();
    return t.content.firstChild;
  }

  function chip(estado, textoFijo, claseFija) {
    const [txt, cls] = ESTADOS[estado] || [estado, "g"];
    return el("span", { clase: ("chip " + (claseFija !== undefined ? claseFija : cls)).trim(), texto: textoFijo || txt });
  }

  function campo(etiqueta, control) {
    return el("label", { clase: "campo" }, [el("span", { clase: "lbl", texto: etiqueta }), control]);
  }

  function menuItem(txt, href) {
    return el("button", { type: "button", clase: "item", on: { click: () => ir(href) } }, [el("b", { texto: txt })]);
  }

  function conAviso(nodos) {
    if (aviso) { nodos.unshift(el("div", { clase: "aviso", texto: aviso })); aviso = null; }
    return nodos;
  }

  const ir = (ruta) => { location.hash = ruta; };
  const ruta = () => location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map((p) => decodeURIComponent(p));

  function sesionCaducada() {
    enPanel = false;
    volverACorreo();
    texto($("msg-correo"), "Tu sesión venció. Entra de nuevo con tu correo.", "err");
  }

  async function getJSON(rutaApi) {
    const res = await fetch(rutaApi);
    if (res.status === 401) { sesionCaducada(); return null; }
    if (!res.ok) throw new Error("http " + res.status);
    return res.json();
  }

  async function postJSON(rutaApi, cuerpo) {
    const res = await fetch(rutaApi, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo || {}),
    });
    if (res.status === 401) { sesionCaducada(); return { status: 401, datos: null }; }
    let datos = null;
    try { datos = await res.json(); } catch (_) { datos = null; }
    return { status: res.status, datos };
  }

  function errorDe(datos) {
    return (datos && datos.error) || MSG_ERROR_GENERAL;
  }

  const PANTALLAS = {
    hoy: pHoy, vender: pVender, prueba: pPrueba, escanear: pEscanear, lote: pLote, bloqueo: pBloqueo, desempeno: pDesempeno, displays: pDisplays, d: pDetalle, solicitar: pSolicitar, saldo: pSaldo,
    ventas: pVentas, v: pVenta, varios: pVarios, cuenta: pCuenta, "datos-cobro": pDatosCobro, p: pProximamente,
  };
  const PESTANA = { hoy: "hoy", vender: "hoy", prueba: "hoy", escanear: "hoy", bloqueo: "saldo", desempeno: "varios", displays: "displays", d: "displays", saldo: "saldo" };

  async function render() {
    if (!enPanel) return;
    const r = ruta();
    const pantalla = r.length ? r[0] : "hoy";
    const fn = PANTALLAS[pantalla] || pHoy;
    const mi = ++turno;
    const pestana = PESTANA[pantalla] || "varios";
    for (const b of $$(".tabs button")) {
      if (b.dataset.tab === pestana) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    }
    // Como en el mockup: las cuatro pestañas raíz no muestran Atrás.
    $("btn-atras").hidden = ["hoy", "varios", "displays", "saldo"].includes(pantalla);
    app.replaceChildren(el("p", { clase: "hint", texto: "Cargando…" }));
    window.scrollTo(0, 0);
    try {
      const nodos = await fn(r.slice(1));
      if (mi === turno && nodos) app.replaceChildren(...nodos, ayudaDePantalla(pantalla));
    } catch (_) {
      if (mi === turno) app.replaceChildren(el("p", { clase: "msg err", texto: MSG_ERROR_RED }));
    }
  }

  async function entrarPanel() {
    enPanel = true;
    try {
      const d = await getJSON("/api/vendedor/yo");
      if (d) { nombreVend = d.nombre || ""; correoVend = d.correo || ""; }
    } catch (_) { /* la pantalla muestra su propio error */ }
    if (!location.hash || location.hash === "#") ir("#/hoy");
    render();

  // Ruta según el estado del display: libre → vender; en prueba → pantalla de prueba; si no → detalle.
  const rutaParaDisplay = (x) => {
    if (x.estado === "libre") return "#/vender/" + enc(x.folio);
    if (x.estado === "prueba") return "#/prueba/" + enc(x.folio);
    return "#/d/" + enc(x.folio);
  };

  // Escaneo desde Inicio: la cámara solo se abre al tocar el botón.
  async function pEscanear() {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const displays = d.displays || [];
    const msg = el("p", { clase: "msg", role: "status" });
    const visor = el("div", {});
    let parar = () => {};
    const resolver = (folio) => {
      parar();
      visor.replaceChildren();
      const x = displays.find((y) => y.folio === folio);
      if (!x) return texto(msg, "Ese QR no es de un display de tu inventario.", "err");
      ir(rutaParaDisplay(x));
    };
    const abrirCamara = () => {
      visor.replaceChildren();
      leerQr(resolver, (cancelar) => {
        parar = cancelar;
        visor.append(el("button", { type: "button", clase: "btn s sm", on: { click: () => { cancelar(); visor.replaceChildren(); } } }, ["Cerrar cámara"]));
      }, (m, video) => {
        if (video) { visor.prepend(video); return; }
        texto(msg, m, "err");
      });
    };
    return [
      el("h2", { texto: "Escanear el QR" }),
      el("p", { clase: "sub", texto: "Apunta la cámara al QR impreso en el display. La cámara solo se abre cuando tocas el botón." }),
      el("button", { type: "button", clase: "btn p", on: { click: abrirCamara } }, ["Abrir cámara"]),
      visor,
      msg,
      el("p", { clase: "hint", texto: "Si la cámara no funciona, escribe el folio de cuatro caracteres desde Inicio." }),
    ];
  }

  async function pHoy() {
    const [s, d] = await Promise.all([getJSON("/api/vendedor/saldo"), getJSON("/api/vendedor/displays")]);
    if (!s || !d) return null;
    const libres = (d.displays || []).filter((x) => x.estado === "libre").length;
    const primer = nombreVend.split(" ")[0] || "";
    const plazo = s.horas_restantes === null ? "Sin plazo corriendo"
      : s.plazo_vencido ? "Plazo vencido"
      : s.horas_restantes + " h para entregar";
    const folioInput = el("input", { placeholder: "Ej. M3K7", maxlength: "4", autocomplete: "off", autocapitalize: "characters", "aria-label": "Folio del display" });
    const folioMsg = el("p", { clase: "msg", role: "status" });
    const abrirFolio = () => {
      const folio = folioInput.value.trim().toUpperCase();
      if (folio.length !== 4) return;
      const existe = (d.displays || []).find((x) => x.folio === folio);
      if (!existe) return texto(folioMsg, "No encontramos ese folio en tu inventario.", "err");
      ir(rutaParaDisplay(existe));
    };
    folioInput.addEventListener("input", () => { if (folioInput.value.trim().length === 4) abrirFolio(); });
    const nodos = [el("h2", { texto: "Hola, " + primer })];
    if (s.impago) nodos.push(el("div", { clase: "aviso alerta", texto: "Tienes un adeudo por impago. No puedes activar displays nuevos." }));
    nodos.push(
      el("button", { type: "button", clase: "venta", on: { click: () => ir("#/vender") } }, [
        el("span", { clase: "vi" }, [icono(ICONO_NFC)]),
        el("span", { clase: "vt" }, [el("b", { texto: "Vender un display" }), el("span", { texto: "Acerca tu celular al display para empezar." })]),
      ]),
      el("button", { type: "button", clase: "btn s qr", on: { click: () => ir("#/escanear") } }, [icono(ICONO_QR), "Escanear el QR del display"]),
      el("span", { clase: "lbl", texto: "¿Prefieres escribir el folio?" }),
      el("form", { novalidate: "", on: { submit: (e) => { e.preventDefault(); abrirFolio(); } } }, [folioInput]),
      el("p", { clase: "hint", texto: "Son 4 caracteres y abre solo." }),
      folioMsg,
      el("div", { clase: "mini" }, [
        el("button", { type: "button", clase: s.impago || s.plazo_vencido ? "alerta" : "", on: { click: () => ir("#/saldo") } }, [
          el("b", { texto: "Debes entregar " + dinero(s.custodia) }), el("span", { texto: plazo }),
        ]),
        el("button", { type: "button", on: { click: () => ir("#/displays") } }, [
          el("b", { texto: libres + (libres === 1 ? " libre" : " libres") }), el("span", { texto: "en tu inventario" }),
        ]),
      ]),
    );
    return conAviso(nodos);
  }

  // Filtro y búsqueda de Mis displays: se recuerdan mientras la app está abierta.
  let filtroDisplays = "todos";
  let busquedaDisplays = "";

  async function pDisplays() {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const lista = d.displays || [];
    if (!lista.length) return conAviso([el("h2", { texto: "Mis displays" }), el("p", { clase: "hint", texto: "Aún no tienes displays asignados." })]);

    const ESTADOS_FILTRO = [["todos", "Todos"], ["activo", "Activo"], ["prueba", "Prueba"], ["libre", "Libre"], ["retirado", "Retirado"]];
    const cuenta = (e) => (e === "todos" ? lista.length : lista.filter((x) => x.estado === e).length);
    const ul = el("ul", { clase: "lista-plana" });
    const botones = new Map();
    const resumen = el("p", { clase: "sub" });
    const buscar = el("input", { type: "search", placeholder: "Buscar…", "aria-label": "Buscar displays", value: busquedaDisplays });

    const pintar = () => {
      const q = busquedaDisplays.trim().toLowerCase();
      const visibles = lista.filter((x) =>
        (filtroDisplays === "todos" || x.estado === filtroDisplays) &&
        (!q || x.folio.toLowerCase().includes(q) || (x.negocio_asignado || "").toLowerCase().includes(q) || (x.direccion || "").toLowerCase().includes(q))
      );
      for (const [e, b] of botones) b.setAttribute("aria-pressed", String(e === filtroDisplays));
      resumen.textContent = lista.length + " en total · busca por folio, cliente o negocio.";
      ul.replaceChildren(...visibles.map((x) =>
        el("li", {}, [
          el("button", { type: "button", clase: "li", on: { click: () => ir("#/d/" + enc(x.folio)) } }, [
            el("span", { clase: "folio sm", texto: x.folio }),
            el("span", { clase: "grow" }, [
              el("span", { clase: "t", texto: x.negocio_asignado || "Sin asignar" }),
              el("span", { clase: "m", texto: (x.prueba_min_restantes != null ? "Prueba · quedan " + x.prueba_min_restantes + " min" : x.direccion || "En inventario") }),
            ]),
            chip(x.estado),
          ]),
        ])
      ));
      if (!visibles.length) ul.replaceChildren(el("li", { clase: "hint", texto: "Ningún display coincide con la búsqueda o el filtro." }));
    };

    buscar.addEventListener("input", () => { busquedaDisplays = buscar.value; pintar(); });
    const seg = el("div", { clase: "seg", role: "group", "aria-label": "Filtrar por estado" }, ESTADOS_FILTRO.map(([e, txt]) => {
      const b = el("button", { type: "button", on: { click: () => { filtroDisplays = e; pintar(); } } }, [txt + " " + cuenta(e)]);
      botones.set(e, b);
      return b;
    }));
    pintar();
    return conAviso([el("h2", { texto: "Displays" }), resumen, el("div", { clase: "campo" }, [buscar]), seg, ul]);
  }

  const ETIQUETA_TRANSICION = {
    "libre>activo": "Activado con un negocio",
    "activo>libre": "Liberado para otro negocio",
    "libre>prueba": "Prueba iniciada",
    "prueba>activo": "Cobrado y activado",
    "prueba>libre": "Prueba terminada",
    "activo>retirado": "Retirado de servicio",
  };

  // Datos secundarios del detalle: si fallan, la pantalla sigue con lo principal.
  async function datosDetalle(folio) {
    const [sols, hist] = await Promise.all([
      getJSON("/api/vendedor/solicitudes").catch(() => null),
      getJSON("/api/vendedor/displays/" + enc(folio) + "/historial").catch(() => null),
    ]);
    const solicitud = sols && (sols.solicitudes || []).find((x) => x.folio === folio && x.estado === "pendiente")
      || sols && (sols.solicitudes || []).find((x) => x.folio === folio && x.estado === "rechazada")
      || null;
    return { solicitud, historial: hist ? hist.estados || [] : [], escaneosDia: hist && Array.isArray(hist.escaneos_por_dia) ? hist.escaneos_por_dia : [] };
  }

  async function pDetalle([folio]) {
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const f = (d.displays || []).find((x) => x.folio === folio);
    if (!f) return [el("p", { clase: "msg err", texto: "No encontramos ese display." })];
    const extra = await datosDetalle(f.folio);
    const botones = [];
    const msg = el("p", { clase: "msg", role: "status" });

    if (f.estado === "activo") {
      if (f.url_destino) {
        botones.push(el("a", { clase: "btn p", href: f.url_destino, target: "_blank", rel: "noopener" }, ["Probar enlace de reseña"]));
      }
      const pendiente = extra.solicitud && extra.solicitud.estado === "pendiente";
      if (!pendiente) {
        botones.push(el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/solicitar/" + enc(f.folio) + "/cambiar") } }, ["Solicitar cambio de negocio"]));
        botones.push(el("button", { type: "button", clase: "btn s", on: { click: () => ir("#/solicitar/" + enc(f.folio) + "/reponer") } }, ["Solicitar reposición"]));
      }
    }
    // La venta que activó este display: el servidor valida que aún se pueda anular.
    if (f.venta_id && ["pendiente", "rev", "cobrada"].includes(f.venta_estado)) {
      const anular = el("button", { type: "button", clase: "helpl quiet" }, ["Solicitar anulación de la venta"]);
      anular.addEventListener("click", async () => {
        anular.disabled = true;
        try {
          const { status, datos } = await postJSON("/api/vendedor/solicitudes", { tipo: "anular", venta_id: f.venta_id });
          if (status === 201 && datos && datos.success) {
            aviso = "Solicitud de anulación enviada.";
            render();
          } else if (status !== 401) {
            texto(msg, errorDe(datos), "err");
          }
        } catch (_) {
          texto(msg, MSG_ERROR_RED, "err");
        } finally {
          anular.disabled = false;
        }
      });
      botones.push(anular);
    }
    if (f.estado === "libre") {
      botones.push(el("button", { type: "button", clase: "btn p", on: { click: () => ir("#/vender/" + enc(f.folio)) } }, ["Activar display"]));
    }
    if (f.estado === "prueba") {
      botones.push(el("button", { type: "button", clase: "btn p", on: { click: () => ir("#/vender/" + enc(f.folio)) } }, ["Cobrar y activar"]));
      const terminar = el("button", { type: "button", clase: "btn s" }, ["Terminar prueba"]);
      terminar.addEventListener("click", async () => {
        terminar.disabled = true;
        try {
          const { status, datos } = await postJSON("/api/vendedor/pruebas/" + enc(f.folio) + "/terminar", {});
          if (status === 200 && datos && datos.success) {
            aviso = "Prueba terminada. " + f.folio + " quedó libre.";
            ir("#/displays");
          } else if (status !== 401) {
            texto(msg, errorDe(datos), "err");
          }
        } catch (_) {
          texto(msg, MSG_ERROR_RED, "err");
        } finally {
          terminar.disabled = false;
        }
      });
      botones.push(terminar);
    }

    const bloques = [
      el("div", { clase: "fila", style: "justify-content:flex-start;gap:10px;margin:0 0 4px" }, [el("span", { clase: "folio", texto: f.folio }), chip(f.estado)]),
      el("b", { texto: f.negocio_asignado || "Sin asignar", style: "display:block;font:600 19px/1.25 var(--fd);margin:0 0 12px" }),
    ];

    if (extra.solicitud) {
      const s2 = extra.solicitud;
      const tipoTxt = s2.tipo === "cambiar" ? "Cambio de negocio" : "Reposición";
      bloques.push(el("div", { clase: "tarjeta", role: "status", style: s2.estado === "rechazada" ? "border-color:var(--danger)" : "" }, [
        el("span", { clase: "lbl", texto: s2.estado === "pendiente" ? "Solicitud en revisión" : "Solicitud rechazada" }),
        el("b", { texto: tipoTxt }),
        s2.estado === "rechazada" && s2.motivo_rechazo ? el("p", { clase: "hint", texto: s2.motivo_rechazo }) : el("p", { clase: "hint", texto: "Bien Visto la revisa y te avisa." }),
      ]));
    }

    bloques.push(el("div", { clase: "tarjeta" }, [el("dl", { clase: "kv", style: "margin:0" }, [
      el("dt", { texto: "Enlace" }), el("dd", { texto: "ir.bienvisto.com.mx/" + f.folio.toLowerCase() }),
      el("dt", { texto: "Negocio" }), el("dd", { texto: f.negocio_asignado || "Sin asignar" }),
      ...(f.direccion ? [el("dt", { texto: "Dirección" }), el("dd", { texto: f.direccion })] : []),
      ...(f.prueba_min_restantes != null ? [el("dt", { texto: "Prueba" }), el("dd", { texto: "Quedan " + f.prueba_min_restantes + " min" })] : []),
    ])]));

    if (f.estado === "activo" || f.estado === "retirado") {
      const n = Number(f.escaneos_7d) || 0;
      const dias = extra.escaneosDia;
      const max = dias.reduce((a, d) => Math.max(a, d.n), 0);
      const LETRAS = ["D", "L", "M", "X", "J", "V", "S"];
      const grafica = dias.length === 7 ? el("div", { clase: "escaneos-dia", "aria-label": "Escaneos por día" }, dias.map((d) =>
        el("div", {}, [
          el("div", { clase: d.n ? "b" : "b vacio", style: "height:" + (max && d.n ? Math.max(6, Math.round((d.n / max) * 100)) : 4) + "%" }),
          el("div", { clase: "d", texto: LETRAS[new Date(d.dia + "T12:00:00Z").getUTCDay()] }),
        ])
      )) : null;
      bloques.push(el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Escaneos, últimos 7 días" }),
        el("div", { clase: "grande", texto: String(n) }),
        ...(grafica ? [grafica] : []),
        el("p", { clase: "hint", style: "margin:0", texto: n + " en total · el reporte mensual separa NFC y QR" }),
      ]));
    }

    if (f.estado === "retirado") {
      bloques.push(el("div", { clase: "aviso alerta", texto: "Este display está retirado. Quien lo escanee verá un botón al negocio en Google Maps. Si crees que fue un error, escribe a Bien Visto." }));
    }

    bloques.push(...botones, msg);

    if (extra.historial.length) {
      const items = extra.historial.slice(0, 20).map((h) => {
        const clave = h.estado_anterior + ">" + h.estado_nuevo;
        const etiqueta = ETIQUETA_TRANSICION[clave] || ("Estado: " + (ESTADOS[h.estado_anterior] || [h.estado_anterior])[0] + " → " + (ESTADOS[h.estado_nuevo] || [h.estado_nuevo])[0]);
        return el("li", {}, [el("b", { texto: etiqueta }), el("span", { clase: "hint", texto: " · " + h.fecha.slice(0, 16).replace("T", " ") })]);
      });
      bloques.push(el("h3", { texto: "Historial" }), el("ul", { clase: "lista" }, items));
    }
    return bloques;
  }

    const nuevo = el("input", { maxlength: "200" });
    const url = el("input", { type: "url", placeholder: "https://..." });
    const motivo = el("input", { maxlength: "200" });
    const nota = el("textarea", { maxlength: "500" });
    const boton = el("button", { type: "submit", clase: "btn p" }, [cambiar ? "Enviar solicitud de cambio" : "Enviar solicitud de reposición"]);
    const form = el("form", { novalidate: "" }, [
      el("span", { clase: "lbl", texto: "Display" }),
      el("div", { clase: "folio sm", texto: folio }),
      ...(cambiar ? [campo("Nombre del nuevo negocio", nuevo), campo("Enlace de reseña de Google del nuevo negocio", url)] : []),
      campo("Motivo (opcional)", motivo),
      campo("Nota (opcional)", nota),
      boton,
      msg,
    ]);
    form.addEventListener("submit", async (e) => {

      boton.disabled = true;

  // Hoja con los datos para transferir. Cada dato tiene su botón para copiarlo.
  const formatoClabe = (c) => String(c).replace(/^(\d{3})(\d{3})(\d{11})(\d)$/, "$1 $2 $3 $4");
  async function abrirDatosPago(monto) {
    const cerrar = () => { hoja.remove(); document.removeEventListener("keydown", alTeclear); };
    const alTeclear = (e) => { if (e.key === "Escape") cerrar(); };
    const hoja = el("div", { clase: "hoja-fondo", on: { click: (e) => { if (e.target === hoja) cerrar(); } } }, [
      el("section", { clase: "hoja", role: "dialog", "aria-modal": "true", "aria-labelledby": "hoja-datos-t" }, [
        el("div", { clase: "hoja-top" }, [
          el("h2", { id: "hoja-datos-t", texto: "Datos de Bien Visto" }),
          el("button", { type: "button", clase: "btn s sm", on: { click: cerrar } }, ["Cerrar"]),
        ]),
        el("p", { clase: "hint", texto: "Toca el icono de cada dato para copiarlo y pégalo en la app de tu banco. Revisa que el titular y la CLABE coincidan antes de confirmar." }),
        el("div", { clase: "hoja-cuerpo" }, [el("p", { clase: "hint", texto: "Cargando…" })]),
      ]),
    ]);
    document.body.append(hoja);
    document.addEventListener("keydown", alTeclear);
    const cuerpo = hoja.querySelector(".hoja-cuerpo");
    const [datos, yo] = await Promise.all([
      getJSON("/api/vendedor/datos-pago").catch(() => null),
      getJSON("/api/vendedor/yo").catch(() => null),
    ]);
    if (!hoja.isConnected) return;
    if (!datos) {
      cuerpo.replaceChildren(el("p", { clase: "msg err", role: "status", texto: "No pudimos cargar los datos para transferir. Intenta de nuevo." }));
      return;
    }
    if (datos.error) {
      cuerpo.replaceChildren(el("p", { clase: "msg err", role: "status", texto: datos.error }));
      return;
    }
    const primer = ((yo && yo.nombre) || "").trim().split(/\s+/)[0] || "";
    const filas = [
      ["Titular", datos.titular, datos.titular],
      ["Banco", datos.banco, datos.banco],
      ["CLABE", formatoClabe(datos.clabe), datos.clabe],
      ...(datos.cuenta ? [["Cuenta", datos.cuenta, datos.cuenta]] : []),
      ["Concepto", "BV " + primer.toUpperCase(), "BV " + primer.toUpperCase()],
      ...(monto > 0 ? [["Monto a entregar", dinero(monto), String(monto)]] : []),
    ];
    cuerpo.replaceChildren(...filas.map(([etiqueta, mostrar, copia]) => {
      const boton = el("button", { type: "button", clase: "btn s sm", "aria-label": "Copiar " + etiqueta.toLowerCase(), on: { click: async () => {
        try { await navigator.clipboard.writeText(copia); } catch (_) {}
        boton.textContent = "Copiado";
        setTimeout(() => { boton.textContent = "Copiar"; }, 1800);
      } } }, ["Copiar"]);
      return el("div", { clase: "dato-pago" }, [
        el("div", {}, [el("span", { clase: "lbl", texto: etiqueta }), el("b", { texto: mostrar })]),
        boton,
      ]);
    }));
    hoja.querySelector(".hoja-top button").focus();
  }

  async function pSaldo() {

        el("dt", { texto: "Cómo la recibes" }), el("dd", { texto: "La retienes al cobrar" }),
      ])]),
      el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Cómo se reparte cada venta" }),
        el("div", { clase: "split" }, [
          el("div", {}, [el("b", { texto: dinero(PRECIO_DISPLAY) }), el("span", { texto: "Paga el cliente" })]),
          el("div", { clase: "me" }, [el("b", { texto: dinero(COMISION_DISPLAY) }), el("span", { texto: "Tu comisión" })]),
        ]),
        el("p", { clase: "hint", style: "margin:8px 0 0", texto: "De los " + dinero(PRECIO_DISPLAY) + ", tú te quedas " + dinero(COMISION_DISPLAY) + " y entregas " + dinero(ENTREGA_DISPLAY) + " a Bien Visto. Precio y comisión son fijos." }),
        el("p", { clase: "hint", style: "margin:6px 0 0", texto: "Si vendes " + PROMO_N + " juntos: el cliente paga " + dinero(PROMO_PRECIO) + ", tu comisión es " + dinero(PROMO_N * COMISION_DISPLAY) + " (la misma) y entregas " + dinero(PROMO_PRECIO - PROMO_N * COMISION_DISPLAY) + "." }),
      ]),
    );
    return nodos;
  }

  // Mis ventas y comisión (mockup): comisión ganada, aviso de privacidad y filas por venta.

    // La comisión de cada venta es lo que retuviste: total menos lo que entregas a Bien Visto.
    const comision = cuenta.reduce((a, v) => a + ((Number(v.total) || 0) - (Number(v.a_entregar) || 0)), 0);

      ]),
      el("div", { clase: "aviso", style: "font-size:14.5px" }, [el("b", { texto: "Por privacidad " }), "aquí no ves el contacto de tus clientes. Bien Visto envía y reenvía los recibos y las facturas por ti."]),
      el("ul", { clase: "lista-filas" }, ventasCache.map((v) => {

      ventasCache = d.ventas || [];

    const nodos = [

  // ===== Pantalla de prueba (según el mockup) =====
  // El negocio y el enlace de la prueba se guardan en este dispositivo. Si se cambia de teléfono, se busca el negocio otra vez.
  function guardarPrueba(folio, datos) {
    try { sessionStorage.setItem("bv_prueba_" + folio, JSON.stringify(datos)); } catch (_) { /* sin almacenamiento: se busca otra vez */ }
  }
  function leerPrueba(folio) {
    try { return JSON.parse(sessionStorage.getItem("bv_prueba_" + folio) || "null"); } catch (_) { return null; }
  }
  function borrarPrueba(folio) {
    try { sessionStorage.removeItem("bv_prueba_" + folio); } catch (_) { /* nada que borrar */ }
  }

  async function pPrueba([folio]) {
    const f = String(folio || "").toUpperCase();
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const x = (d.displays || []).find((y) => y.folio === f);
    if (!x || x.estado !== "prueba") {
      aviso = "Ese display ya no está en prueba.";
      ir("#/hoy");
      return null;
    }
    const minutos = x.prueba_min_restantes == null ? 0 : x.prueba_min_restantes;
    const total = 30;
    const dp = leerPrueba(f);
    const negocio = (dp && dp.negocio) || x.negocio_asignado || "Negocio";
    const msg = el("p", { clase: "msg", role: "status" });
    const confirmar = (titulo, texto2, label, accion) => {
      const hoja = el("div", { clase: "tarjeta" }, [
        el("b", { texto: titulo }),
        el("p", { clase: "hint", texto: texto2 }),
        el("button", { type: "button", clase: "btn p sm", style: "width:100%", on: { click: accion } }, [label]),
        el("button", { type: "button", clase: "btn s sm", style: "width:100%;margin-top:8px", on: { click: () => render() } }, ["Cancelar"]),
      ]);
      app.replaceChildren(hoja);
    };
    const terminar = async (siguiente) => {
      const { status, datos } = await postJSON("/api/vendedor/pruebas/" + enc(f) + "/terminar", {});
      if (status === 401) return;
      if (status === 200 && datos && datos.success) {
        borrarPrueba(f);
        ventasCache = [];
        siguiente();
      } else {
        texto(msg, errorDe(datos), "err");
      }
    };
    return [
      el("div", { clase: "fila", style: "justify-content:flex-start;gap:10px" }, [el("span", { clase: "folio", texto: f }), chip("prueba", "Modo prueba")]),
      el("h2", { texto: negocio }),
      el("p", { clase: "sub", texto: "El cliente ya puede acercar su celular: verá su reseña funcionando, con un aviso de demostración. Todavía no pagó y el display no es suyo. Cuando se convenza, sigue con la venta." }),
      el("div", { clase: "tarjeta" }, [
        el("span", { clase: "lbl", texto: "Tiempo de prueba" }),
        el("b", { texto: "Quedan " + minutos + " min", style: "display:block;font:600 30px/1 var(--fd);margin:4px 0 10px" }),
        el("div", { clase: "barra", role: "img", "aria-label": minutos + " de " + total + " minutos" }, [el("i", { style: "width:" + Math.round(minutos / total * 100) + "%" })]),
        el("p", { clase: "hint", texto: "Si el cliente no compra, el display queda libre y no se guarda ningún dato suyo." }),
      ]),
      el("button", { type: "button", clase: "btn a", on: { click: () => {
        sessionStorage.setItem("bv_seguir_" + f, "1");
        ir("#/vender/" + enc(f));
      } } }, ["Seguir con la venta"]),
      el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => {
        if (dp && dp.enlace) window.open(dp.enlace, "_blank", "noopener");
        else texto(msg, "Para ver la reseña, busca el negocio otra vez desde «Seguir con la venta».", "err");
      } } }, ["Ver lo que ve el cliente"]),
      el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => confirmar(
        "¿Terminar la prueba de " + f + "?",
        "El display queda libre y no se guarda ningún dato del cliente. No cuenta como venta.",
        "Terminar prueba",
        () => terminar(() => { aviso = "Prueba terminada. " + f + " quedó libre."; ir("#/hoy"); }),
      ) } }, ["Terminar la prueba"]),
      el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => confirmar(
        "¿Ya no lo está probando " + negocio + "?",
        f + " sigue en modo prueba (quedan " + minutos + " min). Si el cliente ya no lo está probando, el display se libera y puedes usarlo con otro negocio. No se guarda ningún dato del cliente anterior.",
        "Sí, ya no lo prueba",
        () => terminar(() => { aviso = f + " quedó libre."; ir("#/vender/" + enc(f)); }),
      ) } }, ["Usar este display con otro cliente"]),
      msg,
    ];
  }

  // ===== Venta por pasos (según el mockup): folio → negocio → confirmar → datos → cobro → listo =====
  const FOLIO_APP = /^[ABCDEFGHJKLMNPQRSTUVWXYZ][2-9][ABCDEFGHJKLMNPQRSTUVWXYZ][2-9]$/;
  const PRECIO_DISPLAY = 350;
  const PROMO_N = 3;
  const PROMO_PRECIO = 900;
  const MAX_LOTE = 50;
  const COMISION_DISPLAY = 150;
  const ENTREGA_DISPLAY = PRECIO_DISPLAY - COMISION_DISPLAY;
  const ENLACE_FACTURA = "https://bienvisto.com.mx/factura";
  const DOMINIOS_TYPO = { "gmial.com": "gmail.com", "gmai.com": "gmail.com", "gamil.com": "gmail.com", "gmail.co": "gmail.com", "gmail.con": "gmail.com", "hotmial.com": "hotmail.com", "hotmail.con": "hotmail.com", "outlok.com": "outlook.com", "outlook.con": "outlook.com", "yaho.com": "yahoo.com", "yahoo.con": "yahoo.com" };
  const sinAcentos = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  function errNombreCliente(v) {
    v = String(v || "").trim().replace(/\s+/g, " ");
    if (!v) return "Escribe el nombre de quien recibe el display.";
    if (/\d/.test(v)) return "El nombre no lleva números. Bórralos.";
    if (/@/.test(v)) return "Parece que escribiste un correo. Aquí va el nombre de la persona.";
    if (!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]+$/.test(v)) return "El nombre solo lleva letras y espacios. Quita los símbolos.";
    if (v.length > 60) return "El nombre es demasiado largo. Escribe solo nombre y apellido.";
    const palabras = v.split(" ").filter((x) => x.replace(/[.'-]/g, "").length);
    if (palabras.length < 2) return "Escribe nombre y apellido. Ejemplo: Rosa Ruiz.";
    return "";
  }
  function errWhatsappCliente(v) {
    if (!String(v || "").trim()) return "Escribe el WhatsApp del cliente.";
    if (/[a-z]/i.test(v)) return "El WhatsApp solo lleva números. Quita las letras.";
    let d = String(v).replace(/\D/g, "");
    if (d.length === 12 && d.startsWith("52")) d = d.slice(2);
    if (d.length === 13 && d.startsWith("521")) d = d.slice(3);
    if (d.length < 10) return "Le falta" + (10 - d.length === 1 ? "" : "n") + " " + (10 - d.length) + " dígito" + (10 - d.length === 1 ? "" : "s") + ": lleva " + d.length + " de 10. Revisa que incluya la lada (33, 55…).";
    if (d.length > 10) return "Le sobra" + (d.length - 10 === 1 ? "" : "n") + " " + (d.length - 10) + " dígito" + (d.length - 10 === 1 ? "" : "s") + ": lleva " + d.length + " y deben ser 10. No hace falta el +52 ni el 1.";
    return "";
  }
  function errCorreoCliente(v) {
    v = String(v || "").trim().toLowerCase();
    if (!v) return "";
    const arrobas = (v.match(/@/g) || []).length;
    if (arrobas === 0) return "Falta la @. Ejemplo: nombre@gmail.com";
    if (/\s/.test(v)) return "El correo no lleva espacios. Bórralos.";
    if (arrobas > 1) return "El correo tiene más de una @. Solo debe llevar una.";
    const [usuario, dominio] = v.split("@");
    if (!usuario) return "Falta lo que va antes de la @.";
    if (!dominio) return "Falta lo que va después de la @, por ejemplo gmail.com.";
    if (DOMINIOS_TYPO[dominio]) return "Parece que hay un error de dedo: ¿quisiste decir " + DOMINIOS_TYPO[dominio] + "?";
    if (!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(dominio)) return "La parte después de la @ no se ve bien. Ejemplo: gmail.com u hotmail.com";
    if (!/^[a-z0-9._%+-]+$/.test(usuario)) return "Antes de la @ solo van letras, números, puntos o guiones. Sin acentos ni ñ.";
    return "";
  }

  // Lectura del QR con la cámara: solo cuando el vendedor toca el botón. Si el navegador no puede leer QR, se teclea el folio.
  async function leerQr(onFolio, onCancelar, aviso) {
    if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      aviso("Tu navegador no puede leer el QR. Escribe el folio que está impreso al pie del display.");
      return;
    }
    let flujo = null;
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    const video = el("video", { playsinline: "", muted: "", autoplay: "", "aria-label": "Vista de la cámara" });
    const parar = () => { if (flujo) flujo.getTracks().forEach((t) => t.stop()); flujo = null; };
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch (_) {
      aviso("No pudimos abrir la cámara. Revisa el permiso del navegador o escribe el folio.");
      return;
    }
    video.srcObject = flujo;
    onCancelar(() => { parar(); });
    const tick = async () => {
      if (!flujo) return;
      try {
        const codigos = await detector.detect(video);
        for (const c of codigos) {
          const ruta = String(c.rawValue || "").split("?")[0].split("/").filter(Boolean).pop() || "";
          const folio = ruta.toUpperCase();
          if (FOLIO_APP.test(folio)) { parar(); return onFolio(folio); }
        }
      } catch (_) { /* cuadro sin QR: seguimos leyendo */ }
      setTimeout(tick, 300);
    };
    onFolio.video = video;
    aviso(null, video);
    video.play().catch(() => {});
    tick();
  }

  // Bloqueo para activar: mismas reglas que el panel de admin. El Worker vuelve a validar al cobrar.
  function bloqueoDe(s) {
    if (s.impago) return "deuda";
    if (s.plazo_vencido) return "horas";
    if (Number(s.custodia) + ENTREGA_DISPLAY > Number(s.tope)) return "tope";
    return "";
  }

  // Si el vendedor no puede activar, lleva a la pantalla de bloqueo. Devuelve true cuando se bloquea.
  async function bloqueadoParaActivar(folio) {
    const s = await getJSON("/api/vendedor/saldo");
    if (!s) return true;
    const b = bloqueoDe(s);
    if (b) ir("#/bloqueo" + (folio ? "/" + enc(folio) : ""));
    return Boolean(b);
  }

  async function pBloqueo([folio]) {
    const s = await getJSON("/api/vendedor/saldo");
    if (!s) return null;
    const b = bloqueoDe(s) || "tope";
    const titulo = b === "deuda" ? "Liquida tu adeudo para seguir" : "Entrega para seguir activando";
    const motivo = b === "deuda"
      ? "Bien Visto retiró displays por impago y quedó un adeudo pendiente."
      : b === "horas"
        ? "Tu plazo para entregar el dinero cobrado ya venció."
        : "Llegaste al tope de " + dinero(s.tope) + " de dinero de Bien Visto en tu poder.";
    const f = folio ? String(folio).toUpperCase() : "";
    return [
      el("h2", { texto: titulo }),
      el("p", { clase: "sub", texto: motivo + " Mientras no " + (b === "deuda" ? "lo liquides" : "entregues") + ", el panel no te deja activar más displays." + (f ? " El display " + f + " sigue libre." : "") }),
      el("div", { clase: "tarjeta" }, [el("dl", { clase: "kv" }, [
        el("dt", { texto: "En tu poder" }), el("dd", { texto: dinero(s.custodia) }),
        el("dt", { texto: "Tope" }), el("dd", { texto: dinero(s.tope) }),
      ])]),
      el("button", { type: "button", clase: "btn p", on: { click: () => ir("#/saldo") } }, ["Ver mi saldo y entregar"]),
    ];
  }

  async function pVender([folioPre]) {
    if (await bloqueadoParaActivar(folioPre)) return null;
    const d = await getJSON("/api/vendedor/displays");
    if (!d) return null;
    const displays = d.displays || [];
    const contenedor = el("div", {});
    const avisoGlobal = el("p", { clase: "msg", role: "status" });
    const st = { folio: null, negocio: null, cliente: null, clientes: null, form: { nombre: "", wa: "", mail: "" }, ventaId: null, pm: "efectivo", clienteNuevo: false };
    let parar = () => {};
    let turnoBusqueda = 0;
    let temporizador = null;

    const cargarClientes = async () => {
      if (st.clientes !== null) return;
      const c = await getJSON("/api/vendedor/clientes").catch(() => null);
      st.clientes = (c && c.clientes) || [];
    };

    const pintar = (...nodos) => { parar(); contenedor.replaceChildren(...nodos, avisoGlobal); };

    // Encabezado de los pasos de venta (folio, estado, enlace y progreso), como en el mockup.
    const encabezadoPaso = (paso) => {
      const d = displays.find((y) => y.folio === st.folio);
      return el("div", { clase: "encab-paso" }, [
        el("div", { clase: "fila", style: "justify-content:flex-start;gap:10px;margin-bottom:6px" }, [
          el("span", { clase: "folio", texto: st.folio }),
          chip(d ? d.estado : "libre"),
        ]),
        el("p", { clase: "hint", texto: "ir.bienvisto.com.mx/" + st.folio.toLowerCase(), style: "margin:0 0 10px" }),
        el("div", { clase: "steps" }, [1, 2, 3].map((i) => el("i", { clase: i <= paso ? "on" : "" }))),
      ]);
    };

    const folioValido = (f) => {
      const x = displays.find((y) => y.folio === f);
      if (!x) return "No encontramos ese folio en tu inventario.";
      if (x.estado === "activo") return "Ese display ya está activo. Búscalo en Mis displays.";
      return "";
    };

    // 1 · Entrada: folio, QR o folio tecleado
    const pantallaFolio = () => {
      const entrada = el("input", { placeholder: "Ej. M3K7", maxlength: "4", autocomplete: "off", autocapitalize: "characters", "aria-label": "Folio del display" });
      const msg = el("p", { clase: "msg", role: "status" });
      const visor = el("div", {});
      const continuar = (f) => {
        const e = folioValido(f);
        if (e) return texto(msg, e, "err");
        st.folio = f;
        pantallaNegocio();
      };
      pintar(
        el("h2", { texto: "Vender un display" }),
        el("p", { clase: "sub", texto: "Escanea el QR del display o escribe su folio." }),
        el("button", { type: "button", clase: "btn p", on: { click: () => {
          visor.replaceChildren();
          leerQr(continuar, (cancelar) => { parar = cancelar; visor.append(el("button", { type: "button", clase: "btn s sm", on: { click: () => { cancelar(); visor.replaceChildren(); } } }, ["Cerrar cámara"])); }, (m, video) => {
            if (video) { visor.prepend(video); return; }
            texto(msg, m, "err");
          });
        } } }, ["Escanear el QR del display"]),
        visor,
        el("form", { novalidate: "", on: { submit: (e) => { e.preventDefault(); const f = entrada.value.trim().toUpperCase(); if (f.length !== 4) return texto(msg, "El folio tiene 4 caracteres.", "err"); continuar(f); } } }, [
          el("label", { clase: "lbl", texto: "¿Prefieres escribir el folio?", for: "fol-v" }),
          el("div", { clase: "fila" }, [entrada, el("button", { type: "submit", clase: "btn s sm" }, ["Continuar"])]),
        ]),
        msg,
      );
      if (folioPre && !st.folio) {
        // llegó desde la landing con el folio: saltamos la entrada
      }
      entrada.id = "fol-v";
    };

    // 2 · Negocio: búsqueda en Google Maps o ubicación
    const pantallaNegocio = async () => {
      await cargarClientes();
      const resultados = el("ul", { clase: "lista resultados" });
      const avisoLista = (txto) => resultados.replaceChildren(el("li", {}, [el("span", { clase: "hint", texto: txto })]));
      const pintarLista = (lista) => {
        resultados.replaceChildren();
        for (const r of lista) {
          resultados.append(el("li", {}, [el("button", { type: "button", clase: "item", on: { click: () => { st.negocio = r; pantallaConfirmar(); } } }, [el("b", { texto: r.nombre }), el("span", { texto: r.direccion })])]));
        }
      };
      const buscarNegocio = async (q) => {
        const mi = ++turnoBusqueda;
        avisoLista("Buscando…");
        try {
          const res = await fetch("/api/vendedor/buscar-negocio?q=" + enc(q));
          if (res.status === 401) return sesionCaducada();
          const datos = await res.json().catch(() => null);
          if (mi !== turnoBusqueda) return;
          if (!res.ok) return avisoLista(errorDe(datos));
          const lista = (datos && datos.resultados) || [];
          if (!lista.length) return avisoLista("Sin resultados. Prueba con la colonia o la calle.");
          pintarLista(lista);
        } catch (_) {
          if (mi === turnoBusqueda) avisoLista(MSG_ERROR_RED);
        }
      };
      const ubicar = async () => {
        if (!navigator.geolocation) return avisoLista("Tu navegador no permite usar la ubicación. Escribe el nombre del negocio.");
        avisoLista("Buscando negocios cerca de ti…");
        try {
          const pos = await new Promise((ok, fail) => navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }));
          const res = await fetch("/api/vendedor/buscar-cercanos?lat=" + enc(String(pos.coords.latitude)) + "&lng=" + enc(String(pos.coords.longitude)));
          if (res.status === 401) return sesionCaducada();
          const datos = await res.json().catch(() => null);
          if (!res.ok) return avisoLista(res.status === 404 ? "La búsqueda por ubicación todavía no está disponible. Escribe el nombre del negocio." : errorDe(datos));
          const lista = (datos && datos.resultados) || [];
          if (!lista.length) return avisoLista("No encontramos negocios cerca de ti. Escribe el nombre del negocio.");
          pintarLista(lista);
        } catch (err) {
          avisoLista(err && err.code === 1 ? "Permite el acceso a tu ubicación en el navegador, o escribe el nombre del negocio." : "No pudimos obtener tu ubicación. Escribe el nombre del negocio.");
        }
      };
      const buscar = el("input", { placeholder: "Ej. Tacos La Esquina Zapopan", maxlength: "100", autocomplete: "off", "aria-label": "Buscar negocio en Google Maps" });
      buscar.addEventListener("input", () => {
        clearTimeout(temporizador);
        const q = buscar.value.trim();
        if (q.length < 3) { turnoBusqueda++; resultados.replaceChildren(); return; }
        temporizador = setTimeout(() => buscarNegocio(q), 450);
      });
      const nodos = [
        encabezadoPaso(1),
        el("h2", { texto: "¿Cuál es su negocio?" }),
        el("p", { clase: "sub", texto: "Escribe el nombre como aparece en Google Maps. Primero demuestras que funciona; los datos del cliente vienen después." }),
        el("button", { type: "button", clase: "clb", on: { click: () => pantallaCliente() } }, [
          el("span", { clase: "ic", "aria-hidden": "true" }, [icono('<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 5.2a3.4 3.4 0 0 1 0 6.4M18 14.4c2 .7 3.5 2.6 3.5 5.6"/></svg>')]),
          el("span", {}, [el("b", { texto: "¿Ya es cliente?" }), el("span", { clase: "s", texto: "Búscalo por su nombre y elige su negocio" })]),
          icono('<svg class="ch" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'),
        ]),
        el("label", { clase: "lbl", texto: "Buscar en Google Maps", for: "bus-n" }),
        (buscar.id = "bus-n", buscar),
        el("button", { type: "button", clase: "btn s sm", style: "margin:12px 0 12px", on: { click: ubicar } }, ["Usar mi ubicación: negocios cerca de mí"]),
        resultados,
        ...preguntaDesplegable("¿No aparece el negocio?", "Escribe la colonia o la calle junto con el nombre, por ejemplo «Tacos La Esquina Patria». Si no sale, el negocio puede no tener ficha en Google Maps."),
      ];
      pintar(...nodos);
      buscar.focus();
    };

    // 2b · Buscar cliente existente
    const pantallaCliente = async () => {
      await cargarClientes();
      const lista = el("div", { clase: "res" });
      const pintarClientes = (q) => {
        const qn = sinAcentos(q).trim();
        const r = st.clientes.filter((c) => !qn || qn.split(/\s+/).every((w) => sinAcentos(c.nombre + " " + c.empresa).includes(w)));
        lista.replaceChildren(...r.map((c) => el("button", { type: "button", on: { click: () => { st.cliente = c; st.form = { nombre: c.nombre, wa: "", mail: "" }; pantallaNegocio(); } } }, [el("b", { texto: c.nombre }), el("span", { texto: c.empresa })])));
        if (!r.length) lista.replaceChildren(el("p", { clase: "hint", texto: "Nadie coincide. Prueba con otra palabra o regístralo como cliente nuevo." }));
      };
      const buscar = el("input", { type: "search", autocomplete: "off", placeholder: "Ej. Rosa, Ruiz o Tacos", "aria-label": "Cliente o negocio" });
      buscar.addEventListener("input", () => pintarClientes(buscar.value));
      pintar(
        el("h2", { texto: "Buscar cliente" }),
        el("p", { clase: "sub", texto: "Escribe el nombre de la persona o del negocio." }),
        buscar,
        lista,
        el("button", { type: "button", clase: "btn s sm", style: "margin-top:12px", on: { click: () => { st.cliente = null; st.clienteNuevo = true; pantallaNegocio(); } } }, ["Es cliente nuevo"]),
      );
      pintarClientes("");
      buscar.focus();
    };

    // Respuesta corta que se abre y cierra en la misma pantalla, sin cambiar de ruta.
    const preguntaDesplegable = (titulo, respuestaTexto) => {
      const respuesta = el("p", { clase: "hint", hidden: true, texto: respuestaTexto });
      const pregunta = el("button", { type: "button", clase: "helpl quiet", "aria-expanded": "false", on: { click: () => {
        const abrir = respuesta.hidden;
        respuesta.hidden = !abrir;
        pregunta.setAttribute("aria-expanded", String(abrir));
      } } }, [titulo]);
      return [pregunta, respuesta];
    };

    // 3 · ¿Es este?
    const pantallaConfirmar = () => {
      const p = st.negocio;
      pintar(
        encabezadoPaso(1),
        el("h2", { texto: "¿Es este?" }),
        el("p", { clase: "sub", texto: "Confirma con el cliente: nombre y dirección." }),
        el("div", { clase: "tarjeta" }, [el("b", { texto: p.nombre }), el("span", { texto: p.direccion })]),
        el("div", { clase: "aviso", texto: "Cuando alguien escanee el QR o acerque su celular a " + st.folio + ", se abrirá Google Maps listo para dejar una reseña de este negocio. El enlace se crea solo." }),
        el("button", { type: "button", clase: "btn a", style: "margin-top:12px", on: { click: () => probarDisplay() } }, ["Probar el display ahora"]),
        el("p", { clase: "hint", texto: "El cliente ve su reseña funcionando durante 30 minutos y todavía no paga nada. Si no compra, el display queda libre y no se guarda nada." }),
        el("button", { type: "button", clase: "btn p", on: { click: () => pantallaDatos() } }, ["Ya quiere comprarlo: ir al cobro"]),
        el("button", { type: "button", clase: "btn s", style: "margin-top:8px", on: { click: () => pantallaNegocio() } }, ["No es este: buscar otro"]),
        ...preguntaDesplegable("¿Cómo sé que es la sucursal correcta?", "Lee la dirección en voz alta con el cliente. Si coincide con el local donde estás, es esa."),
      );
    };

    const probarDisplay = async () => {
      const { status, datos } = await postJSON("/api/vendedor/pruebas", { folio: st.folio, negocio: st.negocio.nombre, url_resena: st.negocio.enlace_resena });
      if (status === 200 && datos && datos.success) {
        ventasCache = [];
        guardarPrueba(st.folio, { negocio: st.negocio.nombre, direccion: st.negocio.direccion, enlace: st.negocio.enlace_resena });
        aviso = "Prueba iniciada: 30 minutos.";
        ir("#/prueba/" + enc(st.folio));
      } else if (status !== 401) {
        texto(avisoGlobal, errorDe(datos), "err");
      }
    };

    // 4 · Datos del cliente
    const pantallaDatos = () => {
      const campos = {};
      const avisos = {};
      const validar = (k) => {
        const f = { nombre: errNombreCliente, wa: errWhatsappCliente, mail: errCorreoCliente }[k];
        const err = f(campos[k].value);
        avisos[k].textContent = err;
        avisos[k].hidden = !err;
        campos[k].setAttribute("aria-invalid", err ? "true" : "false");
        return !err;
      };
      const campo = (k, etiqueta, opts) => {
        campos[k] = el("input", Object.assign({ autocomplete: "off", value: st.form[k === "nombre" ? "nombre" : k === "wa" ? "wa" : "mail"] }, opts));
        avisos[k] = el("p", { clase: "err", role: "alert", hidden: "" });
        campos[k].addEventListener("blur", () => { if (campos[k].value.trim()) validar(k); });
        campos[k].addEventListener("input", () => { if (avisos[k].hidden === false) validar(k); });
        return el("div", { clase: "campo" }, [el("label", { clase: "lbl", texto: etiqueta, for: "dato-" + k }), (campos[k].id = "dato-" + k, campos[k]), avisos[k]]);
      };
      pintar(
        encabezadoPaso(2),
        el("h2", { texto: "Datos del cliente" }),
        el("p", { clase: "sub", texto: "Ya vio que funciona. Anota a quién le llegará su recibo." }),
        campo("nombre", "Nombre", { placeholder: "Nombre de quien lo recibe" }),
        campo("wa", "WhatsApp", { inputmode: "tel", placeholder: "33 1234 5678" }),
        el("p", { clase: "hint", texto: "10 dígitos: lada y número, sin +52." }),
        campo("mail", "Correo (opcional)", { inputmode: "email", autocapitalize: "off", placeholder: "nombre@gmail.com" }),
        el("p", { clase: "hint", texto: "Si lo pones, el recibo también le llega por correo." }),
        el("button", { type: "button", clase: "btn a", on: { click: () => {
          const ok = ["nombre", "wa", "mail"].map((k) => validar(k)).every(Boolean);
          if (!ok) return;
          st.form = { nombre: campos.nombre.value.trim(), wa: campos.wa.value.trim(), mail: campos.mail.value.trim().toLowerCase() };
          pantallaCobro();
        } } }, ["Siguiente: cobrar " + dinero(PRECIO_DISPLAY)]),
      );
    };

    // 5 · Cobro: efectivo o transferencia (como en el mockup)
    const pantallaCobro = () => {
      let metodo = "efectivo";
      let cuentaVigente;
      const marca = el("input", { type: "checkbox", id: "marca-cobro" });
      const etiquetaMarca = el("span", {});
      const aviso5 = el("p", { clase: "err", role: "alert", hidden: "" });
      const msgCobro = el("p", { clase: "msg", role: "status" });
      const rastreo = el("input", { id: "rastreo-cobro", autocapitalize: "characters", autocomplete: "off", maxlength: "100", placeholder: "Ej. 0123456789" });
      const zona = el("div", {});
      const botonesMetodo = {};
      const pintarMarca = () => {
        etiquetaMarca.textContent = metodo === "efectivo"
          ? "Confirmo que cobré " + dinero(PRECIO_DISPLAY) + " en efectivo y me comprometo a entregar " + dinero(ENTREGA_DISPLAY) + " a Bien Visto."
          : "Confirmo que el pago de " + dinero(PRECIO_DISPLAY) + " ya cayó en mi cuenta y me comprometo a entregar " + dinero(ENTREGA_DISPLAY) + " a Bien Visto.";
      };
      const bloquearMetodo = () => { for (const b of Object.values(botonesMetodo)) b.disabled = true; };
      // Crea la venta una sola vez (pendiente); después se reutiliza para compartir o activar.
      const asegurarVenta = async () => {
        if (st.ventaId) return true;
        const crear = await postJSON("/api/vendedor/ventas", { negocio: st.negocio.nombre, contacto: st.form.nombre, whatsapp: st.form.wa, correo: st.form.mail || null, metodo, direccion: st.negocio.direccion, folios: [st.folio] });
        if (crear.status === 401) return false;
        if (!(crear.status === 201 && crear.datos && crear.datos.success)) {
          texto(msgCobro, errorDe(crear.datos), "err");
          return false;
        }
        st.ventaId = crear.datos.id;
        bloquearMetodo();
        return true;
      };
      const enlacePago = () => "https://ir.bienvisto.com.mx/pago/" + st.ventaId;
      const copiarEnlace = el("button", { type: "button", clase: "btn s", on: { click: async () => {
        if (!(await asegurarVenta())) return;
        try {
          await navigator.clipboard.writeText(enlacePago());
          texto(msgCobro, "Enlace copiado. Pégalo en el WhatsApp de tu cliente.", "ok");
        } catch (_) {
          texto(msgCobro, "No pudimos copiarlo. Enlace: " + enlacePago(), "err");
        }
      } } }, ["Copiar enlace"]);
      const compartir = el("button", { type: "button", clase: "btn p", on: { click: async () => {
        if (!st.ventaId && !(await asegurarVenta())) return;
        const texto2 = "Paga tu display Bien Visto aquí: " + enlacePago();
        if (!navigator.share) return copiarEnlace.click();
        try {
          await navigator.share({ title: "Datos para pagar", text: texto2 });
        } catch (err) {
          if (err && err.name === "AbortError") return;
          copiarEnlace.click();
        }
      } } }, ["Compartir datos"]);

      const pintarZona = async () => {
        if (metodo === "efectivo") {
          zona.replaceChildren(el("div", { clase: "tarjeta" }, [el("b", { texto: "Efectivo" }), el("span", { texto: "Cuenta el dinero frente al cliente antes de activar." })]));
